# Déploiement de référence. Secrets dans .env (voir .env.example). HTTPS assuré par le reverse proxy de l'hôte.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tournois
      POSTGRES_USER: tn_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data, ./db-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "tn_owner"], interval: 5s, retries: 10 }
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tn_app:${DB_APP_PASSWORD}@db:5432/tournois
      MIGRATION_DATABASE_URL: postgres://tn_owner:${DB_OWNER_PASSWORD}@db:5432/tournois
      TRUST_PROXY: "2"
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-8090}:80"]
    restart: unless-stopped
volumes: { dbdata: {} }
