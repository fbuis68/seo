# Déploiement de référence (hébergement UE recommandé). Secrets dans .env (voir .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data, ./db-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "tms_owner"], interval: 5s, retries: 10 }
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://tms_app:${DB_APP_PASSWORD}@db:5432/tms
      MIGRATION_DATABASE_URL: postgres://tms_owner:${DB_OWNER_PASSWORD}@db:5432/tms
      STORAGE_DIR: /data/storage
      TRUST_PROXY: "2"
    volumes: [storage:/data/storage]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://tms_app:${DB_APP_PASSWORD}@db:5432/tms
      STORAGE_DIR: /data/storage
    command: ["node", "dist/src/worker.js"]
    volumes: [storage:/data/storage]
    depends_on: [api]
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: [api]
    # Accessible en local pour diagnostic ; le public passe par le conteneur caddy (HTTPS).
    ports: ["127.0.0.1:8080:80"]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SITE_DOMAINS: ${SITE_DOMAINS}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes: { dbdata: {}, storage: {}, caddy_data: {}, caddy_config: {} }
