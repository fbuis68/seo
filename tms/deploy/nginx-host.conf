# Reverse proxy à placer dans le nginx DE L'HÔTE (/etc/nginx/sites-available/tms).
# Remplacer app.exemple.fr / www.exemple.fr ; certificats via certbot (--nginx).

# Application (espace client + API + widget)
server {
    listen 80;
    listen [::]:80;
    server_name app.exemple.fr;
    client_max_body_size 1100m;          # dépôt des paquets de reprise
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

# Site vitrine HTML statique
server {
    listen 80;
    listen [::]:80;
    server_name www.exemple.fr exemple.fr;
    root /var/www/site-vitrine;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
