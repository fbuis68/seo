server {

    server_name admin.sesame.technology;

    # Défaut nginx = 1 Mo, largement insuffisant pour un document comptable
    # encodé en base64 (une facture scannée dépasse facilement cette taille
    # à elle seule, un .zip de plusieurs factures encore plus) — cf.
    # express.json({limit:"15mb"}) côté app (src/app.ts). Sans ce réglage,
    # nginx rejette la requête AVANT qu'elle n'atteigne l'application et
    # renvoie sa propre page d'erreur HTML (413), que le front essaie de lire
    # comme du JSON ("Unexpected token '<'...", 17/09/2026).
    client_max_body_size 20m;

    # location = / (racine exacte) : réécrite vers /admin, la route qui sert
    # le back-office (public/admin.html). location / (générale) : tout le
    # reste — API /wa/*, /version, /changelog, assets statiques — transmis
    # TEL QUEL, sans préfixe. Avoir un seul location / avec un chemin dans
    # proxy_pass (ancienne version : proxy_pass http://127.0.0.1:3000/admin/;)
    # réécrivait TOUTES les requêtes avec /admin/ devant, y compris
    # /wa/login/login -> /admin/wa/login/login, qui n'existe pas -> 404
    # systématique (la page de connexion elle-même chargeait quand même,
    # laissant croire à tort à un problème de mot de passe).
    location = / {
        proxy_pass http://127.0.0.1:3000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.sesame.technology/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.sesame.technology/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = admin.sesame.technology) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name admin.sesame.technology;
    return 404; # managed by Certbot
}
