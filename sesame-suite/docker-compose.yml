services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sesame
      POSTGRES_PASSWORD: sesame
      POSTGRES_DB: sesame_suite
    ports:
      - "5432:5432"
    volumes:
      - sesame_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesame -d sesame_suite"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Serveur Node/Express + migrations + seed — construit depuis le Dockerfile
  # local. Avec ce service, `docker compose up --build` suffit à tout lancer :
  # pas besoin d'installer Node, npm ou PostgreSQL sur la machine hôte.
  app:
    build:
      context: .
      # Numéro de version (commit + date) affiché dans l'interface — passé
      # en argument de build faute de pouvoir lire .git depuis l'image (voir
      # le commentaire dans le Dockerfile). Sans ces variables d'environnement
      # définies avant `docker compose up --build`, la version affichée est
      # simplement "inconnu" — inoffensif, mais moins pratique pour vérifier
      # qu'un déploiement a bien pris effet.
      args:
        GIT_SHA: ${GIT_SHA:-inconnu}
        GIT_TIME: ${GIT_TIME:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sesame:sesame@postgres:5432/sesame_suite?schema=public
      PORT: 3000
      JWT_SECRET: change-me-in-production
      DEFAULT_ENTITY_CODE: E00000001
    ports:
      - "3000:3000"

volumes:
  sesame_pg_data:
