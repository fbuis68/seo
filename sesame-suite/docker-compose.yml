services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sesame
      POSTGRES_PASSWORD: sesame
      POSTGRES_DB: sesame_suite
    ports:
      - "5432:5432"
    volumes:
      - sesame_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesame -d sesame_suite"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Serveur Node/Express + migrations + seed — construit depuis le Dockerfile
  # local. Avec ce service, `docker compose up --build` suffit à tout lancer :
  # pas besoin d'installer Node, npm ou PostgreSQL sur la machine hôte.
  app:
    build:
      context: .
      # Numéro de version (commit + date) affiché dans l'interface — passé
      # en argument de build faute de pouvoir lire .git depuis l'image (voir
      # le commentaire dans le Dockerfile). Sans ces variables d'environnement
      # définies avant `docker compose up --build`, la version affichée est
      # simplement "inconnu" — inoffensif, mais moins pratique pour vérifier
      # qu'un déploiement a bien pris effet.
      args:
        GIT_SHA: ${GIT_SHA:-inconnu}
        GIT_TIME: ${GIT_TIME:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sesame:sesame@postgres:5432/sesame_suite?schema=public
      PORT: 3000
      JWT_SECRET: change-me-in-production
      DEFAULT_ENTITY_CODE: E00000001
    ports:
      # Réservé à la machine hôte (docker compose exec, scripts one-off,
      # debug via SSH tunnel) — le trafic public passe désormais par le
      # service caddy ci-dessous, qui termine le TLS et route par
      # sous-domaine. Retirer le "127.0.0.1:" ci-dessous republierait le
      # port 3000 en clair sur Internet, en plus des domaines HTTPS.
      - "127.0.0.1:3000:3000"

  # Reverse proxy — admin.sesame.technology / guest.sesame.technology vers
  # l'app, avec certificats Let's Encrypt automatiques (cf. deploy/Caddyfile).
  # Sert aussi test.moncentredeformation.fr (Tomcat, déplacé sur le port
  # 8080 de l'hôte — cf. README) : Caddy est le seul service sur 80/443,
  # Tomcat n'y écoute plus directement. Nécessite que le DNS des domaines
  # pointe déjà vers ce serveur, et que les ports 80/443 soient ouverts sur
  # le pare-feu.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # Permet à Caddy (dans son propre réseau Docker) de joindre Tomcat,
      # qui tourne directement sur la machine hôte et non dans un conteneur.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  sesame_pg_data:
  caddy_data:
  caddy_config:
