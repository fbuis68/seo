services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sesame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sesame}
      POSTGRES_DB: sesame_suite
    ports:
      # Réservé à la machine hôte (cf. le même principe déjà appliqué au
      # service "app" ci-dessous) — sans le préfixe 127.0.0.1, ce port était
      # republié sur 0.0.0.0 et donc exposé à Internet, avec l'identifiant/
      # mot de passe par défaut "sesame"/"sesame" (cf. audit sécurité du
      # 15/09/2026). rien côté "app" n'en a besoin : la communication
      # app <-> postgres passe par le réseau interne docker-compose
      # ("postgres:5432"), jamais par ce port publié.
      - "127.0.0.1:5432:5432"
    volumes:
      - sesame_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesame -d sesame_suite"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Serveur Node/Express + migrations + seed — construit depuis le Dockerfile
  # local. Avec ce service, `docker compose up --build` suffit à tout lancer :
  # pas besoin d'installer Node, npm ou PostgreSQL sur la machine hôte.
  app:
    build:
      context: .
      # Numéro de version (commit + date) affiché dans l'interface — passé
      # en argument de build faute de pouvoir lire .git depuis l'image (voir
      # le commentaire dans le Dockerfile). Sans ces variables d'environnement
      # définies avant `docker compose up --build`, la version affichée est
      # simplement "inconnu" — inoffensif, mais moins pratique pour vérifier
      # qu'un déploiement a bien pris effet.
      args:
        GIT_SHA: ${GIT_SHA:-inconnu}
        GIT_TIME: ${GIT_TIME:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sesame:${POSTGRES_PASSWORD:-sesame}@postgres:5432/sesame_suite?schema=public
      PORT: 3000
      # AVANT tout déploiement exposé publiquement (donc AVANT toute mise en
      # production réelle), définissez un JWT_SECRET fort dans un fichier
      # .env (jamais commité — voir .gitignore) à côté de ce fichier :
      # JWT_SECRET=$(openssl rand -hex 32). Sans ça, cette variable retombe
      # sur une valeur par défaut PUBLIQUE (visible par quiconque lit ce
      # dépôt) qui permettrait de forger un token admin pour n'importe quel
      # établissement — cf. audit sécurité du 15/09/2026, et le garde-fou
      # src/index.ts (avertit au démarrage, refuse de démarrer si
      # NODE_ENV=production et qu'aucun secret réel n'a été défini).
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEFAULT_ENTITY_CODE: E00000001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GUEST_BASE_URL: ${GUEST_BASE_URL:-}
      # App Azure AD (client credentials) — boîte support par Microsoft
      # Graph, cf. docs/microsoft-graph-inbound-tickets.md. Comme
      # JWT_SECRET/POSTGRES_PASSWORD ci-dessus : valeurs réelles dans un
      # .env local (jamais commité), jamais en dur dans ce fichier qui, lui,
      # est versionné dans un dépôt PUBLIC.
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
    ports:
      # Réservé à la machine hôte : nginx (déjà installé et configuré sur le
      # serveur, certificats Let's Encrypt via Certbot — cf. README) fait
      # office de reverse proxy public et route admin.sesame.technology /
      # guest.sesame.technology vers cette adresse. Ne PAS republier sur
      # 0.0.0.0, ça exposerait le port 3000 en clair sur Internet en plus
      # du HTTPS servi par nginx.
      - "127.0.0.1:3000:3000"

volumes:
  sesame_pg_data:
