<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature du devis — Sesame Technology</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- Calculateur ROI officiel Sesame (02/11/2026, remplace l'ancien simulateur
     maison) — Web Component Shadow DOM, charge /roi-engine.js lui-même
     (chemin relatif codé en dur dans le fichier vendor : '../../roi-engine.js'
     depuis /integrations/roi/roi-widget.js, d'où ce chemin précis). -->
<script src="/integrations/roi/roi-widget.js?v=5"></script>
<style>
  :root{--bg:#f6f6f4;--card:#fff;--bdr:#eae8e3;--tx:#1a1a1a;--mu:#8a8680;--a:#8b1040;--a-tint:#fbeeee;
    --c-materiel:#0c76d9;--c-service:#c9860a;--c-logiciel:#7a5cf0;--c-autre:#5a8a2e;
    --shadow:0 1px 2px rgba(20,15,10,.04),0 6px 20px -8px rgba(20,15,10,.08);
    /* 19/11/2026, "adapte la fonction devis a l'aide du fichier ci joint" —
       jeton foncé + accent clair du kit sesame-devis-kit-dev (bloc de totaux
       uniquement, cf. .sq-totalbox ci-dessous), à côté de --a/--a-tint déjà
       en place pour tout le reste de la page. */
    --dark:#302333;--pink:#f4a5bb}
  *{box-sizing:border-box}
  /* 20/11/2026, "police plus grande" — 14.5px -> 16px sur toute la page. */
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:17.5px;line-height:1.5}
  .band{background:#fff;padding:22px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
  .band img{height:44px;display:block}
  .band-sep{color:var(--mu);font-size:18px}
  @media(max-width:480px){.band{padding:16px 16px}.band img{height:34px}}
  /* Bandeau "Made in France / Hébergé en France / Membre de Synapse" du kit
     sesame-devis-kit-dev — repris tel quel (mêmes SVG inline). */
  .band-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .band-badge{display:flex;align-items:center;gap:8px;min-height:36px;padding:5px 9px;border:1px solid var(--bdr);border-radius:8px;background:#fff;font-size:10.5px;line-height:1.25;font-weight:700;color:var(--tx)}
  .band-badge svg{width:19px;height:19px;flex:none}
  .band-badge img{display:block;width:56px;height:auto}
  .band-badge small{display:block;margin-bottom:1px;font-size:8.5px;color:var(--mu);font-weight:600}
  @media(max-width:620px){.band-badges{display:none}}
  /* Bloc de totaux foncé du kit (.sq-totalbox) — remplace le stat-grid clair
     uniquement sur le récapitulatif du devis (ROI/autres stat-grid de la
     page inchangés). */
  .sq-totalbox{background:var(--dark);color:#fff;border-radius:12px;padding:16px 18px;margin-top:14px}
  .sq-totalrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0;font-size:14.5px}
  .sq-totalrow small{color:#f4dce6;font-weight:650;text-transform:uppercase;letter-spacing:.3px;font-size:12px}
  .sq-money{font-size:27px;line-height:1.2;font-weight:750;letter-spacing:-.02px;font-variant-numeric:tabular-nums}
  .sq-emphasis .sq-money{color:var(--pink)}
  .sq-totalbox .sq-sep{border:0;border-top:1px solid #ffffff30;margin:10px 0}
  /* 20/11/2026, "elargi la presentation pour un ecran de PC de 3 a 4 cm" —
     +130px (~3,5cm) sur les deux largeurs, capées par le
     @media(max-width:720px) ci-dessous sur mobile comme le reste de la page. */
  .wrap{max-width:1090px;margin:0 auto;padding:16px 20px 40px;transition:max-width .15s}
  .wrap.wide{max-width:1310px}
  /* 20/11/2026, "cartouche d'accueil identique avec la même disposition"
     (exemple fourni) — kicker/salutation/pills contact/validité, barre
     d'accent arrondie sur le bord droit façon onglet. */
  .welcome-card{position:relative;background:var(--card);border:1px solid var(--bdr);box-shadow:var(--shadow);border-radius:16px;padding:20px 26px 22px;margin-top:14px;overflow:hidden}
  .welcome-card::after{content:'';position:absolute;top:10px;bottom:10px;right:0;width:6px;border-radius:6px 0 0 6px;background:var(--a)}
  .welcome-kicker{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--a);margin-bottom:6px}
  .welcome-greeting{font-size:31px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px;color:var(--tx)}
  .welcome-sub{color:var(--mu);font-size:16px;margin:0 0 16px}
  .welcome-contact-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:12px 16px;margin-bottom:14px}
  .welcome-contact-row .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mu);font-weight:700}
  .welcome-contact-row .nm{font-weight:700;font-size:15px;margin-top:1px}
  .welcome-pills{display:flex;gap:8px;flex-wrap:wrap}
  .welcome-pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:8px 14px;text-decoration:none;white-space:nowrap}
  .welcome-validity{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--a);background:var(--a-tint);border-radius:20px;padding:7px 14px}
  .view-toggle{display:inline-flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:16px}
  .view-toggle button{font-family:inherit;font-size:12px;font-weight:600;padding:7px 14px;border:none;border-radius:8px;background:transparent;color:var(--mu);cursor:pointer}
  .view-toggle button.active{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
  .pdf-frame{width:100%;height:75vh;min-height:420px;border:1px solid var(--bdr);border-radius:12px;background:var(--bg)}
  .pdf-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .pdf-actions .btn{width:auto;flex:1;min-width:180px;text-decoration:none;display:flex;align-items:center;justify-content:center}
  @media(max-width:480px){.welcome-greeting{font-size:25px}.pdf-frame{height:60vh}}
  .card{background:var(--card);border:1px solid var(--bdr);box-shadow:var(--shadow);border-radius:16px;padding:24px;margin-top:14px}
  h1{font-size:22px;margin:0 0 3px;font-weight:700;letter-spacing:-.2px}
  .sub{color:var(--mu);font-size:14.5px;margin:0 0 16px}
  /* 04/11/2026, "centre le devis à droite" — tableau + sous-totaux + totaux
     ramenés en bloc compact sur le côté droit de la carte plutôt que collés
     à gauche sur toute la largeur. */
  .devis-dock{max-width:580px;margin-left:auto}
  .blk{margin-bottom:20px}
  .blk-hd{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--c);margin-bottom:12px}
  .blk-hd::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
  /* 04/11/2026, "rapproche les colonnes les unes à côté des autres" : table
     en width:100% forçait "Prestation" à manger tout l'espace du devis
     (jusqu'à 960px de large) et repoussait Qté/Prix unitaire/Total loin à
     droite, avec un grand vide au milieu de chaque ligne. Table en
     width:auto = chaque colonne se limite à la largeur de son contenu
     (+ un peu de confort via white-space:nowrap sur les 3 colonnes
     chiffrées), les 4 colonnes se suivent directement ; le vide résiduel
     part à droite du tableau plutôt qu'au milieu d'une ligne. */
  /* 13/11/2026, "toujours pas aligné" — chaque <table> (Matériel/Service/
     Licence) est un bloc indépendant en width:auto, dimensionné sur son
     propre contenu : leurs colonnes Total n'avaient aucune raison de
     tomber à la même position horizontale d'un bloc à l'autre. margin-left:
     auto plaque chaque tableau sur le bord droit de .devis-dock (même
     largeur pour tous les blocs), donc leurs colonnes Total s'alignent
     verticalement entre elles, sans revenir au width:100% qui recréait le
     grand vide au milieu de chaque ligne (cf. commentaire ci-dessus). */
  table{width:auto;max-width:100%;margin:0 0 0 auto;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);font-weight:600;border-bottom:1px solid var(--bdr);padding:0 10px 8px}
  td{padding:10px;border-bottom:1px solid #f2f1ee;font-size:16px;vertical-align:top}
  th:not(:first-child),td:not(:first-child){white-space:nowrap}
  td:first-child{max-width:360px}
  tbody tr:last-child td{border-bottom:none}
  .blk-sub-row td{font-weight:600;font-size:14.5px;padding:8px 10px 0;border-bottom:none;color:var(--tx)}
  .desc{color:var(--mu);font-size:13.5px;margin-top:3px;line-height:1.4}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
  .stat-card{background:var(--bg);border-radius:12px;padding:12px 16px;text-align:center}
  .stat-card .stat-lbl{font-size:11px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
  .stat-card .stat-val{font-size:19px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .stat-card.grand{background:var(--a-tint)}
  .stat-card.grand .stat-val{color:var(--a)}
  .notes{margin-top:14px;font-size:12.5px;color:#55504c;white-space:pre-wrap;background:var(--bg);padding:12px 16px;border-radius:12px;line-height:1.6}
  .promo-box{margin-top:14px;background:var(--a-tint);border-radius:12px;padding:14px 16px}
  .promo-hd{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--a);margin-bottom:8px}
  .promo-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0;border-top:1px solid rgba(139,16,64,.12)}
  .promo-item:first-of-type{border-top:none;padding-top:0}
  .promo-item-lbl{font-weight:600;font-size:13px}
  .promo-item-price{font-size:12.5px;font-weight:600;color:var(--a);white-space:nowrap;flex-shrink:0}
  .notes strong{color:var(--a);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;display:block;margin-bottom:4px}
  label{font-size:12.5px;color:var(--mu);font-weight:600;display:block;margin-bottom:6px}
  input[type=text],input[type=email]{width:100%;font-family:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--bdr);border-radius:10px;margin-bottom:12px;background:var(--bg)}
  /* 20/11/2026, "cartouche signature sur une seule ligne avec les champs" —
     Nom + Email côte à côte, empilés seulement si la place manque. */
  .sig-fields-row{display:flex;gap:14px}
  .sig-fields-row>div{flex:1;min-width:0}
  @media(max-width:560px){.sig-fields-row{flex-direction:column;gap:0}}
  .sig-box{border:1px solid var(--bdr);border-radius:12px;background:#fcfcfa;touch-action:none}
  canvas{display:block;width:100%;height:130px;cursor:crosshair}
  .sig-actions{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
  .consent{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--mu);margin-bottom:14px;line-height:1.5}
  .consent input{margin-top:2px}
  .disclaimer{font-size:11.5px;color:var(--mu);background:var(--bg);padding:10px 14px;border-radius:12px;margin-bottom:14px;line-height:1.5}
  .btn{font-family:inherit;font-size:14px;padding:12px 20px;border-radius:10px;border:none;background:var(--a);color:#fff;cursor:pointer;width:100%;font-weight:600}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--mu);border:1px solid var(--bdr);padding:6px 12px;width:auto;font-size:11.5px;font-weight:500;border-radius:8px}
  .err{color:#a32d2d;font-size:12.5px;margin-top:10px;display:none}
  .ok-box{text-align:center;padding:24px 10px}
  .ok-icon{font-size:34px;color:#1a6b47;margin-bottom:10px}
  .tabs{display:flex;gap:2px;margin-top:14px;background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:4px;overflow-x:auto;box-shadow:var(--shadow)}
  .tab-btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 16px;border:none;border-radius:9px;background:transparent;color:var(--mu);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
  .tab-btn.active{color:var(--tx);background:var(--bg)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .doc-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid #f2f1ee}
  /* 13/11/2026, "rajouts de documents... drag and drop" — surbrillance de
     la zone pendant le survol avec un fichier. */
  #client-upload-dropzone.drop-hover{outline:2px dashed var(--a);outline-offset:-2px;background:var(--a-tint);border-radius:12px}
  .doc-item:last-child{border-bottom:none}
  .doc-left{display:flex;gap:14px;align-items:center;min-width:0}
  .doc-thumb{width:52px;height:52px;border-radius:12px;flex-shrink:0;object-fit:cover;background:var(--a-tint);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
  .doc-thumb.is-video::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);color:#fff;font-size:16px}
  .doc-title{font-weight:600;font-size:13.5px}
  .doc-desc{color:var(--mu);font-size:12px;margin-top:3px;line-height:1.4}
  .doc-dl{text-decoration:none;flex-shrink:0}
  .booking-frame{width:100%;height:720px;border:1px solid var(--bdr);border-radius:12px;margin-top:16px}
  .meeting-item{padding:18px 0;border-bottom:1px solid #f2f1ee}
  .meeting-item:last-child{border-bottom:none}
  .meeting-date{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .meeting-subject{font-weight:700;font-size:14.5px;margin:3px 0 10px}
  .meeting-summary{font-size:13.5px;white-space:pre-wrap;color:#333;background:var(--bg);padding:16px 18px;border-radius:12px;line-height:1.6}
  video{width:100%;border-radius:12px;margin-top:12px;display:block;background:#000}
  .roi-field{display:block;margin-top:4px}
  .roi-field-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);font-weight:600}
  .roi-field-row output{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
  .roi-field input[type=range]{width:100%;accent-color:var(--a);margin-top:10px;min-height:28px}
</style>
</head>
<body>
<div class="band" id="band">
  <img src="/icons/sesame-logo.jpg" alt="Sesame Technology">
  <span class="band-sep" id="band-sep" style="display:none">×</span>
  <img id="client-logo" style="display:none" alt="">
  <div class="band-badges" aria-label="Origine, hébergement et réseau">
    <div class="band-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#f6f5f7"/><path d="M5 8h5v8H5z" fill="#233b78"/><path d="M10 8h4v8h-4z" fill="white"/><path d="M14 8h5v8h-5z" fill="#c52d48"/><rect x="5" y="8" width="14" height="8" rx="1" fill="none" stroke="#302333" stroke-opacity=".18"/></svg><span>Made in France</span></div>
    <div class="band-badge"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#f7eaf0"/><g stroke="#8c1c40" stroke-width="1.4"><rect x="6" y="6.5" width="12" height="4.5" rx="1"/><rect x="6" y="13" width="12" height="4.5" rx="1"/><path d="M8 8.75h1.5M8 15.25h1.5"/></g></svg><span>Hébergé en France</span></div>
    <div class="band-badge"><div><small>Membre de</small><img src="/icons/logo-synapse.png" alt="Synapse"></div></div>
  </div>
</div>
<div class="wrap" id="wrap">
  <div id="app"><div class="card">Chargement…</div></div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtEUR(n){ return (n||0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €'; }

const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
let QUOTE = null;

async function init(){
  if(!TOKEN){ renderError('Lien invalide.'); return; }
  try{
    const r = await fetch('/wa/crmQuote/public?token='+encodeURIComponent(TOKEN));
    const data = await r.json();
    if(!r.ok){ renderError(data.error || 'Lien invalide ou expiré.'); return; }
    QUOTE = data;
    applyClientBranding();
    render();
  }catch(e){ renderError('Erreur de connexion au serveur.'); }
}

// Logo + charte graphique du client (02/11/2026, demande client) — logo
// récupéré au préalable sur la fiche CRM, couleur de marque lue dans les
// balises theme-color du site client (cf. lib/companyLogo.ts) : couvre
// la majorité des sites modernes, pas une extraction universelle. Jamais
// bloquant si absent — l'espace garde l'identité Sesame par défaut.
function applyClientBranding(){
  if(QUOTE.prospectLogo){
    const img = document.getElementById('client-logo');
    img.src = QUOTE.prospectLogo;
    img.alt = QUOTE.prospectNom || '';
    img.style.display = 'block';
    document.getElementById('band-sep').style.display = 'inline';
  }
  if(QUOTE.prospectBrandColor){
    const root = document.documentElement.style;
    root.setProperty('--a', QUOTE.prospectBrandColor);
    try{ root.setProperty('--a-tint', 'color-mix(in srgb, '+QUOTE.prospectBrandColor+' 12%, white)'); }catch(e){}
  }
}

function renderError(msg){
  document.getElementById('app').innerHTML = '<div class="card"><h1>Lien de signature</h1><div class="sub">'+esc(msg)+'</div></div>';
}

// Mêmes 4 rubriques, mêmes couleurs que l'onglet Document du constructeur
// de devis (public/crm.html, DOC_BLOCKS) — pour que le client retrouve la
// même présentation entre la saisie interne et ce qu'il signe.
const DOC_BLOCKS = [
  {cat:'materiel', label:'Matériel', c:'var(--c-materiel)'},
  {cat:'service', label:'Service', c:'var(--c-service)'},
  {cat:'logiciel', label:'Licence', c:'var(--c-logiciel)'},
  {cat:'autre', label:'Lignes libres', c:'var(--c-autre)'},
];
// Ouvre le document/lien produit en fenêtre popup dimensionnée (30/10/2026,
// "faire une fenêtre popup et un onglet qui s'ouvre") — garde quand même
// target="_blank"/href sur l'ancre (clic molette, ouvrir dans un nouvel
// onglet, lecteurs d'écran) : preventDefault seulement sur le clic simple,
// qui prend alors la forme popup plutôt qu'un onglet plein.
function openProductDoc(event, url){
  event.preventDefault();
  window.open(url, '_blank', 'noopener,width=960,height=760');
}
function quoteRowHtml(l){
  // Document/lien rattaché au produit d'origine de la ligne (30/10/2026,
  // "sur chaque produit pouvoir rattacher un document ou une url"), résolu
  // côté serveur (GET /crmQuote/public) — null si le produit n'en a pas. Le
  // lien est porté directement par le libellé (demande client), plus une
  // ligne séparée en dessous.
  const pd = l.productDocument;
  const docUrl = pd ? '/wa/crmQuote/publicDocument/'+encodeURIComponent(pd.id)+'?token='+encodeURIComponent(TOKEN) : null;
  const labelHtml = pd
    ? `<a href="${docUrl}" target="_blank" rel="noopener" onclick="openProductDoc(event,'${docUrl}')" title="${esc(pd.title)}" style="color:var(--tx);text-decoration:none;border-bottom:1px dashed var(--a)">${esc(l.label)} <span style="color:var(--a)">${/pdf/i.test(pd.fileMimeType||'')?pdfIconSvg(16):(pd.fileMimeType?'📎':'🔗')}</span></a>`
    : esc(l.label);
  return `<tr>
      <td>${labelHtml}${l.description?`<div class="desc">${esc(l.description)}</div>`:''}</td>
      <td style="text-align:center">${l.qty}</td>
      <td style="text-align:right">${l.unitPrice==null?'À chiffrer':fmtEUR(l.unitPrice)}</td>
      <td style="text-align:right">${l.unitPrice==null?'—':fmtEUR((+l.qty||0)*l.unitPrice)+(l.recurring?'/mois':'')}</td>
    </tr>`;
}
function quoteBlocksHtml(){
  return DOC_BLOCKS.map(b=>{
    const rows = QUOTE.lines.filter(l=>(l.category||'materiel')===b.cat);
    if(!rows.length) return '';
    const subtotal = rows.reduce((s,l)=>s+(l.unitPrice==null?0:(+l.qty||0)*l.unitPrice),0);
    return `<div class="blk" style="--c:${b.c}">
      <div class="blk-hd">${esc(b.label)}</div>
      <table>
        <thead><tr><th>Prestation</th><th style="text-align:center">Qté</th><th style="text-align:right">Prix unitaire</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${rows.map(quoteRowHtml).join('')}</tbody>
        <tfoot><tr class="blk-sub-row"><td colspan="3">Sous-total ${esc(b.label)}</td><td style="text-align:right">${fmtEUR(subtotal)}</td></tr></tfoot>
      </table>
    </div>`;
  }).join('');
}

// Vignettes des documents (30/10/2026, demande client "vignette sympa" +
// "vignette vidéo sur les liens URL") — un lien YouTube/Vimeo affiche sa
// vraie miniature vidéo (YouTube : URL statique prévisible, pas d'appel
// réseau ; Vimeo : nécessite son endpoint oEmbed public, chargé en async
// après le premier rendu, cf. plannerEnhanceVimeoThumbs — pas d'API key
// requise dans les deux cas). Un fichier image se prévisualise lui-même
// (via publicDocument) ; les autres types gardent une pastille colorée.
function youtubeId(url){
  const m = String(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function vimeoId(url){
  const m = String(url||'').match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}
// Icône standard "document PDF" (page pliée + bandeau rouge "PDF") à la
// place de l'émoji 📄 — 19/11/2026, "mettre les icones standard des
// documents de type pdf". Réutilisée par docThumbHtml et
// clientUploadThumbHtml (deux listes de documents distinctes).
function pdfIconSvg(size){
  const s = size||30;
  return `<svg viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true" style="vertical-align:middle">
  <path d="M10 2h18l10 10v32a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#e3e1e6"/>
  <path d="M28 2v10h10z" fill="#c7c3cc"/>
  <rect x="5" y="26" width="30" height="14" rx="2" fill="#d32f2f"/>
  <text x="20" y="36" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
</svg>`;
}
const PDF_ICON_SVG = pdfIconSvg(30);
function docThumbHtml(d){
  // 20/11/2026, "les icones pdf n'apparaissent pas" — un document avec un
  // lien (url) ET un fileMimeType PDF (ex: lien direct vers un PDF hébergé
  // ailleurs) ressortait toujours en icône lien générique, le court-circuit
  // sur `d.url` empêchant d'atteindre le test PDF plus bas. YouTube/Vimeo
  // restent prioritaires (vraie vignette vidéo), mais tout le reste passe
  // désormais par les tests de mimetype ci-dessous avant le repli lien.
  if(d.url){
    const yt = youtubeId(d.url);
    if(yt) return `<img class="doc-thumb is-video" src="https://img.youtube.com/vi/${yt}/mqdefault.jpg" alt="">`;
    const vm = vimeoId(d.url);
    if(vm) return `<div class="doc-thumb is-video" id="vimeo-thumb-${d.id}" data-vimeo-url="${esc(d.url)}">🔗</div>`;
  }
  const mime = d.fileMimeType||'';
  // 04/11/2026, "icône sur les autres types de documents" — ordre important :
  // les mimetypes Office modernes (.xlsx/.pptx) contiennent tous deux la
  // chaîne "officedocument", donc tableur/présentation doivent être testés
  // AVANT la règle word/document générique, sinon un Excel ressortait avec
  // l'icône Word (📝) par erreur.
  if(/^image\//i.test(mime)) return `<img class="doc-thumb" src="/wa/crmQuote/publicDocument/${encodeURIComponent(d.id)}?token=${encodeURIComponent(TOKEN)}" alt="">`;
  if(/pdf/i.test(mime)) return `<div class="doc-thumb" style="background:#fff">${PDF_ICON_SVG}</div>`;
  if(/spreadsheet|excel|csv/i.test(mime)) return `<div class="doc-thumb">📊</div>`;
  if(/presentation|powerpoint/i.test(mime)) return `<div class="doc-thumb">📽️</div>`;
  if(/zip|compressed|rar|7z-compressed|x-tar|gzip/i.test(mime)) return `<div class="doc-thumb">🗜️</div>`;
  if(/^video\//i.test(mime)) return `<div class="doc-thumb">🎬</div>`;
  if(/^audio\//i.test(mime)) return `<div class="doc-thumb">🎵</div>`;
  if(/word|document/i.test(mime)) return `<div class="doc-thumb">📝</div>`;
  if(/^text\//i.test(mime)) return `<div class="doc-thumb">📃</div>`;
  if(d.url) return `<div class="doc-thumb">🔗</div>`;
  return `<div class="doc-thumb">📎</div>`;
}
// Vimeo n'expose pas d'URL de miniature statique (contrairement à YouTube)
// — son endpoint oEmbed public renvoie thumbnail_url, chargé après coup
// pour ne jamais bloquer le premier rendu sur un appel réseau tiers.
function enhanceVimeoThumbs(){
  document.querySelectorAll('[data-vimeo-url]').forEach(async el=>{
    try{
      const r = await fetch('https://vimeo.com/api/oembed.json?url='+encodeURIComponent(el.dataset.vimeoUrl));
      if(!r.ok) return;
      const data = await r.json();
      if(data.thumbnail_url){
        const img = document.createElement('img');
        img.className = 'doc-thumb is-video';
        img.src = data.thumbnail_url;
        el.replaceWith(img);
      }
    }catch(e){ /* vignette générique conservée */ }
  });
}

// bibliothèque CrmDocument ci-dessus (pas de réutilisation entre devis).
const CLIENT_UPLOAD_MAX_BYTES = 7 * 1024 * 1024;
function clientUploadThumbHtml(u){
  const mime = u.fileMimeType||'';
  if(/^image\//i.test(mime)) return `<img class="doc-thumb" src="/wa/crmQuote/publicClientUpload/${encodeURIComponent(u.id)}?token=${encodeURIComponent(TOKEN)}" alt="">`;

  if(/spreadsheet|excel|csv/i.test(mime)) return `<div class="doc-thumb">📊</div>`;
  if(/presentation|powerpoint/i.test(mime)) return `<div class="doc-thumb">📽️</div>`;
  if(/word|document/i.test(mime)) return `<div class="doc-thumb">📝</div>`;
  return `<div class="doc-thumb">📎</div>`;

function clientUploadSectionHtml(){

      </div>`).join('')
    : '<p style="font-size:12px;color:var(--mu)">Aucun document envoyé pour le moment.</p>';
  return `<div id="client-upload-dropzone" style="margin-top:8px;padding-top:16px;border-top:1px solid #f2f1ee"
      ondragover="event.preventDefault();this.classList.add('drop-hover')"
      ondragleave="this.classList.remove('drop-hover')"
      ondrop="event.preventDefault();this.classList.remove('drop-hover');clientUploadProcessFiles(event.dataTransfer.files)">
    <h2 style="font-size:13.5px;margin:0 0 10px">Vos documents envoyés</h2>
    <div id="client-upload-list">${listHtml}</div>
    <div style="margin-top:14px">
      <label class="btn btn-ghost" style="width:auto;display:inline-block;cursor:pointer">
        Envoyer un document
        <input type="file" id="client-upload-input" multiple style="display:none" onchange="handleClientUploadFile(event)">
      </label>
      <span style="font-size:12px;color:var(--mu);margin-left:10px">ou glissez-déposez un fichier ici</span>
      <span id="client-upload-err" style="display:none;color:#c0392b;font-size:12px;margin-left:10px"></span>
      <span id="client-upload-progress" style="display:none;color:var(--mu);font-size:12px;margin-left:10px">Envoi en cours…</span>
    </div>
  </div>`;
}
function handleClientUploadFile(evt){
  clientUploadProcessFiles(evt.target.files);
  evt.target.value = '';
}
function clientUploadProcessFiles(fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return;
  (async()=>{ for(const file of files) await clientUploadReadAndSubmit(file); })();
}
function clientUploadReadAndSubmit(file){
  const errEl = document.getElementById('client-upload-err');
  if(errEl) errEl.style.display='none';
  if(file.size > CLIENT_UPLOAD_MAX_BYTES){
    if(errEl){ errEl.textContent = 'Fichier trop volumineux (7 Mo max) : '+file.name; errEl.style.display='block'; }
    return Promise.resolve();
  }
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = function(){
      submitClientUpload(file.name, file.type, reader.result).then(resolve);
    };
    reader.onerror = function(){
      if(errEl){ errEl.textContent = 'Lecture du fichier impossible : '+file.name; errEl.style.display='block'; }
      resolve();
    };
    reader.readAsDataURL(file);
  });
}
async function submitClientUpload(fileName, fileMimeType, dataUrl){
  const errEl = document.getElementById('client-upload-err');
  const progEl = document.getElementById('client-upload-progress');
  if(progEl) progEl.style.display='';
  try{
    const r = await fetch('/wa/crmQuote/publicUpload', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, fileName, fileMimeType, dataUrl })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error||'Erreur d\'envoi');
    if(!QUOTE.clientUploads) QUOTE.clientUploads = [];
    QUOTE.clientUploads.unshift({ id: data.id, fileName: data.fileName, fileMimeType: data.fileMimeType, createdAt: data.createdAt });
    render();
    switchTab('documents');
    trackQuoteEvent('quote_document_opened', 'Dépôt client : '+fileName);
  }catch(e){
    if(errEl){ errEl.textContent = e.message||'Erreur d\'envoi'; errEl.style.display='block'; }
  }finally{
    if(progEl) progEl.style.display='none';
  }
}

  if(!ROI_LAST_RESULT){ monthlyEl.textContent='—'; annualEl.textContent='—'; paybackEl.textContent='—'; roiChartUpdate(investment, null); return; }
  const monthlyHours = ROI_LAST_RESULT.monthlyHours||0;
  const monthly = monthlyHours*hourly - license;
  const annual = monthly*12;

function roiChartUpdate(investment, monthly){
  const slot = roiChartSlot();
  if(!slot) return;
  if(!ROI_CHART_BUILT) roiChartBuild(slot);
  const bars = slot.querySelector('[data-rc-bars]'), foot = slot.querySelector('[data-rc-foot]');
  bars.innerHTML = '';
  if(monthly===null || !investment){
    foot.textContent = 'Projection disponible une fois le calculateur ci-dessus renseigné.';
    return;
  }
  const cumul = []; for(let m=1;m<=12;m++) cumul.push(monthly*m - investment);
  const maxAbs = Math.max(...cumul.map(Math.abs), 1);
  let crossMonth = null;
  cumul.forEach((v,i)=>{
    const m = i+1, isPos = v>=0;
    if(isPos && crossMonth===null) crossMonth = m;
    const col = document.createElement('div'); col.className = 'rc-col';
    const bar = document.createElement('div'); bar.className = 'rc-bar ' + (isPos?'pos':'neg');
    const pct = Math.min(48, Math.abs(v)/maxAbs*48);
    bar.style.height = pct + '%';
    if(isPos) bar.style.bottom = '50%'; else bar.style.top = '50%';
    bar.title = 'Mois ' + m + ' : ' + (v>=0?'+':'') + fmtEUR(v);
    if(m===crossMonth){ const lbl=document.createElement('div'); lbl.className='rc-val'; lbl.textContent='+'+fmtEUR(v); bar.appendChild(lbl); }
    col.appendChild(bar); bars.appendChild(col);
  });
  foot.innerHTML = crossMonth
    ? `Seuil de rentabilité atteint au <b>mois ${crossMonth}</b> — investissement ${fmtEUR(investment)} récupéré.`

}

let ctx, drawing=false, hasDrawn=false;
function setupCanvas(){
  const canvas = document.getElementById('sigCanvas');
  const box = canvas.parentElement;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = box.clientWidth * ratio;
  canvas.height = 160 * ratio;
  ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  hasDrawn = false;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', e=>{
    drawing = true; hasDrawn = true;
    const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
  });
  canvas.addEventListener('pointerup', ()=>{ drawing = false; });
  canvas.addEventListener('pointerleave', ()=>{ drawing = false; });
}
function clearSignature(){
  const canvas = document.getElementById('sigCanvas');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  hasDrawn = false;
}

async function submitSignature(){
  const errEl = document.getElementById('err');
  errEl.style.display='none';
  const signerName = document.getElementById('signerName').value.trim();
  const signerEmail = document.getElementById('signerEmail').value.trim();
  const consent = document.getElementById('consent').checked;
  if(!signerName){ errEl.textContent='Indiquez votre nom complet.'; errEl.style.display='block'; return; }
  if(!hasDrawn){ errEl.textContent='Veuillez dessiner votre signature.'; errEl.style.display='block'; return; }
  if(!consent){ errEl.textContent='Vous devez accepter les conditions pour signer.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  const signatureDataUrl = document.getElementById('sigCanvas').toDataURL('image/png');
  try{
    const r = await fetch('/wa/crmQuote/sign', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, signerName, signerEmail, signatureDataUrl, consent })
    });
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Erreur lors de la signature.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Signer et accepter'; return; }
  }catch(e){ errEl.textContent = 'Erreur de connexion au serveur.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Signer et accepter'; return; }

  // 20/11/2026, "signature simultanée sur option du contrat de licence" —
  // déclenchée juste après la signature du devis, uniquement si cochée ;
  // un échec ici ne doit jamais annuler la signature du devis déjà actée.
  const alsoSignLicenseEl = document.getElementById('alsoSignLicense');
  if(alsoSignLicenseEl && alsoSignLicenseEl.checked){
    const phone = (document.getElementById('licensePhone').value||'').trim();
    const [firstname, ...rest] = signerName.split(/\s+/);
    try{
      const r2 = await fetch('/wa/crmQuote/requestLicenseSignature', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token: TOKEN, signerFirstname: firstname, signerLastname: rest.join(' ')||firstname, signerEmail, signerPhone: phone })
      });
      const data2 = await r2.json();
      if(r2.ok && data2.redirectUrl){ window.location.href = data2.redirectUrl; return; }
    }catch(e){ /* le devis reste signé — simple absence de redirection vers le contrat */ }
  }

  QUOTE.alreadySigned = true;
  QUOTE.signerName = signerName;
  QUOTE.signedAt = new Date().toISOString();
  render();
}

init();
</script>
