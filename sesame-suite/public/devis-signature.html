<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature du devis — Sesame Technology</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{--bg:#f6f6f4;--card:#fff;--bdr:#eae8e3;--tx:#1a1a1a;--mu:#8a8680;--a:#8b1040;--a-tint:#fbeeee;
    --c-materiel:#0c76d9;--c-service:#c9860a;--c-logiciel:#7a5cf0;--c-autre:#5a8a2e;
    --shadow:0 1px 2px rgba(20,15,10,.04),0 6px 20px -8px rgba(20,15,10,.08)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5}
  .band{background:#fff;padding:22px 20px;text-align:center;border-bottom:1px solid var(--bdr)}
  .band img{height:32px;display:inline-block}
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px 72px}
  .card{background:var(--card);border:1px solid var(--bdr);box-shadow:var(--shadow);border-radius:16px;padding:32px;margin-top:20px}
  h1{font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:-.2px}
  .sub{color:var(--mu);font-size:13px;margin:0 0 24px}
  .blk{margin-bottom:28px}
  .blk-hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--c);margin-bottom:12px}
  .blk-hd::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
  table{width:100%;border-collapse:collapse;margin:0}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);font-weight:600;border-bottom:1px solid var(--bdr);padding:0 10px 8px}
  td{padding:14px 10px;border-bottom:1px solid #f2f1ee;font-size:13.5px;vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  .blk-sub{display:flex;justify-content:space-between;font-weight:600;font-size:12.5px;padding:10px 10px 0;color:var(--tx)}
  .desc{color:var(--mu);font-size:12px;margin-top:3px;line-height:1.4}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px}
  .stat-card{background:var(--bg);border-radius:12px;padding:16px 18px}
  .stat-card .stat-lbl{font-size:11px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
  .stat-card .stat-val{font-size:21px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .stat-card.grand{background:var(--a-tint)}
  .stat-card.grand .stat-val{color:var(--a)}
  .notes{margin-top:20px;font-size:12.5px;color:#55504c;white-space:pre-wrap;background:var(--bg);padding:16px 18px;border-radius:12px;line-height:1.6}
  .notes strong{color:var(--a);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;display:block;margin-bottom:4px}
  label{font-size:12.5px;color:var(--mu);font-weight:600;display:block;margin-bottom:6px}
  input[type=text],input[type=email]{width:100%;font-family:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--bdr);border-radius:10px;margin-bottom:18px;background:var(--bg)}
  .sig-box{border:1px solid var(--bdr);border-radius:12px;background:#fcfcfa;touch-action:none}
  canvas{display:block;width:100%;height:160px;cursor:crosshair}
  .sig-actions{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}
  .consent{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--mu);margin-bottom:20px;line-height:1.5}
  .consent input{margin-top:2px}
  .disclaimer{font-size:11.5px;color:var(--mu);background:var(--bg);padding:12px 14px;border-radius:12px;margin-bottom:20px;line-height:1.5}
  .btn{font-family:inherit;font-size:14px;padding:13px 20px;border-radius:10px;border:none;background:var(--a);color:#fff;cursor:pointer;width:100%;font-weight:600}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--mu);border:1px solid var(--bdr);padding:6px 12px;width:auto;font-size:11.5px;font-weight:500;border-radius:8px}
  .err{color:#a32d2d;font-size:12.5px;margin-top:10px;display:none}
  .ok-box{text-align:center;padding:36px 10px}
  .ok-icon{font-size:38px;color:#1a6b47;margin-bottom:12px}
  .tabs{display:flex;gap:2px;margin-top:24px;background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:4px;overflow-x:auto;box-shadow:var(--shadow)}
  .tab-btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 16px;border:none;border-radius:9px;background:transparent;color:var(--mu);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
  .tab-btn.active{color:var(--tx);background:var(--bg)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .doc-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid #f2f1ee}
  .doc-item:last-child{border-bottom:none}
  .doc-left{display:flex;gap:14px;align-items:center;min-width:0}
  .doc-thumb{width:52px;height:52px;border-radius:12px;flex-shrink:0;object-fit:cover;background:var(--a-tint);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
  .doc-thumb.is-video::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);color:#fff;font-size:16px}
  .doc-title{font-weight:600;font-size:13.5px}
  .doc-desc{color:var(--mu);font-size:12px;margin-top:3px;line-height:1.4}
  .doc-dl{text-decoration:none;flex-shrink:0}
  .booking-frame{width:100%;height:720px;border:1px solid var(--bdr);border-radius:12px;margin-top:16px}
  .meeting-item{padding:18px 0;border-bottom:1px solid #f2f1ee}
  .meeting-item:last-child{border-bottom:none}
  .meeting-date{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .meeting-subject{font-weight:700;font-size:14.5px;margin:3px 0 10px}
  .meeting-summary{font-size:13.5px;white-space:pre-wrap;color:#333;background:var(--bg);padding:16px 18px;border-radius:12px;line-height:1.6}
  video{width:100%;border-radius:12px;margin-top:12px;display:block;background:#000}
</style>
</head>
<body>
<div class="band"><img src="/icons/sesame-logo.jpg" alt="Sesame Technology"></div>
<div class="wrap">
  <div id="app"><div class="card">Chargement…</div></div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtEUR(n){ return (n||0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €'; }

const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
let QUOTE = null;

async function init(){
  if(!TOKEN){ renderError('Lien invalide.'); return; }
  try{
    const r = await fetch('/wa/crmQuote/public?token='+encodeURIComponent(TOKEN));
    const data = await r.json();
    if(!r.ok){ renderError(data.error || 'Lien invalide ou expiré.'); return; }
    QUOTE = data;
    render();
  }catch(e){ renderError('Erreur de connexion au serveur.'); }
}

function renderError(msg){
  document.getElementById('app').innerHTML = '<div class="card"><h1>Lien de signature</h1><div class="sub">'+esc(msg)+'</div></div>';
}

// Mêmes 4 rubriques, mêmes couleurs que l'onglet Document du constructeur
// de devis (public/crm.html, DOC_BLOCKS) — pour que le client retrouve la
// même présentation entre la saisie interne et ce qu'il signe.
const DOC_BLOCKS = [
  {cat:'materiel', label:'Matériel', c:'var(--c-materiel)'},
  {cat:'service', label:'Service', c:'var(--c-service)'},
  {cat:'logiciel', label:'Licence', c:'var(--c-logiciel)'},
  {cat:'autre', label:'Lignes libres', c:'var(--c-autre)'},
];
function quoteRowHtml(l){
  // Document/lien rattaché au produit d'origine de la ligne (30/10/2026,
  // "sur chaque produit pouvoir rattacher un document ou une url"), résolu
  // côté serveur (GET /crmQuote/public) — null si le produit n'en a pas.
  const pd = l.productDocument;
  return `<tr>
      <td>${esc(l.label)}${l.description?`<div class="desc">${esc(l.description)}</div>`:''}${pd?`<div style="margin-top:3px"><a href="/wa/crmQuote/publicDocument/${encodeURIComponent(pd.id)}?token=${encodeURIComponent(TOKEN)}" target="_blank" rel="noopener" style="font-size:11px;color:var(--a);text-decoration:none">${pd.fileMimeType?'📎':'🔗'} ${esc(pd.title)}</a></div>`:''}</td>
      <td style="text-align:center">${l.qty}</td>
      <td style="text-align:right">${l.unitPrice==null?'À chiffrer':fmtEUR(l.unitPrice)}</td>
      <td style="text-align:right">${l.unitPrice==null?'—':fmtEUR((+l.qty||0)*l.unitPrice)+(l.recurring?'/mois':'')}</td>
    </tr>`;
}
function quoteBlocksHtml(){
  return DOC_BLOCKS.map(b=>{
    const rows = QUOTE.lines.filter(l=>(l.category||'materiel')===b.cat);
    if(!rows.length) return '';
    const subtotal = rows.reduce((s,l)=>s+(l.unitPrice==null?0:(+l.qty||0)*l.unitPrice),0);
    return `<div class="blk" style="--c:${b.c}">
      <div class="blk-hd">${esc(b.label)}</div>
      <table>
        <thead><tr><th>Prestation</th><th style="text-align:center">Qté</th><th style="text-align:right">Prix unitaire</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${rows.map(quoteRowHtml).join('')}</tbody>
      </table>
      <div class="blk-sub"><span>Sous-total ${esc(b.label)}</span><span>${fmtEUR(subtotal)}</span></div>
    </div>`;
  }).join('');
}

function quoteSummaryHtml(){
  const t = QUOTE.totals;
  const stats = [
    {lbl:'Mensuel récurrent', val:fmtEUR(t.mrrNet)},
    {lbl:'Frais ponctuels', val:fmtEUR(t.oneoffNet)},
    QUOTE.discountPct ? {lbl:'Remise appliquée', val:QUOTE.discountPct+'%'} : null,
    {lbl:'Total HT', val:fmtEUR(t.totalHT)},
    {lbl:'TVA ('+(QUOTE.vatPct||0)+'%)', val:fmtEUR(t.totalTTC-t.totalHT)},
    {lbl:'Total TTC', val:fmtEUR(t.totalTTC), grand:true},
    QUOTE.depositPct ? {lbl:'Acompte ('+QUOTE.depositPct+'%)', val:fmtEUR(t.depositAmount)} : null,
  ].filter(Boolean);
  return `
    <h1>Devis ${esc(QUOTE.number)}</h1>
    <div class="sub">${esc(QUOTE.prospectNom)}${QUOTE.title?' — '+esc(QUOTE.title):''}</div>
    ${QUOTE.introText?`<p style="font-size:13.5px;color:var(--tx);line-height:1.6;margin:0 0 24px">${esc(QUOTE.introText)}</p>`:''}
    ${quoteBlocksHtml()}
    <div class="stat-grid">
      ${stats.map(s=>`<div class="stat-card${s.grand?' grand':''}"><div class="stat-lbl">${esc(s.lbl)}</div><div class="stat-val">${s.val}</div></div>`).join('')}
    </div>
    ${QUOTE.mentionsText?`<div class="notes"><strong>Mentions spécifiques</strong>${esc(QUOTE.mentionsText)}</div>`:''}
    ${QUOTE.termsText?`<div class="notes"><strong>Conditions commerciales</strong>${esc(QUOTE.termsText)}</div>`:''}
  `;
}

// Vignettes des documents (30/10/2026, demande client "vignette sympa" +
// "vignette vidéo sur les liens URL") — un lien YouTube/Vimeo affiche sa
// vraie miniature vidéo (YouTube : URL statique prévisible, pas d'appel
// réseau ; Vimeo : nécessite son endpoint oEmbed public, chargé en async
// après le premier rendu, cf. plannerEnhanceVimeoThumbs — pas d'API key
// requise dans les deux cas). Un fichier image se prévisualise lui-même
// (via publicDocument) ; les autres types gardent une pastille colorée.
function youtubeId(url){
  const m = String(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function vimeoId(url){
  const m = String(url||'').match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}
function docThumbHtml(d){
  if(d.url){
    const yt = youtubeId(d.url);
    if(yt) return `<img class="doc-thumb is-video" src="https://img.youtube.com/vi/${yt}/mqdefault.jpg" alt="">`;
    const vm = vimeoId(d.url);
    if(vm) return `<div class="doc-thumb is-video" id="vimeo-thumb-${d.id}" data-vimeo-url="${esc(d.url)}">🔗</div>`;
    return `<div class="doc-thumb">🔗</div>`;
  }
  const mime = d.fileMimeType||'';
  if(/^image\//i.test(mime)) return `<img class="doc-thumb" src="/wa/crmQuote/publicDocument/${encodeURIComponent(d.id)}?token=${encodeURIComponent(TOKEN)}" alt="">`;
  if(/pdf/i.test(mime)) return `<div class="doc-thumb">📄</div>`;
  if(/presentation|powerpoint/i.test(mime)) return `<div class="doc-thumb">📊</div>`;
  if(/word|document/i.test(mime)) return `<div class="doc-thumb">📝</div>`;
  return `<div class="doc-thumb">📎</div>`;
}
// Vimeo n'expose pas d'URL de miniature statique (contrairement à YouTube)
// — son endpoint oEmbed public renvoie thumbnail_url, chargé après coup
// pour ne jamais bloquer le premier rendu sur un appel réseau tiers.
function enhanceVimeoThumbs(){
  document.querySelectorAll('[data-vimeo-url]').forEach(async el=>{
    try{
      const r = await fetch('https://vimeo.com/api/oembed.json?url='+encodeURIComponent(el.dataset.vimeoUrl));
      if(!r.ok) return;
      const data = await r.json();
      if(data.thumbnail_url){
        const img = document.createElement('img');
        img.className = 'doc-thumb is-video';
        img.src = data.thumbnail_url;
        el.replaceWith(img);
      }
    }catch(e){ /* vignette générique conservée */ }
  });
}
function fmtDateTime(iso){
  return new Date(iso).toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'});
}
// Suivi des onglets/documents consultés (30/10/2026, demande client) —
// alimente le score d'intérêt du prospect (cf. lib/crmScoring.ts), sans
// authentification (le visiteur n'a pas de session CRM) : POST sécurisé
// par le seul fait de connaître ce token, mêmes garanties que les autres
// routes publicXxx. Best-effort, ne bloque jamais l'affichage/le clic si
// l'appel échoue.
function trackQuoteEvent(eventType, module){
  fetch('/wa/crmQuote/trackEvent', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ token: TOKEN, eventType, module })
  }).catch(()=>{});
}
// Id plutôt que titre dans l'attribut onclick (évite tout souci
// d'échappement de guillemets si un titre de document en contient).
function trackQuoteDocument(docId){
  const d = (QUOTE.documents||[]).find(x=>x.id===docId);
  trackQuoteEvent('quote_document_opened', d?d.title:docId);
}
function documentsTabHtml(){
  return QUOTE.documents.map(d=>`
    <div class="doc-item">
      <div class="doc-left">
        ${docThumbHtml(d)}
        <div>
          <div class="doc-title">${esc(d.title)}</div>
          ${d.description?`<div class="doc-desc">${esc(d.description)}</div>`:''}
        </div>
      </div>
      <a class="btn btn-ghost doc-dl" style="width:auto" href="/wa/crmQuote/publicDocument/${encodeURIComponent(d.id)}?token=${encodeURIComponent(TOKEN)}" target="_blank" rel="noopener" onclick="trackQuoteDocument('${d.id}')">${d.fileMimeType?'Télécharger':'Ouvrir'}</a>
    </div>`).join('');
}
function bookingTabHtml(){
  // Lien du commercial en charge du dossier s'il en a un de renseigné (cf.
  // AdminUser.bookingUrl), repli sur le lien générique Sesame Technology —
  // 30/10/2026, demande client "filtre le commercial en charge du dossier".
  const BOOKING_URL = QUOTE.commercialBookingUrl || 'https://bookings.cloud.microsoft/book/SesameTechnology@sesame-technology.com/?ismsaljsauthenabled';
  const withCommercial = QUOTE.commercialBookingUrl && QUOTE.commercialName;
  return `<p style="font-size:13px;color:var(--tx)">Besoin d'échanger sur ce devis ou de planifier la suite ? Prenez rendez-vous directement avec ${withCommercial?'<strong>'+esc(QUOTE.commercialName)+'</strong>':'votre interlocuteur Sesame Technology'}.</p>
    <a class="btn" style="display:inline-block;width:auto;text-decoration:none" href="${BOOKING_URL}" target="_blank" rel="noopener">Ouvrir la prise de rendez-vous ↗</a>
    <iframe class="booking-frame" src="${BOOKING_URL}" title="Prise de rendez-vous Sesame Technology" loading="lazy"></iframe>`;
}
function meetingsTabHtml(){
  return QUOTE.meetings.map(m=>`
    <div class="meeting-item">
      <div class="meeting-date">${fmtDateTime(m.startDateTime)}</div>
      <div class="meeting-subject">${esc(m.subject)}</div>
      ${m.summaryText?`<div class="meeting-summary">${esc(m.summaryText)}</div>`:''}
      ${m.hasRecording?`<video controls preload="none" src="/wa/crmQuote/publicRecording/${encodeURIComponent(m.id)}?token=${encodeURIComponent(TOKEN)}"></video>`:''}
    </div>`).join('');
}

/**
 * Transmission du devis à un autre signataire, DEPUIS L'ESPACE CLIENT
 * lui-même (30/10/2026, "le bouton transmettre au signataire doit se
 * situer sur le portail client") — la personne qui ouvre ce lien n'est pas
 * forcément celle qui doit signer (ex. assistante, contact générique) ;
 * elle peut relayer le devis sans repasser par le commercial Sesame.
 * Formulaire replié par défaut derrière un simple lien, pour ne pas
 * distraire de l'action principale (signer).
 */
function transmitSectionHtml(){
  return `<div class="card">
    <div id="transmit-closed">
      <a href="#" onclick="event.preventDefault();document.getElementById('transmit-closed').style.display='none';document.getElementById('transmit-open').style.display='block'" style="color:var(--a);font-size:13px;font-weight:600;text-decoration:none">↪ Ce n'est pas à vous de signer ? Transmettez ce devis</a>
    </div>
    <div id="transmit-open" style="display:none">
      <h1 style="font-size:15px">Transmettre ce devis</h1>
      <p style="font-size:13px;color:var(--mu);margin:0 0 16px">Le destinataire recevra le même lien, avec le devis complet et le résumé des échanges déjà disponibles.</p>
      <label>Nom</label>
      <input type="text" id="transmitName" placeholder="Prénom Nom">
      <label>Email *</label>
      <input type="email" id="transmitEmail" placeholder="collegue@exemple.com">
      <button class="btn" id="transmitBtn" onclick="submitTransmit()">Transmettre le devis</button>
      <div class="err" id="transmitErr"></div>
    </div>
  </div>`;
}
async function submitTransmit(){
  const errEl = document.getElementById('transmitErr');
  errEl.style.display='none';
  const toName = document.getElementById('transmitName').value.trim();
  const toEmail = document.getElementById('transmitEmail').value.trim();
  if(!toEmail){ errEl.textContent='Indiquez un email.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('transmitBtn');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  try{
    const r = await fetch('/wa/crmQuote/publicTransmit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, toEmail, toName })
    });
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Erreur lors de la transmission.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Transmettre le devis'; return; }
  }catch(e){ errEl.textContent = 'Erreur de connexion au serveur.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Transmettre le devis'; return; }
  document.getElementById('transmit-open').innerHTML = `<div class="ok-box" style="padding:10px 0"><div style="color:#1a6b47;font-weight:600">✓ Devis transmis à ${esc(toEmail)}</div></div>`;
}

function signatureSectionHtml(){
  if(QUOTE.alreadySigned){
    const d = QUOTE.signedAt ? new Date(QUOTE.signedAt).toLocaleString('fr-FR') : '';
    return `<div class="card">
      <div class="ok-box">
        <div class="ok-icon">✓</div>
        <div><strong>Ce devis a déjà été signé</strong></div>
        <div class="sub">${esc(QUOTE.signerName||'')}${d?' — '+d:''}</div>
      </div>
    </div>`;
  }
  return `<div class="card">
    <h1 style="font-size:15px">Signature</h1>
    <div class="disclaimer">Signature électronique simple : nous enregistrons votre nom saisi, votre tracé, ainsi que la date et l'heure, à titre de preuve de votre consentement. Il ne s'agit pas d'une signature électronique qualifiée (eIDAS) certifiée par un tiers de confiance.</div>
    <label>Nom complet du signataire</label>
    <input type="text" id="signerName" placeholder="Prénom Nom">
    <label>Email (optionnel)</label>
    <input type="email" id="signerEmail" placeholder="vous@exemple.com">
    <label>Votre signature (dessinez ci-dessous)</label>
    <div class="sig-box"><canvas id="sigCanvas"></canvas></div>
    <div class="sig-actions"><span></span><button type="button" class="btn-ghost" onclick="clearSignature()">Effacer</button></div>
    <div class="consent">
      <input type="checkbox" id="consent">
      <label for="consent" style="margin:0">Je reconnais avoir pris connaissance de ce devis et des <a href="https://sesame-technology.fr/cgv" target="_blank" rel="noopener" style="color:var(--a)">conditions générales de vente</a>, et je les accepte.</label>
    </div>
    <button class="btn" id="submitBtn" onclick="submitSignature()">Signer et accepter</button>
    <div class="err" id="err"></div>
  </div>`;
}

const TAB_TRACK_LABEL = {devis:'Devis', documents:'Documents', meetings:'Comptes-rendus', booking:'Prendre rendez-vous'};
function switchTab(key){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===key));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.dataset.panel===key));
  trackQuoteEvent('quote_tab_viewed', TAB_TRACK_LABEL[key]||key);
}

// Espace client à onglets (29/10/2026) : l'onglet Devis est toujours
// présent ; Documents/Comptes-rendus n'apparaissent que s'il y a vraiment
// quelque chose à montrer (devis sans document attaché ni réunion =
// aucun onglet superflu, juste le devis comme avant).
function render(){
  const tabs = [{key:'devis', label:'Devis'}];
  if(QUOTE.documents.length) tabs.push({key:'documents', label:'Documents'});
  if(QUOTE.meetings.length) tabs.push({key:'meetings', label:'Comptes-rendus'});
  tabs.push({key:'booking', label:'Prendre rendez-vous'});

  const tabNav = tabs.length>1
    ? `<div class="tabs">${tabs.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" data-tab="${t.key}" onclick="switchTab('${t.key}')">${esc(t.label)}</button>`).join('')}</div>`
    : '';

  const devisPanel = `<div class="tab-panel active" data-panel="devis">
    <div class="card">${quoteSummaryHtml()}</div>
    ${QUOTE.alreadySigned?'':transmitSectionHtml()}
    ${signatureSectionHtml()}
  </div>`;
  const documentsPanel = QUOTE.documents.length
    ? `<div class="tab-panel" data-panel="documents"><div class="card"><h1 style="font-size:15px">Documents</h1>${documentsTabHtml()}</div></div>` : '';
  const meetingsPanel = QUOTE.meetings.length
    ? `<div class="tab-panel" data-panel="meetings"><div class="card"><h1 style="font-size:15px">Comptes-rendus de réunion</h1>${meetingsTabHtml()}</div></div>` : '';
  const bookingPanel = `<div class="tab-panel" data-panel="booking"><div class="card"><h1 style="font-size:15px">Prendre rendez-vous</h1>${bookingTabHtml()}</div></div>`;

  document.getElementById('app').innerHTML = tabNav + devisPanel + documentsPanel + meetingsPanel + bookingPanel;
  if(!QUOTE.alreadySigned) setupCanvas();
  enhanceVimeoThumbs();
}

let ctx, drawing=false, hasDrawn=false;
function setupCanvas(){
  const canvas = document.getElementById('sigCanvas');
  const box = canvas.parentElement;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = box.clientWidth * ratio;
  canvas.height = 160 * ratio;
  ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  hasDrawn = false;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', e=>{
    drawing = true; hasDrawn = true;
    const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
  });
  canvas.addEventListener('pointerup', ()=>{ drawing = false; });
  canvas.addEventListener('pointerleave', ()=>{ drawing = false; });
}
function clearSignature(){
  const canvas = document.getElementById('sigCanvas');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  hasDrawn = false;
}

async function submitSignature(){
  const errEl = document.getElementById('err');
  errEl.style.display='none';
  const signerName = document.getElementById('signerName').value.trim();
  const signerEmail = document.getElementById('signerEmail').value.trim();
  const consent = document.getElementById('consent').checked;
  if(!signerName){ errEl.textContent='Indiquez votre nom complet.'; errEl.style.display='block'; return; }
  if(!hasDrawn){ errEl.textContent='Veuillez dessiner votre signature.'; errEl.style.display='block'; return; }
  if(!consent){ errEl.textContent='Vous devez accepter les conditions pour signer.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  const signatureDataUrl = document.getElementById('sigCanvas').toDataURL('image/png');
  try{
    const r = await fetch('/wa/crmQuote/sign', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, signerName, signerEmail, signatureDataUrl, consent })
    });
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Erreur lors de la signature.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Signer et accepter'; return; }
  }catch(e){ errEl.textContent = 'Erreur de connexion au serveur.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Signer et accepter'; return; }
  QUOTE.alreadySigned = true;
  QUOTE.signerName = signerName;
  QUOTE.signedAt = new Date().toISOString();
  render();
}

init();
</script>
