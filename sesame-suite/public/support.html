<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Sesame Technology</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{--bg:#f5f4f0;--card:#fff;--bdr:#e2dfd9;--tx:#1a1a1a;--mu:#888;--a:#8a2b2b}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px}
  .logo{font-size:18px;font-weight:700;margin-bottom:4px}
  .logo em{color:var(--a);font-style:normal}
  .card{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;padding:22px;margin-top:18px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mu);font-size:12px;margin-bottom:18px}
  label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
  input[type=text],input[type=email],textarea{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:12px}
  textarea{resize:vertical;min-height:100px}
  .drop{border:1.5px dashed #d5d0c8;border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;color:#888;margin-bottom:8px;transition:border-color .15s ease,background .15s ease}
  .drop svg{display:block;margin:0 auto 6px}
  .drop span{display:block;font-size:12px;line-height:1.4}
  .drop small{display:block;font-size:11px;color:#aaa;margin-top:2px}
  .drop:hover,.drop:focus-visible{border-color:var(--a);outline:none}
  .drop.over{border-color:var(--a);background:#8a2b2b0d}
  .drop.full{opacity:.5;cursor:not-allowed}
  .filelist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .file{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:6px 8px;font-size:12px;color:#444}
  .file svg:first-child{flex-shrink:0;color:var(--a)}
  .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-size{color:#aaa;flex-shrink:0}
  .file-rm{background:none;border:none;color:#999;cursor:pointer;display:flex;padding:2px;flex-shrink:0;border-radius:4px}
  .file-rm:hover{color:#b3261e;background:#b3261e14}
  .file-hint{font-size:11px;color:#aaa;margin:-6px 0 12px;display:none}
  .file-hint.show{display:block}
  .btn{font-family:inherit;font-size:13px;padding:10px 18px;border-radius:8px;border:none;background:var(--a);color:#fff;cursor:pointer;width:100%;font-weight:500}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--mu);border:1px solid var(--bdr);width:auto}
  .err{color:#a32d2d;font-size:12px;margin-top:8px;display:none}
  .ok-box{text-align:center;padding:30px 10px}
  .ok-icon{font-size:36px;color:#1a6b47;margin-bottom:10px}
  .link-box{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:12px;word-break:break-all;margin-top:10px}
  .status-pill{display:inline-flex;font-size:11px;padding:3px 10px;border-radius:20px;background:#e6f1fb;color:#0c447c;font-weight:600;margin-bottom:14px}
  .msg{padding:12px 14px;margin-bottom:10px;border-radius:10px;background:#f7f6f2;border:1px solid var(--bdr)}
  .msg.agent{background:#eef3fb}
  .msg-head{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:6px}
  .msg-body{font-size:13px;white-space:pre-wrap}
  .msg-atts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .msg-atts img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--bdr)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">SESAME <em>TECHNOLOGY</em></div>
  <div id="app"><div class="card">Chargement…</div></div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
let TICKET = null;

async function init(){
  if(TOKEN){ await loadTicket(); } else { renderCreateForm(); }
}

async function loadTicket(){
  try{
    const r = await fetch('/wa/ticket/public?token='+encodeURIComponent(TOKEN));
    const data = await r.json();
    if(!r.ok){ renderError(data.error || 'Lien invalide ou expiré.'); return; }
    TICKET = data;
    renderTicket();
  }catch(e){ renderError('Erreur de connexion au serveur.'); }
}

function renderError(msg){
  document.getElementById('app').innerHTML = '<div class="card"><h1>Support</h1><div class="sub">'+esc(msg)+'</div></div>';
}

function filesToDataUrls(fileList, cb){
  const files = Array.from(fileList||[]);
  if(!files.length){ cb([]); return; }
  let done=0; const out=new Array(files.length);
  files.forEach((f,i)=>{
    const r = new FileReader();
    r.onload = e=>{ out[i]=e.target.result; done++; if(done===files.length) cb(out); };
    r.readAsDataURL(f);
  });
}

function formatFileSize(bytes){
  if(bytes<1024) return bytes+' o';
  if(bytes<1024*1024) return Math.round(bytes/1024)+' Ko';
  return (bytes/(1024*1024)).toFixed(1)+' Mo';
}

const MAX_FILES = 5;
const ICON_UPLOAD = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
const ICON_PAPERCLIP = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19l-9.2 9.19a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/></svg>';
const ICON_X_SMALL = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

// État des pièces jointes par formulaire (préfixe d'id) — deux dropzones
// coexistent potentiellement sur la page (création + suivi du ticket),
// chacune avec sa propre sélection de fichiers en mémoire (un <input type=file>
// natif ne permet pas d'accumuler des fichiers ajoutés en plusieurs fois).
const filesState = {};

function dropzoneHtml(prefix){
  return `<div class="drop" id="${prefix}-drop" tabindex="0" role="button" aria-label="Ajouter des fichiers">
      ${ICON_UPLOAD}
      <span>Cliquez ou glissez-déposez des fichiers ici</span>
      <small>${MAX_FILES} fichiers maximum</small>
    </div>
    <input type="file" id="${prefix}-input" accept="image/*,.pdf" multiple hidden>
    <div class="file-hint" id="${prefix}-filehint"></div>
    <div class="filelist" id="${prefix}-filelist"></div>`;
}

function renderFileList(prefix){
  const listEl = document.getElementById(prefix+'-filelist');
  const dropEl = document.getElementById(prefix+'-drop');
  if(!listEl || !dropEl) return;
  const files = filesState[prefix] || [];
  listEl.innerHTML = files.map((f,i)=>`<div class="file">${ICON_PAPERCLIP}<span class="file-name">${esc(f.name)}</span><span class="file-size">${formatFileSize(f.size)}</span><button type="button" class="file-rm" data-rm="${i}" aria-label="Retirer">${ICON_X_SMALL}</button></div>`).join('');
  dropEl.classList.toggle('full', files.length>=MAX_FILES);
  listEl.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      files.splice(Number(btn.getAttribute('data-rm')), 1);
      renderFileList(prefix);
    });
  });
}

function addFiles(prefix, newFiles){
  const hintEl = document.getElementById(prefix+'-filehint');
  const files = filesState[prefix] || (filesState[prefix]=[]);
  const room = MAX_FILES - files.length;
  const accepted = newFiles.slice(0, Math.max(room, 0));
  filesState[prefix] = files.concat(accepted);
  if(hintEl){
    if(newFiles.length > accepted.length){
      hintEl.textContent = MAX_FILES+" fichiers maximum — les fichiers en trop n'ont pas été ajoutés.";
      hintEl.classList.add('show');
    } else {
      hintEl.classList.remove('show');
    }
  }
  renderFileList(prefix);
}

function wireDropzone(prefix){
  filesState[prefix] = [];
  const dropEl = document.getElementById(prefix+'-drop');
  const inputEl = document.getElementById(prefix+'-input');
  if(!dropEl || !inputEl) return;
  dropEl.addEventListener('click', ()=>{ if((filesState[prefix]||[]).length < MAX_FILES) inputEl.click(); });
  dropEl.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); if((filesState[prefix]||[]).length < MAX_FILES) inputEl.click(); }
  });
  inputEl.addEventListener('change', ()=>{ addFiles(prefix, Array.from(inputEl.files||[])); inputEl.value=''; });
  dropEl.addEventListener('dragover', e=>{ e.preventDefault(); dropEl.classList.add('over'); });
  dropEl.addEventListener('dragleave', ()=>{ dropEl.classList.remove('over'); });
  dropEl.addEventListener('drop', e=>{
    e.preventDefault();
    dropEl.classList.remove('over');
    addFiles(prefix, Array.from((e.dataTransfer && e.dataTransfer.files) || []));
  });
}

function renderCreateForm(){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h1>Ouvrir un ticket support</h1>
      <div class="sub">Décrivez votre incident, nous vous répondrons par email dès que possible.</div>
      <label>Votre email</label>
      <input type="email" id="f-email" placeholder="vous@votrehotel.fr">
      <label>Votre nom</label>
      <input type="text" id="f-name" placeholder="Prénom Nom">
      <label>Sujet</label>
      <input type="text" id="f-subject" placeholder="Ex. Redémarrage platine incomplet">
      <label>Description</label>
      <textarea id="f-message" placeholder="Décrivez le problème rencontré…"></textarea>
      <label>Pièces jointes (optionnel)</label>
      ${dropzoneHtml('f')}
      <button class="btn" id="f-submit" onclick="submitTicket()">Envoyer</button>
      <div class="err" id="f-err"></div>
    </div>`;
  wireDropzone('f');
}

async function submitTicket(){
  const errEl = document.getElementById('f-err');
  errEl.style.display='none';
  const email = document.getElementById('f-email').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const subject = document.getElementById('f-subject').value.trim();
  const message = document.getElementById('f-message').value.trim();
  if(!email || !email.includes('@')){ errEl.textContent='Adresse email valide requise.'; errEl.style.display='block'; return; }
  if(!subject){ errEl.textContent='Indiquez un sujet.'; errEl.style.display='block'; return; }
  if(!message){ errEl.textContent='Décrivez votre incident.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('f-submit');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  filesToDataUrls(filesState.f, async (attachments)=>{
    try{
      const r = await fetch('/wa/ticket/create', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, name, subject, message, attachments })
      });
      const data = await r.json();
      if(!r.ok){ errEl.textContent = data.error || "Erreur lors de l'ouverture du ticket."; errEl.style.display='block'; btn.disabled=false; btn.textContent='Envoyer'; return; }
      const link = location.origin + '/support.html?token=' + data.publicToken;
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="ok-box">
            <div class="ok-icon">✓</div>
            <div><strong>Ticket ${esc(data.number)} ouvert avec succès</strong></div>
            <div class="sub">Nous reviendrons vers vous par email dès que possible.</div>
            <div class="sub" style="margin-top:10px">Conservez ce lien pour suivre ou compléter votre ticket :</div>
            <div class="link-box"><a href="${esc(link)}">${esc(link)}</a></div>
          </div>
        </div>`;
    }catch(e){ errEl.textContent = 'Erreur de connexion au serveur.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Envoyer'; }
  });
}

function msgHtml(m){
  return `<div class="msg ${m.authorType==='agent'?'agent':''}">
    <div class="msg-head"><strong>${esc(m.authorName||(m.authorType==='agent'?'Équipe support':'Vous'))}</strong><span>${new Date(m.createdAt).toLocaleString('fr-FR')}</span></div>
    <div class="msg-body">${esc(m.body)}</div>
    ${(m.attachments||[]).length?`<div class="msg-atts">${m.attachments.map(a=>`<a href="${a}" target="_blank"><img src="${a}"></a>`).join('')}</div>`:''}
  </div>`;
}

function renderTicket(){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <span class="status-pill">${esc(TICKET.status)}</span>
      <h1>${esc(TICKET.subject)}</h1>
      <div class="sub">Ticket ${esc(TICKET.number)}</div>
      ${TICKET.messages.map(msgHtml).join('')}
    </div>
    <div class="card">
      <h1 style="font-size:15px">Compléter mon ticket</h1>
      <label>Message</label>
      <textarea id="r-body" placeholder="Ajoutez une précision…"></textarea>
      <label>Pièces jointes (optionnel)</label>
      ${dropzoneHtml('r')}
      <button class="btn" id="r-submit" onclick="submitFollowup()">Envoyer</button>
      <div class="err" id="r-err"></div>
    </div>`;
  wireDropzone('r');
}

async function submitFollowup(){
  const errEl = document.getElementById('r-err');
  errEl.style.display='none';
  const body = document.getElementById('r-body').value.trim();
  if(!body){ errEl.textContent='Message requis.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('r-submit');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  filesToDataUrls(filesState.r, async (attachments)=>{
    try{
      const r = await fetch('/wa/ticket/publicReply', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token: TOKEN, body, attachments })
      });
      const data = await r.json();
      if(!r.ok){ errEl.textContent = data.error || "Erreur lors de l'envoi."; errEl.style.display='block'; btn.disabled=false; btn.textContent='Envoyer'; return; }
    }catch(e){ errEl.textContent = 'Erreur de connexion au serveur.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Envoyer'; return; }
    await loadTicket();
  });
}

init();
</script>
</body>
</html>
