<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Sesame Technology</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  :root{--bg:#f5f4f0;--card:#fff;--bdr:#e2dfd9;--tx:#1a1a1a;--mu:#888;--a:#8a2b2b}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
  .search{width:100%;font-family:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--bdr);border-radius:9px;margin-bottom:16px}
  .search::placeholder{color:#b5b2ac}
  .cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .cat-pill{padding:5px 12px;border:1px solid var(--bdr);border-radius:999px;font-size:12px;font-weight:500;color:var(--mu);cursor:pointer;user-select:none;background:var(--card)}
  .cat-pill.on{border-color:var(--a);color:var(--a);background:#fbeeee}
  .item{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .item-q{padding:14px 16px;cursor:pointer;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .item-q .chev{color:var(--mu);transition:transform .15s;flex-shrink:0}
  .item.on .item-q .chev{transform:rotate(180deg)}
  .item-a{display:none;padding:0 16px 16px;font-size:13px;color:#444;line-height:1.55}
  .item.on .item-a{display:block}
  .item-a p{margin:0 0 10px}
  .item-a ol{margin:0;padding-left:18px}
  .item-a li{margin-bottom:4px}
  .empty{text-align:center;color:var(--mu);padding:30px 10px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <input class="search" id="search" type="text" placeholder="Rechercher une question…" oninput="render()">
  <div class="cat-row" id="cats"></div>
  <div id="list"></div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let FAQS = [];
let OPEN_ID = null;
let CATEGORY = '';

async function init(){
  try{
    const r = await fetch('/wa/faq/public');
    FAQS = r.ok ? await r.json() : [];
  }catch(e){ FAQS = []; }
  renderCats();
  render();
}

function renderCats(){
  const cats = Array.from(new Set(FAQS.map(f=>f.category).filter(Boolean)));
  const el = document.getElementById('cats');
  if(!cats.length){ el.innerHTML=''; return; }
  el.innerHTML = '<div class="cat-pill'+(CATEGORY===''?' on':'')+'" onclick="setCategory(\'\')">Tout</div>'
    + cats.map(c=>'<div class="cat-pill'+(CATEGORY===c?' on':'')+'" onclick="setCategory(\''+esc(c)+'\')">'+esc(c)+'</div>').join('');
}
function setCategory(c){ CATEGORY = c; renderCats(); render(); }

function toggle(id){ OPEN_ID = (OPEN_ID===id) ? null : id; render(); }

function render(){
  const q = (document.getElementById('search').value||'').trim().toLowerCase();
  const filtered = FAQS.filter(f=>{
    if(CATEGORY && f.category!==CATEGORY) return false;
    if(!q) return true;
    return (f.question+' '+f.title+' '+f.shortAnswer).toLowerCase().includes(q);
  });
  const list = document.getElementById('list');
  if(!filtered.length){ list.innerHTML = '<div class="empty">Aucune question ne correspond à votre recherche.</div>'; return; }
  list.innerHTML = filtered.map(f=>{
    const on = OPEN_ID===f.id;
    const procedureHtml = (f.procedure&&f.procedure.length) ? '<ol>'+f.procedure.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>' : '';
    return '<div class="item'+(on?' on':'')+'">'
      + '<div class="item-q" onclick="toggle(\''+f.id+'\')"><span>'+esc(f.question||f.title)+'</span><span class="chev">▾</span></div>'
      + '<div class="item-a"><p>'+esc(f.detailedAnswer||f.shortAnswer).replace(/\n/g,'<br>')+'</p>'+procedureHtml+'</div>'
      + '</div>';
  }).join('');
}

init();
</script>
</body>
</html>
