<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire de qualification — Sesame Technology</title>
<style>
  :root{--bg:#f5f4f0;--card:#fff;--bdr:#e2dfd9;--tx:#1a1a1a;--mu:#888;--a:#8a2b2b;--ok:#1a6b47}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px}
  .logo{font-size:18px;font-weight:700;margin-bottom:4px}
  .logo em{color:var(--a);font-style:normal}
  .card{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;padding:22px;margin-top:18px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mu);font-size:12px;margin-bottom:4px}
  .intro{font-size:13px;color:#555;margin-top:10px;line-height:1.5}
  .mod{border-top:1px solid var(--bdr);padding-top:16px;margin-top:16px}
  .mod:first-of-type{border-top:none;margin-top:8px;padding-top:8px}
  .mod-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--a);font-weight:700;margin-bottom:4px}
  .mod-q{font-size:14px;font-weight:500;margin-bottom:10px}
  .choices{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .choice{flex:1;min-width:90px;text-align:center;padding:9px 8px;border:1.5px solid var(--bdr);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mu);user-select:none;transition:all .12s}
  .choice.on{border-color:var(--a);color:var(--a);background:#fbeeee}
  .mod-note{width:100%;font-family:inherit;font-size:12px;padding:7px 9px;border:1px solid var(--bdr);border-radius:8px;margin-top:2px;resize:vertical;min-height:34px}
  .mod-note::placeholder{color:#b5b2ac}
  label.top{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
  input[type=text],input[type=email]{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:12px}
  .btn{font-family:inherit;font-size:13px;padding:11px 18px;border-radius:8px;border:none;background:var(--a);color:#fff;cursor:pointer;width:100%;font-weight:500;margin-top:18px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:#a32d2d;font-size:12px;margin-top:8px;display:none}
  .ok-box{text-align:center;padding:30px 10px}
  .ok-icon{font-size:36px;color:var(--ok);margin-bottom:10px}
  .progress{font-size:11px;color:var(--mu);text-align:right;margin-top:-6px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">SESAME <em>TECHNOLOGY</em></div>
  <div id="app"><div class="card">Chargement…</div></div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
let DATA = null;
let ANSWERS = {}; // moduleKey -> {interested, note}

async function init(){
  if(!TOKEN){ renderError('Lien invalide.'); return; }
  try{
    const r = await fetch('/wa/crmQualification/public?token='+encodeURIComponent(TOKEN));
    const data = await r.json();
    if(!r.ok){ renderError(data.error || 'Lien invalide ou expiré.'); return; }
    DATA = data;
    (data.responses||[]).forEach(function(resp){ ANSWERS[resp.moduleKey] = {interested:resp.interested, note:resp.note||''}; });
    render();
  }catch(e){ renderError('Erreur de connexion au serveur.'); }
}

function renderError(msg){
  document.getElementById('app').innerHTML = '<div class="card"><h1>Questionnaire de qualification</h1><div class="sub">'+esc(msg)+'</div></div>';
}

function choiceHtml(moduleKey, value, label){
  const on = (ANSWERS[moduleKey]||{}).interested === value;
  return '<div class="choice'+(on?' on':'')+'" onclick="pickInterest(\''+moduleKey+'\',\''+value+'\')">'+label+'</div>';
}

function moduleHtml(m){
  return '<div class="mod">'
    + '<div class="mod-label">'+esc(m.label)+'</div>'
    + '<div class="mod-q">'+esc(m.question)+'</div>'
    + '<div class="choices">'
      + choiceHtml(m.key,'oui','Oui')
      + choiceHtml(m.key,'peut-etre','Peut-être')
      + choiceHtml(m.key,'non','Non')
    + '</div>'
    + '<textarea class="mod-note" rows="1" placeholder="Un commentaire ? (optionnel)" oninput="setNote(\''+m.key+'\',this.value)">'+esc((ANSWERS[m.key]||{}).note||'')+'</textarea>'
    + '</div>';
}

function render(){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h1>Questionnaire de qualification</h1>
      <div class="sub">${esc(DATA.nom)}</div>
      <div class="intro">Trois minutes suffisent — vos réponses nous aident à ne vous parler que des fonctionnalités Sesame réellement utiles pour votre établissement.</div>
    </div>
    <div class="card">
      ${DATA.modules.map(moduleHtml).join('')}
      <button class="btn" id="submitBtn" onclick="submitAnswers()">Envoyer mes réponses</button>
      <div class="err" id="err"></div>
    </div>
  `;
}

function pickInterest(moduleKey, value){
  if(!ANSWERS[moduleKey]) ANSWERS[moduleKey] = {interested:'', note:''};
  ANSWERS[moduleKey].interested = value;
  render();
}
function setNote(moduleKey, value){
  if(!ANSWERS[moduleKey]) ANSWERS[moduleKey] = {interested:'', note:''};
  ANSWERS[moduleKey].note = value;
}

async function submitAnswers(){
  const errEl = document.getElementById('err');
  errEl.style.display='none';
  const responses = DATA.modules
    .filter(function(m){ return ANSWERS[m.key] && ANSWERS[m.key].interested; })
    .map(function(m){ return {moduleKey:m.key, interested:ANSWERS[m.key].interested, note:ANSWERS[m.key].note||''}; });
  if(!responses.length){ errEl.textContent='Répondez à au moins un module avant d\'envoyer.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  try{
    const r = await fetch('/wa/crmQualification/submit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, responses: responses })
    });
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Erreur lors de l\'envoi.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Envoyer mes réponses'; return; }
  }catch(e){ errEl.textContent = 'Erreur de connexion au serveur.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Envoyer mes réponses'; return; }
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="ok-box">
        <div class="ok-icon">✓</div>
        <div><strong>Merci !</strong></div>
        <div class="sub">Vos réponses ont bien été enregistrées.</div>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
