<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tickets — Sesame Technology</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{--bg:#f5f4f0;--card:#fff;--bdr:#e2dfd9;--tx:#1a1a1a;--mu:#888;--a:#8a2b2b;--div:#eeece8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;overflow-x:hidden}
  input,textarea,select,button{font-family:inherit}
  a{color:var(--a)}

  /* ── Connexion ── */
  #loginGate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .lg-box{background:var(--card);border-radius:14px;padding:26px 22px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
  .lg-title{font-size:19px;font-weight:700;margin-bottom:2px}
  .lg-title em{color:var(--a);font-style:normal}
  .lg-sub{color:var(--mu);font-size:12px;margin-bottom:18px}
  .ff{margin-bottom:12px}
  .ff label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
  .ff input,.ff select,.ff textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--bdr);border-radius:9px;background:#fff;color:var(--tx)}
  .ff textarea{resize:vertical;min-height:90px}
  .btn{font-size:14px;padding:12px 16px;border-radius:9px;border:none;background:var(--a);color:#fff;cursor:pointer;width:100%;font-weight:600}
  .btn:disabled{opacity:.4}
  .btn-ghost{background:transparent;color:var(--mu);border:1px solid var(--bdr);font-weight:500}
  .lg-err{color:#a32d2d;font-size:12px;margin-top:10px;display:none}

  /* ── App ── */
  #app{display:none;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:0.5px solid var(--bdr);padding:12px 14px;display:flex;align-items:center;gap:10px}
  header .htitle{font-size:16px;font-weight:700;flex:1}
  header .hbtn{background:none;border:none;color:var(--tx);font-size:20px;padding:6px;cursor:pointer;line-height:1;border-radius:8px}
  header .hbtn:active{background:var(--div)}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ── Liste ── */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;-webkit-overflow-scrolling:touch}
  .chip{flex-shrink:0;font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--bdr);background:#fff;color:var(--mu);white-space:nowrap;cursor:pointer;display:flex;gap:5px;align-items:center}
  .chip.on{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}
  .chip .n{opacity:.85}
  .tlist{padding:0 14px 20px}
  .titem{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
  .titem:active{background:var(--div)}
  .ti-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .ti-subj{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ti-time{font-size:11px;color:var(--mu);flex-shrink:0}
  .ti-meta{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;gap:8px}
  .pill{display:inline-flex;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;flex-shrink:0}
  .p-attente{background:#fdf1e3;color:#a3791f}
  .p-cours{background:#e6f1fb;color:#0c447c}
  .p-client{background:#f1f1ee;color:#666}
  .p-resolu{background:#e5f3ea;color:#1a6b47}
  .p-ferme{background:#f1f1ee;color:#888}
  .empty{text-align:center;color:var(--mu);font-size:13px;padding:40px 20px}

  /* ── Détail ticket ── */
  .d-head{padding:14px;background:var(--card);border-bottom:0.5px solid var(--bdr)}
  .d-subj{font-size:16px;font-weight:700;margin-bottom:3px}
  .d-num{font-size:12px;color:var(--mu);margin-bottom:10px}
  .d-status select{width:100%;font-size:14px;padding:9px 10px;border:1px solid var(--bdr);border-radius:8px;background:#fff;font-weight:600}
  .thread{padding:12px 14px}
  .msg{padding:11px 13px;margin-bottom:9px;border-radius:11px;background:var(--card);border:1px solid var(--bdr)}
  .msg.agent{background:var(--div);margin-left:18px}
  .msg.sys{background:none;border:none;color:var(--mu);font-size:11px;text-align:center;padding:4px}
  .msg-head{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:5px;gap:8px}
  .msg-head strong{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg-body{font-size:13.5px;white-space:pre-wrap;line-height:1.45}
  .reply-bar{position:sticky;bottom:0;background:var(--card);border-top:0.5px solid var(--bdr);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
  .reply-bar textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--bdr);border-radius:10px;resize:none;min-height:44px;max-height:120px}
  .reply-actions{display:flex;gap:8px}
  .reply-actions .btn{flex:1;width:auto}
  .r-err{color:#a32d2d;font-size:12px;display:none}
</style>
</head>
<body>

<div id="loginGate">
  <div class="lg-box" id="lg-box">
    <div class="lg-title">Tickets <em>mobile</em></div>
    <div class="lg-sub">Sesame Technology — réservé à l'équipe support.</div>
    <div class="ff"><label>Email</label><input type="email" id="lg-email" autocomplete="username" placeholder="vous@sesame.technology"></div>
    <div class="ff"><label>Mot de passe</label><input type="password" id="lg-password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn" onclick="login()">Se connecter</button>
    <div class="lg-err" id="lg-err"></div>
  </div>
</div>

<div id="app">
  <header>
    <button class="hbtn" id="h-back" style="display:none" onclick="showList()">←</button>
    <span class="htitle" id="h-title">Tickets</span>
    <button class="hbtn" id="h-refresh" onclick="refreshCurrent()" title="Actualiser">⟳</button>
    <button class="hbtn" onclick="logout()" title="Se déconnecter">⏻</button>
  </header>
  <main id="main"></main>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function relTime(iso){
  const d = new Date(iso), diff = (Date.now()-d.getTime())/1000;
  if(diff<60) return "à l'instant";
  if(diff<3600) return Math.floor(diff/60)+' min';
  if(diff<86400) return Math.floor(diff/3600)+' h';
  if(diff<86400*7) return Math.floor(diff/86400)+' j';
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

var ADMIN_TOKEN = sessionStorage.getItem('SESAME_ADMIN_TOKEN') || null;
function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, {Authorization:'Bearer '+ADMIN_TOKEN});
  return fetch(url, opts);
}

async function login(){
  const email = (document.getElementById('lg-email').value||'').trim();
  const password = document.getElementById('lg-password').value||'';
  const errEl = document.getElementById('lg-err');
  errEl.style.display='none';
  if(!email||!password){ errEl.textContent='Email et mot de passe requis'; errEl.style.display='block'; return; }
  try{
    const r = await fetch('/wa/login/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password})});
    const data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Identifiants incorrects'; errEl.style.display='block'; return; }
    if(data.admin.role !== 'sesame'){ errEl.textContent = 'Réservé aux comptes Sesame Technology.'; errEl.style.display='block'; return; }
    ADMIN_TOKEN = data.token;
    sessionStorage.setItem('SESAME_ADMIN_TOKEN', ADMIN_TOKEN);
    sessionStorage.setItem('SESAME_ADMIN_ROLE', data.admin.role);
    sessionStorage.setItem('SESAME_ADMIN_CRMROLE', data.admin.crmRole||'');
    enterApp();
  }catch(e){ errEl.textContent = 'Erreur de connexion au serveur'; errEl.style.display='block'; }
}
function logout(){
  sessionStorage.removeItem('SESAME_ADMIN_TOKEN');
  ADMIN_TOKEN = null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginGate').style.display='flex';
}
function enterApp(){
  document.getElementById('loginGate').style.display='none';
  document.getElementById('app').style.display='flex';
  showList();
}

const TICKET_STATUSES = ['En attente','En cours','Attente client','Résolu','Fermé'];
const STATUS_PILL = {'En attente':'p-attente','En cours':'p-cours','Attente client':'p-client','Résolu':'p-resolu','Fermé':'p-ferme'};
const STATUS_FILTER_DEFAULT = ['En attente','En cours'];
let statusFilter = new Set(STATUS_FILTER_DEFAULT);
let TICKETS = [];
let CURRENT_ID = null; // ticket ouvert en détail, ou null en liste

// ── Liste ──────────────────────────────────────────────────────────────

async function showList(){
  CURRENT_ID = null;
  document.getElementById('h-back').style.display='none';
  document.getElementById('h-title').textContent='Tickets';
  document.getElementById('main').innerHTML = '<div class="empty">Chargement…</div>';
  try{
    const r = await apiFetch('/wa/crmTicket/list');
    if(!r.ok) throw new Error('http '+r.status);
    TICKETS = await r.json();
  }catch(e){ document.getElementById('main').innerHTML = '<div class="empty">Erreur de chargement. <button class="hbtn" onclick="showList()">Réessayer</button></div>'; return; }
  renderList();
}

function toggleStatusChip(s){
  if(statusFilter.has(s)) statusFilter.delete(s); else statusFilter.add(s);
  renderList();
}
function showAllStatuses(){ statusFilter = new Set(); renderList(); }

function renderList(){
  const counts = {};
  TICKET_STATUSES.forEach(s=>counts[s]=TICKETS.filter(t=>t.status===s).length);
  let rows = statusFilter.size ? TICKETS.filter(t=>statusFilter.has(t.status)) : TICKETS.slice();
  rows.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));

  const chips = TICKET_STATUSES.map(s=>`<div class="chip ${statusFilter.has(s)?'on':''}" onclick="toggleStatusChip('${s}')">${s} <span class="n">${counts[s]}</span></div>`).join('')
    + `<div class="chip ${statusFilter.size===0?'on':''}" onclick="showAllStatuses()">Tous <span class="n">${TICKETS.length}</span></div>`;

  const items = rows.map(t=>`
    <div class="titem" onclick="openTicket('${t.id}')">
      <div class="ti-top"><span class="ti-subj">${esc(t.subject)}</span><span class="ti-time">${relTime(t.updatedAt)}</span></div>
      <div class="ti-meta"><span>${esc(t.prospectNom||t.contactEmail)}</span><span class="pill ${STATUS_PILL[t.status]||''}">${esc(t.status)}</span></div>
    </div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="chips">${chips}</div>
    <div class="tlist">${items || '<div class="empty">Aucun ticket pour ce filtre.</div>'}</div>`;
}

// ── Détail ticket ────────────────────────────────────────────────────

async function openTicket(id){
  CURRENT_ID = id;
  document.getElementById('h-back').style.display='';
  document.getElementById('h-title').textContent='Ticket';
  document.getElementById('main').innerHTML = '<div class="empty">Chargement…</div>';
  try{
    const r = await apiFetch('/wa/crmTicket/get?id='+encodeURIComponent(id));
    if(!r.ok) throw new Error('http '+r.status);
    const t = await r.json();
    if(CURRENT_ID!==id) return; // l'agent a déjà changé de ticket entre-temps
    renderDetail(t);
  }catch(e){ document.getElementById('main').innerHTML = '<div class="empty">Ticket introuvable.</div>'; }
}

function refreshCurrent(){ CURRENT_ID ? openTicket(CURRENT_ID) : showList(); }

function msgHtml(m){
  if(m.kind==='system') return `<div class="msg sys">${esc(m.body)}${m.authorName?' — '+esc(m.authorName):''}</div>`;
  const isAgent = m.authorType==='agent';
  return `<div class="msg ${isAgent?'agent':''}">
    <div class="msg-head"><strong>${esc(m.authorName||(isAgent?'Équipe support':'Client'))}${m.kind==='note'?' · note interne':''}</strong><span>${relTime(m.createdAt)}</span></div>
    <div class="msg-body">${esc(m.body)}</div>
  </div>`;
}

function renderDetail(t){
  document.getElementById('main').innerHTML = `
    <div class="d-head">
      <div class="d-subj">${esc(t.subject)}</div>
      <div class="d-num">${esc(t.number)} · ${esc(t.prospectNom||t.contactEmail)}</div>
      <div class="d-status"><select id="d-status" onchange="changeStatus('${t.id}',this.value)">${TICKET_STATUSES.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="thread">${t.messages.map(msgHtml).join('')}</div>
    <div class="reply-bar">
      <textarea id="d-reply" placeholder="Votre réponse…" rows="2" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <div class="reply-actions">
        <button class="btn" id="d-send" onclick="sendReply('${t.id}','reply')">Répondre</button>
        <button class="btn btn-ghost" onclick="sendReply('${t.id}','note')">Note interne</button>
      </div>
      <div class="r-err" id="d-err"></div>
    </div>`;
}

async function changeStatus(id, status){
  try{
    const r = await apiFetch('/wa/crmTicket/update', {method:'POST', body:JSON.stringify({id, status})});
    if(!r.ok) throw new Error('http '+r.status);
    const updated = await r.json();
    const i = TICKETS.findIndex(x=>x.id===id); if(i>-1) TICKETS[i]=updated;
  }catch(e){ alert('Erreur de mise à jour du statut'); if(CURRENT_ID===id) openTicket(id); }
}

async function sendReply(id, kind){
  const bodyEl = document.getElementById('d-reply');
  const errEl = document.getElementById('d-err');
  const text = bodyEl.value.trim();
  errEl.style.display='none';
  if(!text){ errEl.textContent='Message requis'; errEl.style.display='block'; return; }
  const btn = document.getElementById('d-send');
  btn.disabled = true;
  try{
    const r = await apiFetch('/wa/crmTicket/reply', {method:'POST', body:JSON.stringify({id, body:text, kind})});
    const data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
  }catch(e){ errEl.textContent = e.message||'Erreur de connexion au serveur'; errEl.style.display='block'; btn.disabled=false; return; }
  btn.disabled = false;
  if(CURRENT_ID===id) openTicket(id);
}

if(ADMIN_TOKEN) enterApp();
</script>
</body>
</html>
