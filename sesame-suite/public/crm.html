<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sesame CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f4f0;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── TOPBAR ── */
.topbar{background:#fff;border-bottom:0.5px solid #e2dfd9;padding:0 18px;height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:50}
.logo{font-size:14px;font-weight:600;letter-spacing:-.02em;color:#1a1a1a}.logo em{color:#8a2b2b;font-style:normal}
.tb-sep{color:#d5d2cc;font-size:16px;margin:0 2px}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px}
.bc-link{color:#999;cursor:pointer}.bc-link:hover{color:#1a1a1a;text-decoration:underline}
.bc-cur{color:#1a1a1a;font-weight:500}
.bc-sep{color:#d5d2cc}
.tb-right{margin-left:auto;display:flex;gap:7px;align-items:center}

/* ── BUTTONS ── */
.btn{font-family:inherit;font-size:12px;padding:0 13px;height:31px;border-radius:8px;border:0.5px solid #d0cdc6;background:#fff;color:#444;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .1s;white-space:nowrap;flex-shrink:0}
.btn:hover{background:#f0ede8;border-color:#bbb}
.btn-primary{background:#8a2b2b;border-color:#8a2b2b;color:#fff}.btn-primary:hover{background:#711f1f}
.btn-ghost{background:transparent;border-color:#d0cdc6;color:#555}
.btn-green{background:#eaf3de;border-color:#c0dd97;color:#27500a}.btn-green:hover{background:#d5ecb8}
.btn-amber{background:#faeeda;border-color:#fac775;color:#633806}
.btn-purple{background:#eeedfe;border-color:#afa9ec;color:#3c3489}
.btn-sm{height:27px;font-size:11px;padding:0 9px;border-radius:7px}
.btn-icon{width:30px;padding:0;justify-content:center;font-size:14px}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden;position:relative}

/* ── MENU TOGGLE (mobile) ── */
.menu-toggle{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:#444;padding:2px 6px;line-height:1}

/* ── SIDEBAR ── */
.sidebar{width:210px;flex-shrink:0;background:#fff;border-right:0.5px solid #e2dfd9;display:flex;flex-direction:column;overflow-y:auto}
.sidebar-overlay{display:none}
.nav-lbl{font-size:10px;font-weight:500;color:#c0bdb8;padding:14px 16px 3px;letter-spacing:.07em;text-transform:uppercase;user-select:none}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;color:#666;cursor:pointer;transition:background .1s;user-select:none}
.nav-item:hover{background:#f7f6f3;color:#1a1a1a}
.nav-item.active{background:#f0ede8;color:#1a1a1a;font-weight:500}
.nav-ico{width:15px;height:15px;border:1px solid #d0cdc6;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#bbb;flex-shrink:0}
.nav-item.active .nav-ico{border-color:#999;color:#666}
.nb{margin-left:auto;font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px}
.nb-r{background:#fcebeb;color:#791f1f}.nb-a{background:#faeeda;color:#633806}
.s-hr{border:none;border-top:0.5px solid #eeece8;margin:6px 0}
.view-toggle{display:flex;gap:5px;padding:8px 12px 10px}
.vt{flex:1;font-size:11px;height:27px;border-radius:7px;border:0.5px solid #d0cdc6;background:#fff;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .1s;font-family:inherit}
.vt:hover{background:#f0ede8}
.vt.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#c7c4bd #f5f4f0}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-track{background:#f5f4f0}
.main::-webkit-scrollbar-thumb{background:#c7c4bd;border-radius:5px;border:2px solid #f5f4f0}
.main::-webkit-scrollbar-thumb:hover{background:#a8a49c}

/* ── CARDS ── */
.card{background:#fff;border:0.5px solid #e2dfd9;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:9px;border-bottom:0.5px solid #eeece8}
.ch-ico{width:18px;height:18px;border:1px solid #d0cdc6;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa;flex-shrink:0}
.ch-title{font-size:13px;font-weight:500;color:#1a1a1a;flex:1}
.divl{border:none;border-top:0.5px solid #eeece8;margin:10px 0}

/* ── TAGS / BADGES ── */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 9px;border-radius:20px;border:0.5px solid}
.t-gray{background:#f1efe8;color:#555;border-color:#d8d6cf}
.t-blue{background:#e6f1fb;color:#0c447c;border-color:#b5d4f4}
.t-green{background:#eaf3de;color:#27500a;border-color:#c0dd97}
.t-red{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
.t-amber{background:#faeeda;color:#633806;border-color:#fac775}
.t-purple{background:#eeedfe;color:#3c3489;border-color:#afa9ec}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.bd{background:#fcebeb;color:#791f1f}.bw{background:#faeeda;color:#633806}
.bg{background:#eaf3de;color:#27500a}.bn{background:#f1efe8;color:#999}.bi{background:#e6f1fb;color:#0c447c}

/* ── FICHE ── */
.hero-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:13px}
.avatar{border-radius:50%;background:#eeedfe;display:flex;align-items:center;justify-content:center;font-weight:600;color:#3c3489;flex-shrink:0;font-size:15px}
.hero-name{font-size:18px;font-weight:500;margin-bottom:5px}
.tags-row{display:flex;gap:5px;flex-wrap:wrap}
.score-box{margin-left:auto;text-align:right;flex-shrink:0}
.score-lbl{font-size:11px;color:#aaa;margin-bottom:1px}
.score-num{font-size:26px;font-weight:500;line-height:1}
.score-sub{font-size:11px;color:#aaa;margin-top:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px}
.field{padding:3px 0}
.fl{font-size:11px;color:#bbb;margin-bottom:1px;display:flex;align-items:center;gap:3px}
.fl-ico{width:13px;height:13px;border:1px solid #e0ddd6;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:7px;color:#ccc}
.fv{font-size:13px;color:#1a1a1a}
.fv a{color:#185fa5;text-decoration:none}.fv a:hover{text-decoration:underline}
.fv-sub{font-size:11px;color:#aaa;margin-top:1px}
.alert-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:4px}
.apill{font-size:11px;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;background:#faeeda;color:#633806;border:0.5px solid #fac775}

/* TWO COL / THREE COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}

/* BARS */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-row:hover .bar-fill{filter:brightness(0.9)}
.bar-lbl{font-size:12px;color:#666;width:68px;flex-shrink:0}
.bar-lbl-wide{font-size:12px;color:#444;width:150px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.bar-track{flex:1;height:8px;background:#f1efe8;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:filter .1s}
.bar-pct{font-size:12px;font-weight:500;width:32px;text-align:right;color:#1a1a1a}
.bar-val{font-size:12px;font-weight:500;width:28px;text-align:right;color:#1a1a1a;flex-shrink:0}

/* SECTOR ICONS */
.sect-ico{width:16px;height:16px;flex-shrink:0;color:#8a8680}
.sect-ico svg{width:100%;height:100%;display:block}

/* PMS BADGE */
.pms-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:9px;font-weight:700;border:0.5px solid;flex-shrink:0;margin-right:5px;vertical-align:middle}

/* FEATURE PILLS */
.feat-lbl{font-size:11px;color:#bbb;margin:9px 0 5px}
.feat-pills{display:flex;flex-wrap:wrap;gap:4px}
.fp{font-size:11px;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;border:0.5px solid}
.fp-on{background:#eaf3de;color:#27500a;border-color:#c0dd97}
.fp-off{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
.fp-ico{width:11px;height:11px;border:1px solid currentColor;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:7px;opacity:.7;flex-shrink:0}

/* UPSELL */
.upsell-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid #f0ede8}
.upsell-row:last-child{border-bottom:none}
.ups-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ups-info{flex:1}
.ups-name{font-size:13px;font-weight:500}
.ups-price{font-size:10px;padding:1px 7px;border-radius:20px;display:inline-block;margin-top:1px}

/* JOURNAL */
.log-item{display:flex;gap:10px;padding:9px 0;border-bottom:0.5px solid #f0ede8}
.log-item:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ld-g{background:#639922}.ld-a{background:#ef9f27}.ld-r{background:#e24b4a}.ld-b{background:#185fa5}
.log-body{flex:1}
.log-text{font-size:13px;line-height:1.45;color:#1a1a1a}
.log-meta{font-size:11px;color:#aaa;margin-top:2px}
.log-acts{display:flex;gap:6px;margin-top:6px}
.log-empty{font-size:12px;color:#bbb;padding:8px 0;font-style:italic}

/* ADD ACTIVITY FORM */
.act-form{background:#f9f8f6;border-radius:10px;padding:12px;margin-top:4px;border:0.5px solid #e2dfd9}
.act-form textarea{width:100%;font-family:inherit;font-size:13px;border:0.5px solid #d0cdc6;border-radius:8px;padding:8px 10px;background:#fff;color:#1a1a1a;resize:vertical;min-height:64px;outline:none;line-height:1.5}
.act-form textarea:focus{border-color:#8a2b2b;box-shadow:0 0 0 2px rgba(138,43,43,.08)}
.act-form-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.act-type-sel{font-family:inherit;font-size:12px;padding:0 8px;height:30px;border:0.5px solid #d0cdc6;border-radius:7px;background:#fff;color:#444;outline:none;cursor:pointer}
.act-date-inp{font-family:inherit;font-size:12px;padding:0 8px;height:30px;border:0.5px solid #d0cdc6;border-radius:7px;background:#fff;color:#444;outline:none;width:130px}

/* ── LIST VIEW ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:10px;padding:.65rem .9rem;border:0.5px solid #e2dfd9}
.stat-lbl{font-size:11px;color:#aaa;margin-bottom:2px}
.stat-val{font-size:20px;font-weight:500}
.list-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.srch-wrap{position:relative}
.srch-wrap input{font-family:inherit;font-size:12px;padding:0 10px 0 30px;height:32px;border:0.5px solid #d0cdc6;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;width:200px}
.srch-wrap input:focus{border-color:#8a2b2b;box-shadow:0 0 0 2px rgba(138,43,43,.08)}
.srch-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:#ccc;pointer-events:none}
.lsel{font-family:inherit;font-size:12px;padding:0 8px;height:32px;border:0.5px solid #d0cdc6;border-radius:8px;background:#fff;color:#444;outline:none;cursor:pointer}
.count-lbl{font-size:12px;color:#aaa;margin-left:auto}

/* TABLE */
.tbl-wrap{background:#fff;border:0.5px solid #e2dfd9;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:#f9f8f6;font-size:11px;font-weight:500;color:#aaa;padding:8px 10px;text-align:left;border-bottom:0.5px solid #e2dfd9;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:#1a1a1a}
td{padding:7px 10px;border-bottom:0.5px solid #f0ede8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9f7}
tr.erow td{background:#f5f3ff}
.nom-cell{font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nom-cell:hover{color:#8a2b2b}
.sub-cell{font-size:11px;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpill{font-size:10px;padding:2px 8px;border-radius:20px}
.ta-btn{font-size:12px;width:27px;height:26px;border-radius:6px;border:0.5px solid #d0cdc6;background:transparent;color:#777;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .1s}
.ta-btn:hover{background:#f0ede8;color:#1a1a1a}
.ta-save{background:#eeedfe;border-color:#afa9ec;color:#3c3489}
.ei{font-size:12px;padding:0 5px;height:26px;border:0.5px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;width:100%;font-family:inherit;outline:none}
.esel{font-size:11px;padding:0 4px;height:26px;border:0.5px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;width:100%;font-family:inherit;outline:none}
.sarr{font-size:9px;opacity:.4;margin-left:1px}

/* GRID VIEW */
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gc{background:#fff;border:0.5px solid #e2dfd9;border-radius:12px;padding:14px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.gc:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:#bbb}
.gc-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.gc-info{flex:1;min-width:0}
.gc-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-sub{font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.gc-fields{display:flex;flex-direction:column;gap:4px}
.gc-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.gc-rl{color:#aaa}.gc-rv{font-weight:500}
.gc-divider{border:none;border-top:0.5px solid #eeece8;margin:8px 0}
.gc-feats{display:flex;gap:3px;flex-wrap:wrap}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px;overflow-y:auto}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:1.4rem}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-head input.name-inp{font-size:16px;font-weight:500;border:none;padding:0;flex:1;background:transparent;outline:none;color:#1a1a1a;font-family:inherit}
.modal-head input.name-inp:focus{border-bottom:1px solid #d0cdc6}
.modal-section{font-size:11px;font-weight:500;color:#aaa;letter-spacing:.05em;text-transform:uppercase;margin:14px 0 8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.ff label{font-size:11px;color:#888;display:block;margin-bottom:2px}
.ff input,.ff select,.ff textarea{font-family:inherit;font-size:12px;width:100%;padding:0 8px;height:32px;border:0.5px solid #d0cdc6;border-radius:7px;background:#fff;color:#1a1a1a;outline:none}
.ff input:focus,.ff select:focus{border-color:#8a2b2b;box-shadow:0 0 0 2px rgba(138,43,43,.08)}
.ff textarea{height:60px;padding:6px 8px;resize:vertical}
.feat-checks{display:flex;flex-wrap:wrap;gap:10px 16px}
.feat-checks label{font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;color:#444}
input[type=checkbox]{accent-color:#8a2b2b;cursor:pointer;width:14px;height:14px}
.modal-footer{display:flex;gap:8px;margin-top:16px;align-items:center;padding-top:12px;border-top:0.5px solid #eeece8}

/* ── CANAUX / TEMPLATES ── */
.test-inp{font-family:inherit;font-size:12px;padding:0 8px;height:31px;border:0.5px solid #d0cdc6;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;width:170px}
.chan-tabs{display:flex;gap:6px;margin-bottom:10px}
.chan-tab{font-family:inherit;font-size:11px;padding:4px 12px;border-radius:20px;border:0.5px solid #d0cdc6;background:#fff;color:#666;cursor:pointer}
.chan-tab.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:#1a1a1a;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:300;display:none;animation:slideup .2s ease}
@keyframes slideup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── LOGIN GATE ── */
#loginGate{position:fixed;inset:0;background:#f5f4f0;z-index:500;display:flex;align-items:center;justify-content:center}
.lg-box{background:#fff;border:0.5px solid #e2dfd9;border-radius:14px;padding:2rem;width:100%;max-width:340px}
.lg-title{font-size:16px;font-weight:600;margin-bottom:4px}
.lg-sub{font-size:12px;color:#999;margin-bottom:18px}
.lg-box .ff{margin-bottom:10px}
.lg-err{font-size:12px;color:#a32d2d;margin-top:6px;display:none}
.version-badge{margin-top:auto;padding:10px 16px;font-size:10px;color:#c0bdb8;font-family:monospace}

/* ── RESPONSIVE ── */
@media (max-width: 900px){
  .menu-toggle{display:inline-flex;align-items:center}
  .sidebar{position:absolute;top:0;left:0;bottom:0;z-index:120;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 16px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:block;position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .sidebar-overlay.show{opacity:1;pointer-events:auto}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .three-col{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .grid-view{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .form-grid{grid-template-columns:1fr}
}

@media (max-width: 560px){
  body{font-size:12.5px}
  .topbar{padding:0 10px;gap:7px}
  .logo{font-size:13px}
  .breadcrumb{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tb-right{gap:5px}
  .main{padding:10px}
  .stats-row{grid-template-columns:1fr 1fr;gap:6px}
  .list-toolbar{flex-direction:column;align-items:stretch}
  .list-toolbar>*{width:100%!important;max-width:none!important}
  .count-lbl{margin-left:0;text-align:right}
  .modal-bg{padding:10px}
  .modal-box{max-width:100%;padding:1rem}
  .hero-row{flex-wrap:wrap;gap:10px}
  .score-box{margin-left:0;text-align:left;width:100%;display:flex;align-items:center;gap:8px}
  .score-num{font-size:20px}
  .fgrid{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
  table{min-width:680px}
  .two-col,.three-col{gap:8px}
}
</style>
</head>
<body>

<div id="loginGate">
  <div class="lg-box">
    <div class="lg-title">Sesame <em style="color:#8a2b2b;font-style:normal">CRM</em></div>
    <div class="lg-sub">Réservé aux comptes Sesame Technology.</div>
    <div class="ff"><label>Email</label><input type="email" id="lg-email" placeholder="vous@sesame.technology"></div>
    <div class="ff"><label>Mot de passe</label><input type="password" id="lg-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')crmLogin()"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="crmLogin()">Se connecter</button>
    <div class="lg-err" id="lg-err"></div>
  </div>
</div>

<div class="topbar" style="display:none" id="topbar">

<script>
// ════════════════════════════════════════
// AUTH — réutilise la même session que admin.html (compte "sesame" requis)
// ════════════════════════════════════════
var API_BASE = '';
var ADMIN_TOKEN = sessionStorage.getItem('SESAME_ADMIN_TOKEN') || null;
var ADMIN_ROLE  = sessionStorage.getItem('SESAME_ADMIN_ROLE') || null;

function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, {Authorization:'Bearer '+ADMIN_TOKEN});
  return fetch(API_BASE+url, opts);
}

async function crmLogin(){
  var email = (document.getElementById('lg-email').value||'').trim();
  var password = document.getElementById('lg-password').value||'';
  var errEl = document.getElementById('lg-err');
  errEl.style.display='none';
  if(!email||!password){ errEl.textContent='Email et mot de passe requis'; errEl.style.display='block'; return; }
  try{
    var r = await fetch(API_BASE+'/wa/login/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email,password:password})});
    var data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Identifiants incorrects'; errEl.style.display='block'; return; }
    if(data.admin.role !== 'sesame'){ errEl.textContent = 'Ce module est réservé aux comptes Sesame Technology.'; errEl.style.display='block'; return; }
    ADMIN_TOKEN = data.token; ADMIN_ROLE = data.admin.role;
    sessionStorage.setItem('SESAME_ADMIN_TOKEN', ADMIN_TOKEN);
    sessionStorage.setItem('SESAME_ADMIN_ROLE', ADMIN_ROLE);
    enterApp();
  }catch(e){ errEl.textContent = 'Erreur de connexion au serveur'; errEl.style.display='block'; }
}

function enterApp(){
  document.getElementById('loginGate').style.display='none';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('layout').style.display='flex';
  init();
}

// ── RESPONSIVE — tiroir latéral sur écran étroit ──
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

document.addEventListener('DOMContentLoaded', function(){
  if(ADMIN_TOKEN && ADMIN_ROLE==='sesame') enterApp();
  // sinon : le login gate reste affiché
});

// ════════════════════════════════════════
// DATA
// ════════════════════════════════════════
const DANGERS = ['Bon client','Modéré','Élevé !!'];
const TYPES = ['Prospect','Client'];
const SECTEURS = ['Hôtellerie','Location appartement','Appart Hotel','Location AirBnB','Bureaux','Sport','Garde meuble','Love hôtel','Location bureau','Agence gestion patrimoine'];
const ACT_TYPES = ['Appel','Email','Visite','Proposition','Relance','Note interne','Autre'];
const DOT_MAP = {Appel:'g',Email:'b',Visite:'g',Proposition:'b',Relance:'a','Note interne':'b',Autre:'b'};

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let clients=[], view='list', vmode='table', curId=null, sortC='nom', sortD=1;
let srch='', fDanger='', fSecteur='', fContrat='', fType='', editingId=null, toastT=null;

async function loadData(){
  var r = await apiFetch('/wa/crmProspect/list');
  if(!r.ok) throw new Error('http '+r.status);
  return await r.json();
}
async function init(){
  try{ clients = await loadData(); }
  catch(e){ flash('Erreur de chargement — rechargez la page'); clients = []; }
  updateBadges();showList();
  loadVersionBadge();
}

async function loadVersionBadge(){
  const el = document.getElementById('version-badge');
  if(!el) return;
  try{
    const r = await fetch('/version');
    const v = await r.json();
    const d = new Date(v.buildTime);
    const dateStr = isNaN(d) ? v.buildTime : d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    el.textContent = 'v '+v.sha+' — '+dateStr;
    el.title = 'Build du '+v.buildTime;
  }catch(e){ el.textContent=''; }
}
function ini(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?';}
function today(){const d=new Date();return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}

// ── NAV ──
function setNav(id){['n-list','n-fiche','n-activite','n-contrats','n-canaux','n-auto'].forEach(n=>document.getElementById(n).classList.remove('active'));document.getElementById(id).classList.add('active');}
function setVMode(m){vmode=m;document.getElementById('vt-tbl').classList.toggle('active',m==='table');document.getElementById('vt-grd').classList.toggle('active',m==='grid');if(view==='list')renderList();}
function goFiche(){if(curId)showFiche(curId);}
function bc(parts){document.getElementById('bc').innerHTML=parts.map((p,i)=>i<parts.length-1?`<span class="bc-link" onclick="${p.fn}">${p.label}</span><span class="bc-sep"> / </span>`:`<span class="bc-cur">${p.label}</span>`).join('');}
function tba(html){document.getElementById('tb-actions').innerHTML=html;}

// ── QUICK FILTER ──
function qf(f,v){srch='';fDanger='';fSecteur='';fContrat='';fType='';if(f==='danger')fDanger=v;else if(f==='contrat')fContrat=v;showList();}

// ════════════════════════════════════════
// LIST VIEW
// ════════════════════════════════════════
function showList(){view='list';editingId=null;setNav('n-list');bc([{label:'Clients'}]);tba(`<button class="btn btn-green" onclick="exportCSV()">↓ CSV</button><button class="btn btn-primary" onclick="openNewModal()">+ Nouveau client</button>`);renderList();}

function filtered(){
  return clients.filter(c=>{
    if(srch){const s=srch.toLowerCase();if(![c.nom,c.ville||'',c.groupe||'',c.referent||''].some(x=>x.toLowerCase().includes(s)))return false;}
    if(fDanger&&c.danger!==fDanger)return false;
    if(fSecteur&&c.secteur!==fSecteur)return false;
    if(fContrat&&c.contrat!==fContrat)return false;
    if(fType&&c.type!==fType)return false;
    return true;
  }).sort((a,b)=>{let av=a[sortC]||'',bv=b[sortC]||'';if(typeof av==='string')av=av.toLowerCase();if(typeof bv==='string')bv=bv.toLowerCase();return av<bv?-sortD:av>bv?sortD:0;});
}

function dBadge(d){if(d==='Élevé !!')return'<span class="badge bd">⚠ Élevé</span>';if(d==='Bon client')return'<span class="badge bg">✓ Bon client</span>';if(d==='Modéré')return'<span class="badge bw">Modéré</span>';return'<span class="badge bn">—</span>';}
function pBadge(p){const c=['bn','bi','bw','bg'];return p?`<span class="badge ${c[p]||'bn'}">${p}/3</span>`:'<span class="badge bn">—</span>';}
function cPill(v){const m={oui:'bg',non:'bd','en cours':'bw'};return`<span class="tpill ${m[v]||'bn'}">${v||'—'}</span>`;}
function typeBadge(t){return t==='Prospect'?'<span class="tpill bi">Prospect</span>':'<span class="tpill bg">Client</span>';}
function chk(v){return v?'<span class="tpill bg">oui</span>':'<span class="tpill" style="background:#f1efe8;color:#bbb">—</span>';}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}

// ════════════════════════════════════════
// ICÔNES SECTEUR — pictogrammes simples assortis à chaque secteur d'activité
// ════════════════════════════════════════
const BUILDING_ICO = '<rect x="4" y="3" width="16" height="18" rx="1"/><rect x="9.5" y="15" width="5" height="6"/><line x1="7.5" y1="7.5" x2="7.5" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="7.5"/><line x1="16.5" y1="7.5" x2="16.5" y2="7.5"/><line x1="7.5" y1="11.5" x2="7.5" y2="11.5"/><line x1="16.5" y1="11.5" x2="16.5" y2="11.5"/>';
const APARTMENT_ICO = '<rect x="4" y="3" width="16" height="18" rx="1"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="7.5" y1="7.5" x2="7.5" y2="7.5"/><line x1="12" y1="7.5" x2="12" y2="7.5"/><line x1="16.5" y1="7.5" x2="16.5" y2="7.5"/><line x1="7.5" y1="16.5" x2="7.5" y2="16.5"/><line x1="12" y1="16.5" x2="12" y2="16.5"/><line x1="16.5" y1="16.5" x2="16.5" y2="16.5"/>';
const BRIEFCASE_ICO = '<rect x="3" y="8" width="18" height="12" rx="1.5"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="13" x2="21" y2="13"/>';
const SECTOR_ICONS = {
  'Hôtellerie': BUILDING_ICO,
  'Appart Hotel': APARTMENT_ICO,
  'Location appartement': APARTMENT_ICO,
  'Location AirBnB': '<polygon points="12,3 21,10 21,21 3,21 3,10"/><rect x="9.5" y="15" width="5" height="6"/>',
  'Bureaux': BRIEFCASE_ICO,
  'Location bureau': BRIEFCASE_ICO,
  'Sport': '<line x1="6" y1="12" x2="18" y2="12"/><rect x="3" y="9" width="3" height="6" rx="1"/><rect x="18" y="9" width="3" height="6" rx="1"/>',
  'Garde meuble': '<polygon points="12,3 21,7.5 21,16.5 12,21 3,16.5 3,7.5"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="7.5" x2="12" y2="12"/><line x1="21" y1="7.5" x2="12" y2="12"/>',
  'Love hôtel': '<circle cx="8.5" cy="9" r="4"/><circle cx="15.5" cy="9" r="4"/><path d="M4.5 11.5 L12 20 L19.5 11.5 Z"/>',
  'Agence gestion patrimoine': '<line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="14" width="3" height="6"/><rect x="11" y="10" width="3" height="10"/><rect x="16" y="6" width="3" height="14"/>',
};
const DEFAULT_SECTOR_ICO = '<circle cx="12" cy="12" r="8"/>';
function sectorIcon(secteur){
  const path = SECTOR_ICONS[secteur] || DEFAULT_SECTOR_ICO;
  return '<span class="sect-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg></span>';
}

// ════════════════════════════════════════
// BADGE PMS — identifiant visuel coloré déterministe (pas de logo tiers
// hébergé, pour ne reproduire aucune marque sans autorisation)
// ════════════════════════════════════════
const PMS_BADGE_COLORS = ['#8a2b2b','#185fa5','#27500a','#854f0b','#3c3489','#0c447c','#a3541f'];
function pmsColor(name){
  let hash=0; for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return PMS_BADGE_COLORS[Math.abs(hash) % PMS_BADGE_COLORS.length];
}
function pmsBadge(name){
  if(!name) return '—';
  const color = pmsColor(name);
  const initials = name.replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2) || '?';
  return '<span class="pms-badge" style="background:'+color+'1a;color:'+color+';border-color:'+color+'55">'+initials+'</span>'+esc(name);
}

// ════════════════════════════════════════
// GRAPHIQUES — répartition par secteur & usage des modules Sesame
// (calculés en direct depuis les fiches réelles, palette validée
// dataviz : bleu #2a78d6 pour le secteur, orange #eb6834 pour les modules)
// ════════════════════════════════════════
function renderInsights(){
  if(!clients.length) return '';

  // ── Répartition par secteur ──
  const bySecteur={};
  clients.forEach(c=>{ const s=c.secteur||'Non renseigné'; bySecteur[s]=(bySecteur[s]||0)+1; });
  const secteurRows=Object.entries(bySecteur).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxSecteur=Math.max(...secteurRows.map(r=>r[1]),1);
  const secteurHtml=secteurRows.map(([s,n])=>
    '<div class="bar-row" title="'+esc(s)+' : '+n+'">'
    +'<span class="bar-lbl-wide">'+sectorIcon(s)+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s)+'</span></span>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+(n/maxSecteur*100)+'%;background:#2a78d6"></div></div>'
    +'<span class="bar-val">'+n+'</span>'
    +'</div>'
  ).join('');

  // ── Usage des modules Sesame ──
  const MODULE_FEATURES=[['webApp','WebApp'],['mobileV2','Mobile V2'],['checkin','Check-in mobile'],['livret','Livret digital'],['gestionDemande','Gestion demande'],['offline','Offline']];
  const total=clients.length;
  const moduleHtml=MODULE_FEATURES.map(([k,lbl])=>{
    const n=clients.filter(c=>c[k]).length;
    const pct=total?Math.round(n/total*100):0;
    return '<div class="bar-row" title="'+lbl+' : '+n+'/'+total+'">'
      +'<span class="bar-lbl-wide" style="width:130px">'+esc(lbl)+'</span>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:#eb6834"></div></div>'
      +'<span class="bar-pct">'+pct+'%</span>'
      +'</div>';
  }).join('');

  // ── Taux d'usage cumulé des accès par type (NFC / QR / Mobile) — clients uniquement,
  // les prospects n'ont pas encore d'usage réel et fausseraient la moyenne à la baisse ──
  const ACCESS_TYPES=[['nfc','NFC'],['qr','QR Code'],['mobile','Mobile']];
  const clientsOnly=clients.filter(c=>c.type==='Client');
  const nClients=clientsOnly.length;
  const accessHtml=ACCESS_TYPES.map(([k,lbl])=>{
    const avg=nClients?Math.round(clientsOnly.reduce((s,c)=>s+(c[k]||0),0)/nClients):0;
    return '<div class="bar-row" title="'+lbl+' : moyenne '+avg+'% sur '+nClients+' clients">'
      +'<span class="bar-lbl-wide" style="width:80px">'+esc(lbl)+'</span>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+avg+'%;background:#1baf7a"></div></div>'
      +'<span class="bar-pct">'+avg+'%</span>'
      +'</div>';
  }).join('');

  return '<div class="three-col">'
    + '<div class="card"><div class="card-head"><div class="ch-ico">◻</div><span class="ch-title">Répartition par secteur</span></div>'+secteurHtml+'</div>'
    + '<div class="card"><div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Usage des modules Sesame</span><span style="font-size:11px;color:#aaa;margin-left:8px">'+total+' fiches</span></div>'+moduleHtml+'</div>'
    + '<div class="card"><div class="card-head"><div class="ch-ico">◉</div><span class="ch-title">Taux d\'usage des accès</span><span style="font-size:11px;color:#aaa;margin-left:8px">'+nClients+' clients</span></div>'+accessHtml
      +(nClients?'':'<div style="font-size:12px;color:#bbb;padding:4px 0;font-style:italic">Aucune fiche de type Client</div>')+'</div>'
    + '</div>';
}

function renderList(){
  const data=filtered();
  const sectAll=[...new Set([...SECTEURS,...clients.map(c=>c.secteur)].filter(Boolean))].sort();
  const stats=`<div class="stats-row">
    <div class="stat-card"><div class="stat-lbl">Clients</div><div class="stat-val">${clients.length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Risque élevé</div><div class="stat-val" style="color:#a32d2d">${clients.filter(c=>c.danger==='Élevé !!').length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Sans contrat</div><div class="stat-val" style="color:#854f0b">${clients.filter(c=>c.contrat==='non').length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Activités totales</div><div class="stat-val" style="color:#3c3489">${clients.reduce((s,c)=>(s+(c.journal||[]).length),0)}</div></div>
  </div>`;
  const toolbar=`<div class="list-toolbar">
    <div class="srch-wrap"><span class="srch-ico">⌕</span><input type="text" placeholder="Client, ville, groupe…" value="${esc(srch)}" oninput="srch=this.value;renderList()"></div>
    <select class="lsel" onchange="fDanger=this.value;renderList()"><option value="">Tous risques</option>${DANGERS.map(d=>`<option value="${d}" ${fDanger===d?'selected':''}>${d}</option>`).join('')}</select>
    <select class="lsel" onchange="fSecteur=this.value;renderList()"><option value="">Tous secteurs</option>${sectAll.map(s=>`<option value="${s}" ${fSecteur===s?'selected':''}>${s}</option>`).join('')}</select>
    <select class="lsel" onchange="fContrat=this.value;renderList()"><option value="">Tous contrats</option><option value="oui" ${fContrat==='oui'?'selected':''}>oui</option><option value="non" ${fContrat==='non'?'selected':''}>non</option><option value="en cours" ${fContrat==='en cours'?'selected':''}>en cours</option></select>
    <select class="lsel" onchange="fType=this.value;renderList()"><option value="">Tous types</option>${TYPES.map(t=>`<option value="${t}" ${fType===t?'selected':''}>${t}</option>`).join('')}</select>
    <span class="count-lbl">${data.length} résultat${data.length>1?'s':''}</span>
  </div>`;

  let content='';
  if(vmode==='grid'){
    content=`<div class="grid-view">${data.map(c=>{
      const dc=c.danger==='Élevé !!'?'bd':c.danger==='Bon client'?'bg':'bw';
      const feats=[c.webApp&&'WebApp',c.mobileV2&&'V2',c.checkin&&'Check-in',c.livret&&'Livret',c.gestionDemande&&'Gestion'].filter(Boolean);
      const lastAct=(c.journal||[]).slice(-1)[0];
      return`<div class="gc" onclick="showFiche('${c.id}')">
        <div class="gc-head">
          <div class="avatar" style="width:36px;height:36px;font-size:12px">${ini(c.nom)}</div>
          <div class="gc-info"><div class="gc-name">${c.nom}</div><div class="gc-sub">${c.groupe||c.secteur||'—'}</div></div>
        </div>
        <div class="gc-tags">${typeBadge(c.type)}<span class="badge ${dc}" style="font-size:10px">${c.danger||'—'}</span>${c.ville?`<span class="tag t-blue" style="font-size:10px">${c.ville}</span>`:''}</div>
        <hr class="gc-divider">
        <div class="gc-fields">
          <div class="gc-row"><span class="gc-rl">Contrat</span>${cPill(c.contrat)}</div>
          <div class="gc-row"><span class="gc-rl">Modules</span><span class="gc-rv">${c.modules||'—'}</span></div>
          <div class="gc-row"><span class="gc-rl">PMS</span><span class="gc-rv">${c.pms?pmsBadge(c.pms):'—'}</span></div>
          ${lastAct?`<div class="gc-row" style="margin-top:2px"><span class="gc-rl">Dernière activité</span><span class="gc-rv" style="color:#aaa;font-size:10px;font-weight:400">${lastAct.type}</span></div>`:''}
        </div>
        ${feats.length?`<hr class="gc-divider"><div class="gc-feats">${feats.map(f=>`<span class="tpill bg" style="font-size:10px">${f}</span>`).join('')}</div>`:''}
      </div>`;
    }).join('')}</div>`;
  } else {
    const th=(col,lbl,w)=>`<th style="width:${w}" onclick="srt('${col}')">${lbl}<span class="sarr">${sortC===col?(sortD===1?'↑':'↓'):'·'}</span></th>`;
    const rows=data.map(c=>{
      if(editingId===c.id)return`<tr class="erow">
        <td><div class="avatar" style="width:26px;height:26px;font-size:10px">${ini(c.nom)}</div></td>
        <td><div class="nom-cell">${c.nom}</div><div class="sub-cell">${c.groupe||'—'}</div></td>

async function saveRow(id){

function showFiche(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  curId=id;view='fiche';setNav('n-fiche');
  bc([{label:'Clients',fn:'showList()'},{label:c.nom}]);
  tba(`<button class="btn btn-ghost" onclick="openModal('${id}')">✎ Modifier</button><button class="btn btn-ghost" onclick="openSendEmailModal('${id}')">✉ Email</button><button class="btn btn-primary" onclick="addActForm('${id}')">+ Activité</button><button class="btn btn-ghost" style="color:#a32d2d" onclick="deleteClient('${id}')">🗑 Supprimer</button>`);
  renderFiche(c);
}

function riskScore(c){let s=0;if(c.danger==='Élevé !!')s+=5;else if(c.danger==='Modéré')s+=3;if(c.contrat==='non')s+=2;if(!c.webApp&&!c.mobileV2)s+=1;if(!c.nfc&&!c.qr&&!c.mobile)s+=1;return Math.min(s,10);}
function scoreColor(s){return s<=3?'#27500a':s<=6?'#854f0b':'#a32d2d';}
function scoreLbl(s){return s<=3?'Faible':s<=6?'Modéré':'Élevé';}

function addActForm(id){
  const slot=document.getElementById('act-form-slot');
  if(!slot)return;
  const todayStr=new Date().toISOString().split('T')[0];
  slot.innerHTML=`<div class="act-form">
    <textarea id="act-txt" placeholder="Décrivez l'activité — appel, email, visite, relance…" rows="3"></textarea>
    <div class="act-form-row">
      <select class="act-type-sel" id="act-type">
        ${ACT_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
      </select>
      <input type="date" class="act-date-inp" id="act-date" value="${todayStr}">
      <input class="ei" id="act-author" placeholder="Auteur (optionnel)" style="width:140px;height:30px">
      <button class="btn btn-primary btn-sm" onclick="saveActivity('${id}')">Enregistrer</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelActForm()">Annuler</button>
    </div>
  </div>`;
  document.getElementById('act-txt').focus();
}

function cancelActForm(){const s=document.getElementById('act-form-slot');if(s)s.innerHTML='';}

async function saveActivity(id){
  const txt=(document.getElementById('act-txt')||{}).value||'';
  if(!txt.trim()){flash('Veuillez saisir une description');return;}
  const type=(document.getElementById('act-type')||{}).value||'Note interne';
  const dateV=(document.getElementById('act-date')||{}).value||'';
  const author=(document.getElementById('act-author')||{}).value||'';
  const c=clients.find(c=>c.id===id);
  if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/create', {method:'POST', body:JSON.stringify({
      prospectId:id, type:type, text:txt.trim(), authorName:author, activityDate: dateV || undefined
    })});
    if(!r.ok) throw new Error('http '+r.status);
    var entry = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(!c.journal)c.journal=[];
  c.journal.push(entry);
  flash('Activité enregistrée');
  showFiche(id);
}

async function markDone(id,jid){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/markDone', {method:'POST', body:JSON.stringify({id:jid})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur'); return; }
  const j=c.journal.find(j=>j.id===jid);if(j)j.done=true;
  flash('Marqué comme fait');
  showFiche(id);
}

async function deleteAct(id,jid){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/delete', {method:'POST', body:JSON.stringify({id:jid})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur'); return; }
  c.journal=c.journal.filter(j=>j.id!==jid);
  flash('Activité supprimée');
  showFiche(id);
}

async function saveModal(id,isNew){
  const g=i=>(document.getElementById(i)||{value:''});
  const ch={
    nom:g('m-nom').value.trim(),type:g('m-type').value,groupe:g('m-groupe').value,secteur:g('m-secteur').value,
    ville:g('m-ville').value,etoiles:g('m-etoiles').value,referent:g('m-referent').value,
    email:g('m-email').value,tel:g('m-tel').value,site:g('m-site').value,
    pms:g('m-pms').value,messagerie:g('m-msg').value,danger:g('m-danger').value,
    potentiel:+g('m-pot').value,modules:+g('m-mod').value,contrat:g('m-contrat').value,
    priorite:+g('m-prio').value,appel:g('m-appel').value,
    nfc:+g('m-nfc').value,qr:+g('m-qr').value,mobile:+g('m-mob').value,
    webApp:g('m-webapp').checked,mobileV2:g('m-v2').checked,offline:g('m-offline').checked,
    checkin:g('m-checkin').checked,livret:g('m-livret').checked,gestionDemande:g('m-gd').checked,
    note:g('m-note').value
  };
  if(!ch.nom){flash('Le nom est obligatoire');return;}
  try{
    var r;
    if(isNew){
      r = await apiFetch('/wa/crmProspect/create', {method:'POST', body:JSON.stringify(ch)});
    } else {
      r = await apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify({id:id, ...ch})});
    }
    if(!r.ok) throw new Error('http '+r.status);
    var saved = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(isNew){ clients.push(saved); }
  else{ const ex=clients.find(c=>c.id===id); if(ex) Object.assign(ex, saved); }
  closeModal();updateBadges();flash('Fiche enregistrée');
  if(view==='fiche'&&curId===id)showFiche(id);else renderList();
}

async function deleteClient(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  if(!confirm('Supprimer définitivement la fiche "'+c.nom+'" ? Cette action est irréversible.'))return;
  try{
    var r = await apiFetch('/wa/crmProspect/delete', {method:'POST', body:JSON.stringify({id:id})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  clients=clients.filter(c=>c.id!==id);
  updateBadges();flash('Fiche supprimée');showList();
}

async function loadCanauxPanelData(){

      apiFetch('/wa/smtpConfig/get?scope=crm'),
      apiFetch('/wa/channelConfig/get?scope=crm&channel=sms'),
      apiFetch('/wa/channelConfig/get?scope=crm&channel=whatsapp'),

async function saveSmtpConfig(){
  const g=i=>(document.getElementById(i)||{value:''}).value;
  const body={host:g('smtp-host').trim(),port:+g('smtp-port')||587,secure:g('smtp-secure')==='1',username:g('smtp-user').trim(),password:g('smtp-pass'),fromName:g('smtp-fromname').trim(),fromEmail:g('smtp-fromemail').trim(),scope:'crm'};
  try{
    var r = await apiFetch('/wa/smtpConfig/update', {method:'POST', body:JSON.stringify(body)});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    SMTP_CFG=data;flash('Configuration SMTP enregistrée');
  }catch(e){ flash(e.message||'Erreur d\'enregistrement'); }
}

async function testSmtpConfig(){
  const to=(document.getElementById('smtp-test-to')||{value:''}).value.trim();
  if(!to){flash('Indiquez une adresse de test');return;}
  try{
    var r = await apiFetch('/wa/smtpConfig/test', {method:'POST', body:JSON.stringify({to:to, scope:'crm'})});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    flash('Email de test envoyé à '+to);
  }catch(e){ flash(e.message||'Échec de l\'envoi — vérifiez la configuration'); }
}

async function saveChannelConfig(channel){
  const p = channel==='sms'?'sms':'wa';
  const g=i=>(document.getElementById(i)||{value:''}).value;
  const body={channel:channel, accountSid:g(p+'-sid').trim(), authToken:g(p+'-token'), fromNumber:g(p+'-from').trim(), scope:'crm'};
  try{
    var r = await apiFetch('/wa/channelConfig/update', {method:'POST', body:JSON.stringify(body)});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    if(channel==='sms') SMS_CFG=data; else WA_CFG=data;
    flash('Configuration '+CHANNEL_LABEL[channel]+' enregistrée');
  }catch(e){ flash(e.message||'Erreur d\'enregistrement'); }
}

async function testChannelConfig(channel){
  const to=(document.getElementById(channel+'-test-to')||{value:''}).value.trim();
  if(!to){flash('Indiquez un destinataire de test');return;}
  try{
    var r = await apiFetch('/wa/channelConfig/test', {method:'POST', body:JSON.stringify({channel:channel, to:to, scope:'crm'})});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    flash('Message de test envoyé à '+to);
  }catch(e){ flash(e.message||'Échec de l\'envoi — vérifiez la configuration'); }
}

function openTemplateModal(id){
  const t = id ? MSG_TEMPLATES.find(t=>t.id===id) : {id:null,channel:tplChannelTab,key:'',name:'',subject:'',bodyHtml:''};
  if(!t)return;
  document.getElementById('modal-ct').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head"><div style="font-size:16px;font-weight:500">${t.id?'Modifier le modèle':'Nouveau modèle'}</div><button class="btn btn-ghost btn-icon" onclick="closeModal()" style="margin-left:auto">✕</button></div>
      <div class="form-grid">
        <div class="ff"><label>Canal</label><select id="tpl-channel" ${t.id?'disabled':''} onchange="renderTplSubjectVisibility()">${['email','sms','whatsapp'].map(c=>`<option value="${c}" ${t.channel===c?'selected':''}>${CHANNEL_LABEL[c]}</option>`).join('')}</select></div>
        <div class="ff"><label>Clé (identifiant technique)</label><input id="tpl-key" value="${esc(t.key)}" placeholder="ex. prospect-relance" ${t.id?'disabled':''}></div>

      <div class="ff" style="margin-top:8px"><label>Corps (email : HTML ; SMS/WhatsApp : texte — variables : {{nom}} {{secteur}} {{referent}} {{ville}})</label><textarea id="tpl-body" style="height:160px">${t.bodyHtml||''}</textarea></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveTemplate(${t.id?`'${t.id}'`:'null'})">Enregistrer</button>

function renderTplSubjectVisibility(){
  const sel=document.getElementById('tpl-channel');
  const wrap=document.getElementById('tpl-subject-wrap');
  if(sel&&wrap) wrap.style.display = sel.value==='email' ? '' : 'none';
}

async function saveTemplate(id){
  const g=i=>(document.getElementById(i)||{value:''}).value;
  const body={channel:g('tpl-channel'),key:g('tpl-key').trim().toLowerCase(),name:g('tpl-name').trim(),subject:g('tpl-subject').trim(),bodyHtml:g('tpl-body'),scope:'crm'};
  if(!body.key||!body.name||!body.bodyHtml||(body.channel==='email'&&!body.subject)){flash('Tous les champs sont requis');return;}
  try{
    var r = await apiFetch('/wa/messageTemplate/upsert', {method:'POST', body:JSON.stringify(body)});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    const i=MSG_TEMPLATES.findIndex(t=>t.id===data.id);
    if(i>-1) MSG_TEMPLATES[i]=data; else MSG_TEMPLATES.push(data);
    tplChannelTab=data.channel;
  }catch(e){ flash(e.message||'Erreur d\'enregistrement'); return; }
  closeModal();flash('Modèle enregistré');renderCanauxPanel();
}

async function deleteTemplate(id){
  if(!confirm('Supprimer ce modèle ?'))return;
  try{
    var r = await apiFetch('/wa/messageTemplate/delete', {method:'POST', body:JSON.stringify({id:id, scope:'crm'})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  MSG_TEMPLATES=MSG_TEMPLATES.filter(t=>t.id!==id);
  flash('Modèle supprimé');renderCanauxPanel();
}

async function ensureTemplatesLoaded(){
  if(MSG_TEMPLATES_LOADED)return;
  try{
    var r = await apiFetch('/wa/messageTemplate/list?scope=crm');
    MSG_TEMPLATES = r.ok ? await r.json() : [];
  }catch(e){ MSG_TEMPLATES=[]; }
  MSG_TEMPLATES_LOADED=true;
}

async function openSendEmailModal(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  await ensureTemplatesLoaded();
  const available=['email','sms','whatsapp'].filter(ch=>MSG_TEMPLATES.some(t=>t.channel===ch));
  if(!available.length){flash('Aucun modèle disponible — créez-en un depuis "Canaux"');return;}
  const chan=available.includes('email')?'email':available[0];
  document.getElementById('modal-ct').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal-box" style="max-width:480px">
      <div class="modal-head"><div style="font-size:16px;font-weight:500">Envoyer un message à ${esc(c.nom)}</div><button class="btn btn-ghost btn-icon" onclick="closeModal()" style="margin-left:auto">✕</button></div>
      <div class="ff"><label>Canal</label><select id="send-channel" onchange="renderSendTplOptions('${id}')">${available.map(ch=>`<option value="${ch}" ${ch===chan?'selected':''}>${CHANNEL_LABEL[ch]}</option>`).join('')}</select></div>
      <div class="ff" style="margin-top:8px"><label>Destinataire</label><input id="send-to" value="${esc(chan==='email'?(c.email||''):(c.tel||''))}"></div>
      <div class="ff" style="margin-top:8px"><label>Modèle</label><select id="send-tpl"></select></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="sendClientEmail('${id}')">Envoyer</button>
        <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      </div>
    </div>
  </div>`;
  renderSendTplOptions(id);
}

function renderSendTplOptions(id){
  const c=clients.find(c=>c.id===id);
  const chan=(document.getElementById('send-channel')||{value:'email'}).value;
  const toInp=document.getElementById('send-to');
  if(toInp&&c) toInp.value = chan==='email' ? (c.email||'') : (c.tel||'');
  const sel=document.getElementById('send-tpl');
  if(!sel)return;
  const opts=MSG_TEMPLATES.filter(t=>t.channel===chan);
  sel.innerHTML = opts.length ? opts.map(t=>`<option value="${esc(t.key)}">${esc(t.name)}</option>`).join('') : '<option value="">— aucun modèle —</option>';
}

async function sendClientEmail(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  const channel=(document.getElementById('send-channel')||{value:'email'}).value;
  const to=(document.getElementById('send-to')||{value:''}).value.trim();
  const key=(document.getElementById('send-tpl')||{value:''}).value;
  if(!to){flash('Destinataire requis');return;}
  if(!key){flash('Sélectionnez un modèle');return;}
  try{
    var r = await apiFetch('/wa/message/send', {method:'POST', body:JSON.stringify({
      scope:'crm', channel:channel, templateKey:key, to:to,
      variables:{nom:c.nom, secteur:c.secteur||'', referent:c.referent||'', ville:c.ville||''}
    })});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    var ar = await apiFetch('/wa/crmProspect/activity/create', {method:'POST', body:JSON.stringify({
      prospectId:id, type: channel==='email'?'Email':'Autre', text: CHANNEL_LABEL[channel]+' envoyé : "'+(data.subject||data.body||'')+'"', authorName:'CRM'
    })});
    if(ar.ok){ const entry=await ar.json(); if(!c.journal)c.journal=[]; c.journal.push(entry); }
  }catch(e){ flash(e.message||'Échec de l\'envoi'); return; }
  closeModal();flash(CHANNEL_LABEL[channel]+' envoyé');
  if(view==='fiche'&&curId===id) showFiche(id);
}

  {key:'crm.contract_signed', label:'Contrat signé', timingModes:['immediate']},
  {key:'crm.subscription_activated', label:'Souscription activée', timingModes:['immediate']},
  {key:'crm.subscription_cancelled', label:'Souscription annulée', timingModes:['immediate']},
  {key:'crm.subscription_trial_ending', label:"Avant la fin d'essai (souscription)", timingModes:['before']},
  {key:'crm.newsletter', label:'Newsletter récurrente', timingModes:['recurring']},
];
let AUTO_RULES=[];

function showAutomationPanel(){
  view='auto';setNav('n-auto');
  bc([{label:'Automatisations'}]);tba('');
  document.getElementById('main').innerHTML='<div class="card">Chargement…</div>';
  loadAutomationPanelData();
}

async function loadAutomationPanelData(){
  await ensureTemplatesLoaded();
  try{
    var r = await apiFetch('/wa/automationRule/list?scope=crm');
    AUTO_RULES = r.ok ? await r.json() : [];
  }catch(e){ AUTO_RULES=[]; }
  renderAutomationPanel();
}

function triggerLabel(key){ const t=TRIGGERS_CRM.find(t=>t.key===key); return t?t.label:key; }
function timingSummary(r){
  if(r.timingMode==='immediate') return 'Immédiat';
  if(r.timingMode==='before') return (r.offsetValue||0)+' '+unitLabel(r.offsetUnit)+' avant';
  if(r.timingMode==='after') return (r.offsetValue||0)+' '+unitLabel(r.offsetUnit)+' après';
  if(r.timingMode==='recurring'){
    const rec={daily:'Tous les jours',weekly:'Toutes les semaines',monthly:'Tous les mois'}[r.recurrence]||r.recurrence;
    return rec+' à '+(r.atTime||'—');
  }
  return r.timingMode;
}
function unitLabel(u){ return {minutes:'min',hours:'h',days:'j'}[u]||u||''; }

function renderAutomationPanel(){
  document.getElementById('main').innerHTML=`
  <div class="card">
    <div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Règles d'automatisation</span><button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openRuleModal(null)">+ Nouvelle règle</button></div>
    ${AUTO_RULES.length===0?'<div class="log-empty">Aucune règle. Ex : envoyer une newsletter tous les mois à 11h00, ou relancer automatiquement un nouveau prospect.</div>':AUTO_RULES.map(r=>`
      <div class="log-item">
        <div class="log-dot ${r.enabled?'ld-g':'ld-r'}"></div>
        <div class="log-body">
          <div class="log-text"><strong>${esc(r.name)}</strong> <span class="tag t-gray" style="font-size:10px;padding:1px 7px">${triggerLabel(r.trigger)}</span> <span class="tag t-blue" style="font-size:10px;padding:1px 7px">${CHANNEL_LABEL[r.channel]}</span></div>
          <div class="log-meta">${timingSummary(r)} — modèle : ${esc(r.templateKey)} — destinataire : ${r.recipientMode==='custom'?esc(r.recipientOverride):'automatique'}${r.senderName?' — expéditeur : '+esc(r.senderName):''}${r.lastRunAt?' — dernier envoi : '+new Date(r.lastRunAt).toLocaleString('fr-FR'):''}</div>
          ${r.lastError?`<div class="log-meta" style="color:#a32d2d">⚠ Problème lors du dernier déclenchement (${r.lastErrorAt?new Date(r.lastErrorAt).toLocaleString('fr-FR'):''}) : ${esc(r.lastError)}</div>`:''}
          <div class="log-acts">
            <button class="btn btn-sm btn-ghost" onclick="openRuleModal('${r.id}')">Modifier</button>
            <button class="btn btn-sm btn-ghost" onclick="testRule('${r.id}')">Tester</button>
            <button class="btn btn-sm btn-ghost" onclick="toggleRule('${r.id}')">${r.enabled?'Désactiver':'Activer'}</button>
            <button class="btn btn-sm btn-ghost" style="color:#a32d2d" onclick="deleteRule('${r.id}')">Supprimer</button>
          </div>
        </div>
      </div>`).join('')}
  </div>`;
}

function openRuleModal(id){
  const r = id ? AUTO_RULES.find(r=>r.id===id) : {id:null,name:'',trigger:TRIGGERS_CRM[0].key,enabled:true,timingMode:'immediate',offsetValue:1,offsetUnit:'days',recurrence:'monthly',atTime:'11:00',dayOfWeek:1,dayOfMonth:1,channel:'email',templateKey:'',recipientMode:'event',recipientOverride:'',senderName:'',audienceFilter:{type:'all',secteur:''}};
  if(!r)return;
  document.getElementById('modal-ct').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head"><div style="font-size:16px;font-weight:500">${r.id?'Modifier la règle':'Nouvelle règle'}</div><button class="btn btn-ghost btn-icon" onclick="closeModal()" style="margin-left:auto">✕</button></div>
      <div class="ff"><label>Nom</label><input id="rule-name" value="${esc(r.name)}" placeholder="Ex. Newsletter mensuelle"></div>
      <div class="form-grid" style="margin-top:8px">
        <div class="ff"><label>Déclencheur</label><select id="rule-trigger" onchange="renderRuleTimingFields()">${TRIGGERS_CRM.map(t=>`<option value="${t.key}" ${r.trigger===t.key?'selected':''}>${t.label}</option>`).join('')}</select></div>
        <div class="ff"><label>Canal</label><select id="rule-channel" onchange="renderRuleTplOptions();renderRuleRecipientFields();renderRuleSenderField()">${['email','sms','whatsapp'].map(c=>`<option value="${c}" ${r.channel===c?'selected':''}>${CHANNEL_LABEL[c]}</option>`).join('')}</select></div>
      </div>
      <div id="rule-timing-fields"></div>
      <div class="form-grid" style="margin-top:8px">
        <div class="ff"><label>Modèle</label><select id="rule-template"></select></div>
        <div class="ff"><label>Actif</label><select id="rule-enabled"><option value="1" ${r.enabled!==false?'selected':''}>Oui</option><option value="0" ${r.enabled===false?'selected':''}>Non</option></select></div>
      </div>
      <div class="modal-section">Destinataire</div>
      <div class="ff"><label>Qui reçoit le message</label><select id="rule-recipientMode" onchange="renderRuleRecipientFields()"><option value="event" ${r.recipientMode!=='custom'?'selected':''}>Automatique (client/prospect de l'événement)</option><option value="custom" ${r.recipientMode==='custom'?'selected':''}>Personnalisé (ex. équipe interne)</option></select></div>
      <div id="rule-recipient-fields"></div>
      <div id="rule-sender-fields"></div>
      <div id="rule-audience-fields"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveRule(${r.id?`'${r.id}'`:'null'})">Enregistrer</button>
        <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      </div>
    </div>
  </div>`;
  window._ruleEditing = r;
  renderRuleTimingFields();
  renderRuleTplOptions();
  renderRuleRecipientFields();
  renderRuleSenderField();
}

function renderRuleRecipientFields(){
  const r = window._ruleEditing || {};
  const mode = (document.getElementById('rule-recipientMode')||{value:r.recipientMode||'event'}).value;
  const chan = (document.getElementById('rule-channel')||{value:r.channel}).value;
  const el = document.getElementById('rule-recipient-fields');
  if(!el)return;
  if(mode!=='custom'){ el.innerHTML=''; return; }
  const placeholder = chan==='email' ? 'reception@monhotel.fr' : '+33612345678 (numéro mobile)';
  el.innerHTML = `<div class="ff"><label>${chan==='email'?'Adresse email':'Numéro mobile'} du destinataire</label><input id="rule-recipientOverride" value="${esc(r.recipientOverride||'')}" placeholder="${placeholder}"></div>`;
}

function renderRuleSenderField(){
  const r = window._ruleEditing || {};
  const chan = (document.getElementById('rule-channel')||{value:r.channel}).value;
  const el = document.getElementById('rule-sender-fields');
  if(!el)return;
  if(chan!=='email'){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="ff" style="margin-top:8px"><label>Nom d'expéditeur (optionnel — remplace celui du canal Email pour cette règle)</label><input id="rule-senderName" value="${esc(r.senderName||'')}" placeholder="Ex. Réception Hôtel Churchill"></div>`;
}

function renderRuleTimingFields(){
  const r = window._ruleEditing || {};
  const triggerKey = (document.getElementById('rule-trigger')||{value:r.trigger}).value;
  const trig = TRIGGERS_CRM.find(t=>t.key===triggerKey);
  const mode = trig ? trig.timingModes[0] : 'immediate';
  const el = document.getElementById('rule-timing-fields');
  if(!el)return;
  if(mode==='immediate'){
    el.innerHTML = '<input type="hidden" id="rule-timingMode" value="immediate">';
  } else if(mode==='before'||mode==='after'){
    el.innerHTML = `<input type="hidden" id="rule-timingMode" value="${mode}">
      <div class="form-grid" style="margin-top:8px">
        <div class="ff"><label>Délai</label><input type="number" id="rule-offsetValue" value="${r.offsetValue||1}" min="1"></div>
        <div class="ff"><label>Unité</label><select id="rule-offsetUnit"><option value="minutes" ${r.offsetUnit==='minutes'?'selected':''}>minutes</option><option value="hours" ${r.offsetUnit==='hours'?'selected':''}>heures</option><option value="days" ${!r.offsetUnit||r.offsetUnit==='days'?'selected':''}>jours</option></select></div>
      </div>`;
  } else if(mode==='recurring'){
    el.innerHTML = `<input type="hidden" id="rule-timingMode" value="recurring">
      <div class="form-grid" style="margin-top:8px">
        <div class="ff"><label>Récurrence</label><select id="rule-recurrence" onchange="renderRuleRecurrenceDetail()"><option value="daily" ${r.recurrence==='daily'?'selected':''}>Tous les jours</option><option value="weekly" ${r.recurrence==='weekly'?'selected':''}>Toutes les semaines</option><option value="monthly" ${!r.recurrence||r.recurrence==='monthly'?'selected':''}>Tous les mois</option></select></div>
        <div class="ff"><label>Heure</label><input type="time" id="rule-atTime" value="${r.atTime||'11:00'}"></div>
      </div>
      <div id="rule-recurrence-detail"></div>`;
    renderRuleRecurrenceDetail();
  }
  renderRuleAudienceFields(triggerKey);
}

function renderRuleRecurrenceDetail(){
  const r = window._ruleEditing || {};
  const rec = (document.getElementById('rule-recurrence')||{value:r.recurrence}).value;
  const el = document.getElementById('rule-recurrence-detail');
  if(!el)return;
  if(rec==='weekly'){
    const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    el.innerHTML = `<div class="ff" style="margin-top:8px"><label>Jour de la semaine</label><select id="rule-dayOfWeek">${days.map((d,i)=>`<option value="${i}" ${(r.dayOfWeek??1)===i?'selected':''}>${d}</option>`).join('')}</select></div>`;
  } else if(rec==='monthly'){
    el.innerHTML = `<div class="ff" style="margin-top:8px"><label>Jour du mois</label><input type="number" id="rule-dayOfMonth" min="1" max="31" value="${r.dayOfMonth||1}"></div>`;
  } else {
    el.innerHTML='';
  }
}

function renderRuleAudienceFields(triggerKey){
  const r = window._ruleEditing || {};
  const af = r.audienceFilter || {type:'all',secteur:''};
  const el = document.getElementById('rule-audience-fields');
  if(!el)return;
  if(triggerKey!=='crm.newsletter'){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="modal-section">Audience</div>
    <div class="form-grid">
      <div class="ff"><label>Type de fiche</label><select id="rule-aud-type"><option value="all" ${!af.type||af.type==='all'?'selected':''}>Toutes</option><option value="Prospect" ${af.type==='Prospect'?'selected':''}>Prospects</option><option value="Client" ${af.type==='Client'?'selected':''}>Clients</option></select></div>
      <div class="ff"><label>Secteur (optionnel)</label><input id="rule-aud-secteur" value="${esc(af.secteur||'')}" placeholder="Tous secteurs"></div>
    </div>`;
}

function renderRuleTplOptions(){
  const r = window._ruleEditing || {};
  const chan = (document.getElementById('rule-channel')||{value:r.channel}).value;
  const sel = document.getElementById('rule-template');
  if(!sel)return;
  const opts = MSG_TEMPLATES.filter(t=>t.channel===chan);
  sel.innerHTML = opts.length ? opts.map(t=>`<option value="${esc(t.key)}" ${r.templateKey===t.key?'selected':''}>${esc(t.name)}</option>`).join('') : '<option value="">— aucun modèle pour ce canal —</option>';
}

async function saveRule(id){
  const g=i=>(document.getElementById(i)||{value:''}).value;
  const triggerKey=g('rule-trigger');
  const recipientMode = g('rule-recipientMode')||'event';
  const body={
    name:g('rule-name').trim(), trigger:triggerKey, enabled:g('rule-enabled')==='1',
    timingMode:g('rule-timingMode'), channel:g('rule-channel'), templateKey:g('rule-template'),
    offsetValue: document.getElementById('rule-offsetValue') ? +g('rule-offsetValue') : null,
    offsetUnit: document.getElementById('rule-offsetUnit') ? g('rule-offsetUnit') : null,
    recurrence: document.getElementById('rule-recurrence') ? g('rule-recurrence') : null,
    atTime: document.getElementById('rule-atTime') ? g('rule-atTime') : null,
    dayOfWeek: document.getElementById('rule-dayOfWeek') ? +g('rule-dayOfWeek') : null,
    dayOfMonth: document.getElementById('rule-dayOfMonth') ? +g('rule-dayOfMonth') : null,
    recipientMode: recipientMode,
    recipientOverride: document.getElementById('rule-recipientOverride') ? g('rule-recipientOverride').trim() : null,
    senderName: document.getElementById('rule-senderName') ? g('rule-senderName').trim() : null,
    scope:'crm',
  };
  if(triggerKey==='crm.newsletter'){
    body.audienceFilter = { type: g('rule-aud-type')||'all', secteur: g('rule-aud-secteur')||'' };
  }
  if(!body.name){flash('Le nom est requis');return;}
  if(!body.templateKey){flash('Sélectionnez un modèle pour ce canal');return;}
  if(recipientMode==='custom' && !body.recipientOverride){flash('Indiquez le destinataire personnalisé');return;}
  try{
    var r;
    if(id) r = await apiFetch('/wa/automationRule/update', {method:'POST', body:JSON.stringify({id:id, ...body})});
    else r = await apiFetch('/wa/automationRule/create', {method:'POST', body:JSON.stringify(body)});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    const i=AUTO_RULES.findIndex(x=>x.id===data.id);
    if(i>-1) AUTO_RULES[i]=data; else AUTO_RULES.push(data);
  }catch(e){ flash(e.message||'Erreur d\'enregistrement'); return; }
  closeModal();flash('Règle enregistrée');renderAutomationPanel();
}

async function toggleRule(id){
  const r=AUTO_RULES.find(r=>r.id===id);if(!r)return;
  try{
    var res = await apiFetch('/wa/automationRule/update', {method:'POST', body:JSON.stringify({id:id, ...r, enabled:!r.enabled, scope:'crm'})});
    var data = await res.json();
    if(!res.ok) throw new Error(data.error||'http '+res.status);
    Object.assign(r, data);
  }catch(e){ flash('Erreur'); return; }
  flash(r.enabled?'Règle activée':'Règle désactivée');renderAutomationPanel();
}

async function deleteRule(id){
  if(!confirm('Supprimer cette règle ?'))return;
  try{
    var r = await apiFetch('/wa/automationRule/delete', {method:'POST', body:JSON.stringify({id:id, scope:'crm'})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  AUTO_RULES=AUTO_RULES.filter(r=>r.id!==id);
  flash('Règle supprimée');renderAutomationPanel();
}

async function testRule(id){
  const r=AUTO_RULES.find(r=>r.id===id);if(!r)return;
  const suggestion = r.recipientMode==='custom' ? r.recipientOverride : '';
  const label = r.channel==='email' ? 'adresse email' : 'numéro de mobile';
  const to = prompt('Envoyer un test à quel '+label+' ?', suggestion||'');
  if(!to)return;
  try{
    var res = await apiFetch('/wa/automationRule/test', {method:'POST', body:JSON.stringify({id:id, to:to, scope:'crm'})});
    var data = await res.json();
    if(!res.ok) throw new Error(data.error||'http '+res.status);
    flash('Test envoyé à '+to);
  }catch(e){ flash('Échec du test : '+(e.message||'erreur')); }
  await loadAutomationPanelData();
}

// CSV EXPORT

function exportCSV(){
  const h=['ID','Type','Nom','Groupe','Secteur','Ville','Étoiles','Risque','Potentiel','Contrat','Modules','PMS','Priorité','Appel','Référent','Email','Tél','Site','NFC%','QR%','Mobile%','WebApp','MobileV2','Offline','Check-in','Livret','Gestion','Messagerie','Note','Nb activités'];
  const rows=clients.map(c=>[c.id,c.type,c.nom,c.groupe,c.secteur,c.ville,c.etoiles,c.danger,c.potentiel,c.contrat,c.modules,c.pms,c.priorite,c.appel,c.referent,c.email,c.tel,c.site,c.nfc,c.qr,c.mobile,c.webApp?'oui':'non',c.mobileV2?'oui':'non',c.offline?'oui':'non',c.checkin?'oui':'non',c.livret?'oui':'non',c.gestionDemande?'oui':'non',c.messagerie,c.note,(c.journal||[]).length].map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`));
  const csv='﻿'+[h,...rows].map(r=>r.join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='sesame_crm_export.csv';a.click();
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
function flash(msg='Sauvegardé'){
  const t=document.getElementById('toast');t.textContent='✓ '+msg;t.style.display='block';
  clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';},2400);
}
</script>
