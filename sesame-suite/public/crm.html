<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sesame CRM</title>
<script>try{document.documentElement.setAttribute('data-theme', localStorage.getItem('SESAME_UI_THEME')||'signature');}catch(e){}</script>
<style>
/*
 * THÈMES D'INTERFACE — variables de chrome (fond/carte/bordure/texte/accent).
 * Les couleurs sémantiques (tags/badges/points de statut : t-*, b*, ld-*,
 * fp-on/fp-off…) restent volontairement fixes entre thèmes, non liées à
 * --a, pour ne jamais faire dériver leur sens — même principe que côté
 * admin.html. Thème appliqué via html[data-theme], préférence partagée
 * avec admin.html (localStorage SESAME_UI_THEME, voir applyUiTheme()).
 */
:root, html[data-theme="signature"]{
  --bg:#f5f4f0;--card:#fff;--bdr:#e2dfd9;--bdr2:#d0cdc6;--div:#eeece8;--hover:#f0ede8;
  --tx:#1a1a1a;--mu:#999;--hi:#bbb;
  --a:#8a2b2b;--ah:#711f1f;--al:rgba(138,43,43,.08);
  --scb:#c7c4bd;--scbh:#a8a49c;
  --dch-nfc:#2a78d6;--dch-code:#eda100;--dch-mobile:#e87ba4;--dch-qr:#008300;--dch-violet:#4a3aa7;
  --tr-mrr:#12805a;--tr-signe:#2f5fbf;--tr-pipeline:#c1861d;--tr-depense:#b83f2c;
}
html[data-theme="emeraude"]{
  --bg:#f2f5f1;--card:#fff;--bdr:#dbe4dc;--bdr2:#c3d1c5;--div:#e8efe9;--hover:#eaf2ea;
  --tx:#12201a;--mu:#7c8a7e;--hi:#a9b6ab;
  --a:#1A6B47;--ah:#125236;--al:rgba(26,107,71,.08);
  --scb:#c0d0c2;--scbh:#9cb39f;
  --dch-nfc:#2a78d6;--dch-code:#eda100;--dch-mobile:#e87ba4;--dch-qr:#008300;--dch-violet:#4a3aa7;
  --tr-mrr:#12805a;--tr-signe:#2f5fbf;--tr-pipeline:#c1861d;--tr-depense:#b83f2c;
}
html[data-theme="ocean"]{
  --bg:#f1f4f7;--card:#fff;--bdr:#d9e1e9;--bdr2:#c0ccd8;--div:#e7edf2;--hover:#e9f0f6;
  --tx:#101c2b;--mu:#7688a0;--hi:#a9b8c8;
  --a:#1A4880;--ah:#123561;--al:rgba(26,72,128,.08);
  --scb:#bfd0dd;--scbh:#9cb4c6;
  --dch-nfc:#2a78d6;--dch-code:#eda100;--dch-mobile:#e87ba4;--dch-qr:#008300;--dch-violet:#4a3aa7;
  --tr-mrr:#12805a;--tr-signe:#2f5fbf;--tr-pipeline:#c1861d;--tr-depense:#b83f2c;
}
html[data-theme="ardoise"]{
  --bg:#f4f4f5;--card:#fff;--bdr:#e2e3e6;--bdr2:#cacbd0;--div:#ececee;--hover:#eeeef0;
  --tx:#17181c;--mu:#83848c;--hi:#b3b4bb;
  --a:#4F46E5;--ah:#3c34b8;--al:rgba(79,70,229,.08);
  --scb:#cfd0d6;--scbh:#aeb0b8;
  --dch-nfc:#2a78d6;--dch-code:#eda100;--dch-mobile:#e87ba4;--dch-qr:#008300;--dch-violet:#4a3aa7;
  --tr-mrr:#12805a;--tr-signe:#2f5fbf;--tr-pipeline:#c1861d;--tr-depense:#b83f2c;
}
html[data-theme="nuit"]{
  --bg:#1B1C22;--card:#24262E;--bdr:#33353E;--bdr2:#3d3f4a;--div:#33353E;--hover:#2c2e37;
  --tx:#EDEDEF;--mu:#9A9CA8;--hi:#6B6D78;
  --a:#E0536E;--ah:#c73f59;--al:rgba(224,83,110,.14);
  --scb:#41434d;--scbh:#54565f;
  --dch-nfc:#3987e5;--dch-code:#c98500;--dch-mobile:#d55181;--dch-qr:#008300;--dch-violet:#9085e9;
  --tr-mrr:#1f9e78;--tr-signe:#5f8ee0;--tr-pipeline:#b8791f;--tr-depense:#e8546f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;color:var(--tx);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── TOPBAR ── */
.topbar{background:var(--card);border-bottom:0.5px solid var(--bdr);padding:0 18px;height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:50}
.logo{font-size:14px;font-weight:600;letter-spacing:-.02em;color:var(--tx)}.logo em{color:var(--a);font-style:normal}
.tb-sep{color:#d5d2cc;font-size:16px;margin:0 2px}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px}
.bc-link{color:var(--mu);cursor:pointer}.bc-link:hover{color:var(--tx);text-decoration:underline}
.bc-cur{color:var(--tx);font-weight:500}
.bc-sep{color:#d5d2cc}
.tb-right{margin-left:auto;display:flex;gap:7px;align-items:center}

/* ── BUTTONS ── */
.btn{font-family:inherit;font-size:12px;padding:0 13px;height:31px;border-radius:8px;border:0.5px solid var(--bdr2);background:var(--card);color:#444;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .1s;white-space:nowrap;flex-shrink:0}
.btn:hover{background:var(--hover);border-color:var(--hi)}
.btn-primary{background:var(--a);border-color:var(--a);color:#fff}.btn-primary:hover{background:var(--ah)}
.btn-ghost{background:transparent;border-color:var(--bdr2);color:#555}
.btn-green{background:#eaf3de;border-color:#c0dd97;color:#27500a}.btn-green:hover{background:#d5ecb8}
.btn-amber{background:#faeeda;border-color:#fac775;color:#633806}
.btn-purple{background:#eeedfe;border-color:#afa9ec;color:#3c3489}
.btn-sm{height:27px;font-size:11px;padding:0 9px;border-radius:7px}
.btn-icon{width:30px;padding:0;justify-content:center;font-size:14px}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden;position:relative}

/* ── MENU TOGGLE (mobile) ── */
.menu-toggle{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:#444;padding:2px 6px;line-height:1}

/* ── SIDEBAR ── */
.sidebar{width:210px;flex-shrink:0;background:var(--card);border-right:0.5px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-overlay{display:none}
.nav-lbl{font-size:10px;font-weight:500;color:#c0bdb8;padding:14px 16px 3px;letter-spacing:.07em;text-transform:uppercase;user-select:none}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;color:#666;cursor:pointer;transition:background .1s;user-select:none}
.nav-item:hover{background:var(--hover);color:var(--tx)}
.nav-item.active{background:var(--hover);color:var(--tx);font-weight:500}
.nav-ico{width:15px;height:15px;border:1px solid var(--bdr2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--hi);flex-shrink:0}
.nav-item.active .nav-ico{border-color:#999;color:#666}
.nb{margin-left:auto;font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px}
.nb-r{background:#fcebeb;color:#791f1f}.nb-a{background:#faeeda;color:#633806}
.s-hr{border:none;border-top:0.5px solid var(--div);margin:6px 0}
.view-toggle{display:flex;gap:5px;padding:8px 12px 10px}
.vt{flex:1;font-size:11px;height:27px;border-radius:7px;border:0.5px solid var(--bdr2);background:var(--card);color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .1s;font-family:inherit}
.vt:hover{background:var(--hover)}
.vt.active{background:var(--tx);border-color:var(--tx);color:var(--card)}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--scb) var(--bg)}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-track{background:var(--bg)}
.main::-webkit-scrollbar-thumb{background:var(--scb);border-radius:5px;border:2px solid var(--bg)}
.main::-webkit-scrollbar-thumb:hover{background:var(--scbh)}

/* ── CARDS ── */
.card{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:9px;border-bottom:0.5px solid var(--div)}
.ch-ico{width:18px;height:18px;border:1px solid var(--bdr2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--hi);flex-shrink:0}
.ch-title{font-size:13px;font-weight:500;color:var(--tx);flex:1}
.divl{border:none;border-top:0.5px solid var(--div);margin:10px 0}

/* ── TAGS / BADGES ── */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 9px;border-radius:20px;border:0.5px solid}
.t-gray{background:#f1efe8;color:#555;border-color:#d8d6cf}
.t-blue{background:#e6f1fb;color:#0c447c;border-color:#b5d4f4}
.t-green{background:#eaf3de;color:#27500a;border-color:#c0dd97}
.t-red{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
.t-amber{background:#faeeda;color:#633806;border-color:#fac775}
.t-purple{background:#eeedfe;color:#3c3489;border-color:#afa9ec}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.bd{background:#fcebeb;color:#791f1f}.bw{background:#faeeda;color:#633806}
.bg{background:#eaf3de;color:#27500a}.bn{background:#f1efe8;color:#999}.bi{background:#e6f1fb;color:#0c447c}

/* ── FICHE ── */
.hero-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:13px}
.avatar{border-radius:50%;background:#eeedfe;display:flex;align-items:center;justify-content:center;font-weight:600;color:#3c3489;flex-shrink:0;font-size:15px}
.hero-name{font-size:18px;font-weight:500;margin-bottom:5px}
.tags-row{display:flex;gap:5px;flex-wrap:wrap}
.score-box{margin-left:auto;text-align:right;flex-shrink:0}
.score-lbl{font-size:11px;color:var(--mu);margin-bottom:1px}
.score-num{font-size:26px;font-weight:500;line-height:1}
.score-sub{font-size:11px;color:var(--mu);margin-top:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px}
.field{padding:3px 0}
.fl{font-size:11px;color:var(--mu);margin-bottom:1px;display:flex;align-items:center;gap:3px}
.fl-ico{width:13px;height:13px;border:1px solid var(--bdr2);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:7px;color:var(--hi)}
.fv{font-size:13px;color:var(--tx)}
.fv a{color:#185fa5;text-decoration:none}.fv a:hover{text-decoration:underline}
.fv-sub{font-size:11px;color:var(--mu);margin-top:1px}
.alert-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:4px}
.apill{font-size:11px;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;background:#faeeda;color:#633806;border:0.5px solid #fac775}

/* TWO COL / THREE COL / GRID FLUIDE (cartes d'insights) */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}

/* DONUT — répartition NFC/Mobile/Code/QR (palette catégorielle validée dataviz,
   4 teintes qui passent le contrôle all-pairs CVD/normal-vision en clair ET
   sombre — cf. --dch-* par thème) */
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut-svg{flex-shrink:0}
.donut-legend{flex:1;min-width:120px;display:flex;flex-direction:column;gap:7px}
.donut-legend-row{display:flex;align-items:center;gap:7px;font-size:12px}
.donut-legend-row[onclick]{cursor:pointer;border-radius:6px;margin:0 -4px;padding:2px 4px}
.donut-legend-row[onclick]:hover{background:var(--al)}
.donut-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.donut-legend-lbl{flex:1;color:var(--mu)}
.donut-legend-val{font-weight:500;color:var(--tx)}
.donut-cov{font-size:11px;color:var(--mu);margin-top:8px;padding-top:8px;border-top:0.5px solid var(--div)}

/* BARS — cliquables : chaque ligne ouvre le détail des fiches qui la composent
   (cf. openKpiDetail) — bouton natif plutôt que div pour l'accessibilité clavier. */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;width:100%;background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;border-radius:6px}
.bar-row:hover{background:var(--al)}
.bar-row:hover .bar-fill{filter:brightness(0.9)}
/* KPI DETAIL MODAL — liste des fiches derrière une ligne/segment cliqué */
.kpi-detail-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:0.5px solid var(--div);cursor:pointer}
.kpi-detail-row:last-child{border-bottom:0}
.kpi-detail-row:hover{background:var(--al)}
.kpi-detail-main{flex:1;min-width:0}
.kpi-detail-nom{font-size:13px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-detail-meta{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-lbl{font-size:12px;color:var(--mu);width:68px;flex-shrink:0}
.bar-lbl-wide{font-size:12px;color:var(--tx);width:150px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.bar-track{flex:1;height:8px;background:var(--div);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:filter .1s}
.bar-pct{font-size:12px;font-weight:500;width:32px;text-align:right;color:var(--tx)}
.bar-val{font-size:12px;font-weight:500;width:28px;text-align:right;color:var(--tx);flex-shrink:0}

/* SECTOR ICONS */
.sect-ico{width:16px;height:16px;flex-shrink:0;color:#8a8680}
.sect-ico svg{width:100%;height:100%;display:block}

/* PMS BADGE */
.pms-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:9px;font-weight:700;border:0.5px solid;flex-shrink:0;margin-right:5px;vertical-align:middle}

/* FEATURE PILLS */
.feat-lbl{font-size:11px;color:var(--mu);margin:9px 0 5px}
.feat-pills{display:flex;flex-wrap:wrap;gap:4px}
.fp{font-size:11px;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;border:0.5px solid}
.fp-on{background:#eaf3de;color:#27500a;border-color:#c0dd97}
.fp-off{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
.fp-ico{width:11px;height:11px;border:1px solid currentColor;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:7px;opacity:.7;flex-shrink:0}

/* UPSELL */
.upsell-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--div)}
.upsell-row:last-child{border-bottom:none}
.ups-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ups-info{flex:1}
.ups-name{font-size:13px;font-weight:500}
.ups-price{font-size:10px;padding:1px 7px;border-radius:20px;display:inline-block;margin-top:1px}

/* JOURNAL */
.log-item{display:flex;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--div)}
.log-item:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ld-g{background:#639922}.ld-a{background:#ef9f27}.ld-r{background:#e24b4a}.ld-b{background:#185fa5}
.log-body{flex:1}
.log-text{font-size:13px;line-height:1.45;color:var(--tx)}
.log-meta{font-size:11px;color:var(--mu);margin-top:2px}
.log-acts{display:flex;gap:6px;margin-top:6px}
.log-empty{font-size:12px;color:var(--hi);padding:8px 0;font-style:italic}

/* ADD ACTIVITY FORM */
.act-form{background:var(--hover);border-radius:10px;padding:12px;margin-top:4px;border:0.5px solid var(--bdr)}
.act-form textarea{width:100%;font-family:inherit;font-size:13px;border:0.5px solid var(--bdr2);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--tx);resize:vertical;min-height:64px;outline:none;line-height:1.5}
.act-form textarea:focus{border-color:var(--a);box-shadow:0 0 0 2px var(--al)}
.act-form-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.act-type-sel{font-family:inherit;font-size:12px;padding:0 8px;height:30px;border:0.5px solid var(--bdr2);border-radius:7px;background:var(--card);color:var(--tx);outline:none;cursor:pointer}
.act-date-inp{font-family:inherit;font-size:12px;padding:0 8px;height:30px;border:0.5px solid var(--bdr2);border-radius:7px;background:var(--card);color:var(--tx);outline:none;width:130px}

/* ── LIST VIEW ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:10px;padding:.65rem .9rem;border:0.5px solid var(--bdr)}
.stat-lbl{font-size:11px;color:var(--mu);margin-bottom:2px}
.stat-val{font-size:20px;font-weight:500}
.list-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.srch-wrap{position:relative}
.srch-wrap input{font-family:inherit;font-size:12px;padding:0 10px 0 30px;height:32px;border:0.5px solid var(--bdr2);border-radius:8px;background:var(--card);color:var(--tx);outline:none;width:200px}
.srch-wrap input:focus{border-color:var(--a);box-shadow:0 0 0 2px var(--al)}
.srch-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--hi);pointer-events:none}
.lsel{font-family:inherit;font-size:12px;padding:0 8px;height:32px;border:0.5px solid var(--bdr2);border-radius:8px;background:var(--card);color:var(--tx);outline:none;cursor:pointer}
.count-lbl{font-size:12px;color:var(--mu);margin-left:auto}

/* TABLE */
/* flex-shrink:0 nécessaire : un enfant flex avec overflow!=visible reçoit un
   min-height auto de 0 (au lieu de la taille de son contenu) et se fait
   écraser par .main au lieu de le faire déborder — ce qui empêchait
   l'ascenseur de .main d'apparaître avec beaucoup de lignes. */
.tbl-wrap{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;overflow:hidden;flex-shrink:0}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:var(--hover);font-size:11px;font-weight:500;color:var(--mu);padding:8px 10px;text-align:left;border-bottom:0.5px solid var(--bdr);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--tx)}
td{padding:7px 10px;border-bottom:0.5px solid var(--div);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--hover)}
tr.erow td{background:var(--al)}
.nom-cell{font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nom-cell:hover{color:var(--a)}
.sub-cell{font-size:11px;color:var(--hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpill{font-size:10px;padding:2px 8px;border-radius:20px}
.ta-btn{font-size:12px;width:27px;height:26px;border-radius:6px;border:0.5px solid var(--bdr2);background:transparent;color:var(--mu);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .1s}
.ta-btn:hover{background:var(--hover);color:var(--tx)}
.ta-save{background:#eeedfe;border-color:#afa9ec;color:#3c3489}
.ei{font-size:12px;padding:0 5px;height:26px;border:0.5px solid var(--bdr2);border-radius:6px;background:var(--card);color:var(--tx);width:100%;font-family:inherit;outline:none}
.esel{font-size:11px;padding:0 4px;height:26px;border:0.5px solid var(--bdr2);border-radius:6px;background:var(--card);color:var(--tx);width:100%;font-family:inherit;outline:none}
.sarr{font-size:9px;opacity:.4;margin-left:1px}

/* GRID VIEW */
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gc{background:var(--card);border:0.5px solid var(--bdr);border-radius:12px;padding:14px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.gc:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:var(--hi)}
.gc-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.gc-info{flex:1;min-width:0}
.gc-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-sub{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.gc-fields{display:flex;flex-direction:column;gap:4px}
.gc-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.gc-rl{color:var(--mu)}.gc-rv{font-weight:500}
.gc-divider{border:none;border-top:0.5px solid var(--div);margin:8px 0}
.gc-feats{display:flex;gap:3px;flex-wrap:wrap}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px;overflow-y:auto}
.modal-box{background:var(--card);border-radius:14px;width:100%;max-width:640px;padding:1.4rem}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-head input.name-inp{font-size:16px;font-weight:500;border:none;padding:0;flex:1;background:transparent;outline:none;color:var(--tx);font-family:inherit}
.modal-head input.name-inp:focus{border-bottom:1px solid var(--bdr2)}
.modal-section{font-size:11px;font-weight:500;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.ff label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}
.ff input,.ff select,.ff textarea{font-family:inherit;font-size:12px;width:100%;padding:0 8px;height:32px;border:0.5px solid var(--bdr2);border-radius:7px;background:var(--card);color:var(--tx);outline:none}
.ff input:focus,.ff select:focus{border-color:var(--a);box-shadow:0 0 0 2px var(--al)}
.ff textarea{height:60px;padding:6px 8px;resize:vertical}
.feat-checks{display:flex;flex-wrap:wrap;gap:10px 16px}
.feat-checks label{font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--tx)}
input[type=checkbox]{accent-color:var(--a);cursor:pointer;width:14px;height:14px}
.modal-footer{display:flex;gap:8px;margin-top:16px;align-items:center;padding-top:12px;border-top:0.5px solid var(--div)}

/* ── CANAUX / TEMPLATES ── */
.test-inp{font-family:inherit;font-size:12px;padding:0 8px;height:31px;border:0.5px solid var(--bdr2);border-radius:8px;background:var(--card);color:var(--tx);outline:none;width:170px}
.chan-tabs{display:flex;gap:6px;margin-bottom:10px}
.chan-tab{font-family:inherit;font-size:11px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--bdr2);background:var(--card);color:var(--mu);cursor:pointer}
.chan-tab.active{background:var(--tx);border-color:var(--tx);color:var(--card)}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--tx);color:var(--card);padding:9px 16px;border-radius:10px;font-size:13px;z-index:300;display:none;animation:slideup .2s ease}
@keyframes slideup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── LOGIN GATE ── */
#loginGate{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center}
.lg-box{background:var(--card);border:0.5px solid var(--bdr);border-radius:14px;padding:2rem;width:100%;max-width:340px}
.lg-title{font-size:16px;font-weight:600;margin-bottom:4px}
.lg-sub{font-size:12px;color:var(--mu);margin-bottom:18px}
.lg-box .ff{margin-bottom:10px}
.lg-err{font-size:12px;color:#a32d2d;margin-top:6px;display:none}
.version-badge{margin-top:auto;padding:10px 16px;font-size:10px;color:var(--hi);font-family:monospace}

/* ── THÈME D'INTERFACE (popover) ── */
.ui-theme-pop{position:fixed;z-index:600;background:var(--card);border:1px solid var(--bdr);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:10px;width:190px}
.ui-theme-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--tx)}
.ui-theme-row:hover{background:var(--hover)}
.ui-theme-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.08);box-shadow:0 0 0 2px var(--card) inset}
.ui-theme-row .ui-theme-check{margin-left:auto;color:var(--a);font-size:13px}

/* ── AFFAIRES (pipeline Kanban) ── */
.kanban-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kanban-col{background:var(--bg);border:0.5px solid var(--bdr);border-radius:12px;padding:10px;width:230px;flex-shrink:0}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-size:12px;font-weight:500;color:var(--tx)}
.kanban-col-total{font-size:10px;color:var(--mu);font-weight:400}
.kanban-cards{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kanban-card{background:var(--card);border:0.5px solid var(--bdr);border-radius:10px;padding:10px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.kanban-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:var(--bdr2)}
.kanban-card-title{font-size:12px;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card-client{font-size:11px;color:var(--mu);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.kanban-card-amount{font-weight:600;color:var(--tx)}
.kanban-empty{font-size:11px;color:var(--hi);text-align:center;padding:10px 4px}
.commercial-chip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--tx);color:var(--card);font-size:8px;font-weight:600;flex-shrink:0}

/* ── DEVIS (constructeur + aperçu impression) ── */
.quote-lines{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.quote-line{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:0.5px solid var(--div)}
.quote-line:last-child{border-bottom:none;padding-bottom:0}
.quote-line-main{display:grid;grid-template-columns:1fr 60px 90px 70px 28px;gap:6px;align-items:center}
.quote-line input[type=text]{font-family:inherit;font-size:12px;padding:0 8px;height:30px;border:0.5px solid var(--bdr2);border-radius:6px;background:var(--card);color:var(--tx)}
.quote-line input[type=number]{font-family:inherit;font-size:12px;padding:0 6px;height:30px;border:0.5px solid var(--bdr2);border-radius:6px;background:var(--card);color:var(--tx)}
.quote-line-desc{font-family:inherit;font-size:11px;font-style:italic;padding:0 8px;height:26px;border:0.5px solid var(--div);border-radius:6px;background:var(--bg);color:var(--mu);width:100%}
.quote-line-head{display:grid;grid-template-columns:1fr 60px 90px 70px 28px;gap:6px;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
.quote-catalog-pick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.quote-catalog-pick button{font-family:inherit;font-size:11px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--bdr2);background:var(--card);color:var(--tx);cursor:pointer}
.quote-catalog-pick button:hover{background:var(--hover)}
.quote-total-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.quote-total-row.grand{font-size:14px;font-weight:600;border-top:0.5px solid var(--div);margin-top:6px;padding-top:8px}

/* ── RESPONSIVE ── */
@media (max-width: 900px){
  .menu-toggle{display:inline-flex;align-items:center}
  .sidebar{position:absolute;top:0;left:0;bottom:0;z-index:120;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 16px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:block;position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .sidebar-overlay.show{opacity:1;pointer-events:auto}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .three-col{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .grid-view{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .form-grid{grid-template-columns:1fr}
}

@media (max-width: 560px){
  body{font-size:12.5px}
  .topbar{padding:0 10px;gap:7px}
  .logo{font-size:13px}
  .breadcrumb{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tb-right{gap:5px}
  .main{padding:10px}
  .stats-row{grid-template-columns:1fr 1fr;gap:6px}

  .count-lbl{margin-left:0;text-align:right}
  .modal-bg{padding:10px}
  .modal-box{max-width:100%;padding:1rem}
  .hero-row{flex-wrap:wrap;gap:10px}
  .score-box{margin-left:0;text-align:left;width:100%;display:flex;align-items:center;gap:8px}
  .score-num{font-size:20px}
  .fgrid{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
  table{min-width:680px}
  .two-col,.three-col,.insight-grid{gap:8px}
  .tr-hero{flex-wrap:wrap}
  .tr-hero-figure{text-align:left!important}
  .panels{grid-template-columns:1fr!important}
}

/* ── Trésorerie ── */
.tr-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:16px}
.tr-hero-eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}

.tr-panel-body{max-height:360px;overflow-y:auto;margin:0 -6px}
.tr-row{padding:8px 6px;border-radius:8px}

.add-row{display:flex;align-items:center;gap:6px;width:100%;margin-top:6px;padding:8px 10px;border:1px dashed var(--bdr2);border-radius:8px;background:transparent;color:var(--mu);font-size:12px;cursor:pointer;font-family:inherit}
.add-row:hover{border-color:var(--a);color:var(--a)}
.tr-chart-title{font-size:12.5px;font-weight:600;color:var(--tx);margin-bottom:8px}
.tr-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.tr-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx)}
.tr-sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.tr-sw.tr-line{width:14px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--good,#1a6b47),var(--bad,#b23b2c))}

svg.tr-chart{display:block;width:100%;height:auto;min-width:640px}

.tr-tooltip{position:absolute;pointer-events:none;background:var(--tx);color:var(--card);font-size:11.5px;padding:8px 10px;border-radius:8px;box-shadow:0 8px 24px -8px rgba(0,0,0,.3);transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;line-height:1.5}
.tr-tt-row{display:flex;justify-content:space-between;gap:14px}
</style>
</head>

<script>
// ════════════════════════════════════════
// AUTH — réutilise la même session que admin.html (compte "sesame" requis)
// ════════════════════════════════════════
var API_BASE = '';
var ADMIN_TOKEN = sessionStorage.getItem('SESAME_ADMIN_TOKEN') || null;
var ADMIN_ROLE  = sessionStorage.getItem('SESAME_ADMIN_ROLE') || null;
var ADMIN_CRM_ROLE = sessionStorage.getItem('SESAME_ADMIN_CRMROLE') || null;

function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, {Authorization:'Bearer '+ADMIN_TOKEN});
  return fetch(API_BASE+url, opts);
}

function renderLoginForm(okMsg){
  document.getElementById('lg-box').innerHTML = `
    <div class="lg-title">Sesame <em style="color:#8a2b2b;font-style:normal">CRM</em></div>
    <div class="lg-sub">Réservé aux comptes Sesame Technology.</div>
    <div class="ff"><label>Email</label><input type="email" id="lg-email" placeholder="vous@sesame.technology"></div>
    <div class="ff"><label>Mot de passe</label><input type="password" id="lg-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')crmLogin()"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="crmLogin()">Se connecter</button>
    <div style="text-align:center;margin-top:10px"><a href="#" onclick="renderForgotForm();return false;" style="font-size:12px;color:#8a2b2b">Mot de passe oublié ?</a></div>
    <div class="lg-err" id="lg-err"></div>
    ${okMsg?`<div style="color:#1a6b47;font-size:12px;margin-top:8px;text-align:center">${okMsg}</div>`:''}`;
}

function renderForgotForm(){
  document.getElementById('lg-box').innerHTML = `
    <div class="lg-title">Mot de passe oublié</div>
    <div class="lg-sub">Indiquez votre email — un lien de réinitialisation vous sera envoyé s'il correspond à un compte.</div>
    <div class="ff"><label>Email</label><input type="email" id="fg-email" placeholder="vous@sesame.technology" onkeydown="if(event.key==='Enter')sendForgotEmail()"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="sendForgotEmail()">Envoyer le lien</button>
    <div style="text-align:center;margin-top:10px"><a href="#" onclick="renderLoginForm();return false;" style="font-size:12px;color:#8a2b2b">Retour à la connexion</a></div>
    <div class="lg-err" id="lg-err"></div>
    <div id="lg-ok" style="display:none;color:#1a6b47;font-size:12px;margin-top:8px;text-align:center"></div>`;
}

async function sendForgotEmail(){
  var email = (document.getElementById('fg-email').value||'').trim();
  var errEl = document.getElementById('lg-err'), okEl = document.getElementById('lg-ok');
  errEl.style.display='none';
  if(!email){ errEl.textContent='Email requis'; errEl.style.display='block'; return; }
  try{
    await fetch(API_BASE+'/wa/login/forgotPassword', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email})});
  }catch(e){}
  // Message identique en toute circonstance (compte existant ou non, envoi réussi ou non) — n'expose jamais si l'email correspond à un compte.
  okEl.textContent = "Si un compte existe avec cette adresse, un email de réinitialisation vient d'être envoyé.";
  okEl.style.display='block';
}

function renderResetForm(token){
  document.getElementById('lg-box').innerHTML = `
    <div class="lg-title">Nouveau mot de passe</div>
    <div class="lg-sub">Choisissez un nouveau mot de passe (8 caractères minimum).</div>
    <div class="ff"><label>Nouveau mot de passe</label><input type="password" id="rp-password" placeholder="••••••••"></div>
    <div class="ff"><label>Confirmer</label><input type="password" id="rp-password2" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitResetPassword('${token}')"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="submitResetPassword('${token}')">Valider</button>
    <div class="lg-err" id="lg-err"></div>`;
}

async function submitResetPassword(token){
  var p1 = document.getElementById('rp-password').value||'';
  var p2 = document.getElementById('rp-password2').value||'';
  var errEl = document.getElementById('lg-err');
  errEl.style.display='none';
  if(p1.length<8){ errEl.textContent='8 caractères minimum'; errEl.style.display='block'; return; }
  if(p1!==p2){ errEl.textContent='Les deux mots de passe ne correspondent pas'; errEl.style.display='block'; return; }
  try{
    var r = await fetch(API_BASE+'/wa/login/resetPassword', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token:token,password:p1})});
    var data = await r.json();

// KPI de pipe (module "Gestion des affaires") — affichés sur Home
// uniquement : la page Vue liste montre déjà renderInsights() en double
// avant le 18/08/2026, retiré de là pour ne garder qu'un seul endroit où
// consulter ces indicateurs (cf. demande explicite de dédoublonnage).
function renderPipelineKpis(){
  const open = deals.filter(d=>d.stage!=='Gagné'&&d.stage!=='Perdu');
  const won = deals.filter(d=>d.stage==='Gagné');
  const lost = deals.filter(d=>d.stage==='Perdu');
  const pipelineValue = open.reduce((s,d)=>s+(d.amount||0),0);
  // Valeur pondérée du pipe = montant ponctuel × probabilité (même
  // convention que le "Pipeline pondéré (Affaires)" de la Trésorerie,
  // cf. trDealsPipelineFor) — pas le montant mensuel récurrent (amount),
  // qui est déjà affiché séparément ci-dessus, non pondéré, dans "Valeur
  // du pipe (mensuel)".
  const weightedValue = open.reduce((s,d)=>s+(d.montantPonctuel||0)*(d.probability||0)/100,0);
  const closedCount = won.length+lost.length;
  const conversionRate = closedCount ? Math.round(won.length/closedCount*100) : 0;
  return `<div class="stats-row" style="margin-bottom:12px">
    <div class="stat-card"><div class="stat-lbl">Affaires ouvertes</div><div class="stat-val">${open.length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Valeur du pipe (mensuel)</div><div class="stat-val" style="color:#185fa5">${fmtEUR(pipelineValue)}</div></div>
    <div class="stat-card"><div class="stat-lbl">Valeur pondérée (ponctuel)</div><div class="stat-val" style="color:#3c3489">${fmtEUR(weightedValue)}</div></div>
    <div class="stat-card"><div class="stat-lbl">Taux de conversion</div><div class="stat-val" style="color:${conversionRate>=50?'#1A6B47':'#854f0b'}">${conversionRate}%</div></div>
  </div>`;
}

// Les vues de cette app réécrivent #main en entier à chaque re-render
// (innerHTML=...) — pratique pour rester simple, mais un champ de recherche
// qui redéclenche ce re-render à chaque frappe (oninput) se retrouve
// recréé de zéro à chaque caractère : le focus est perdu, ce qui oblige à
// recliquer dans le champ après chaque lettre tapée. `withFocusKept`
// capture le focus + la position du curseur d'un input correspondant à
// `selector` avant le re-render, puis les restaure juste après.
function withFocusKept(selector, renderFn){
  const active=document.activeElement;
  const wasFocused = !!(active && active.matches && active.matches(selector));
  const selStart = wasFocused ? active.selectionStart : null;
  const selEnd = wasFocused ? active.selectionEnd : null;
  renderFn();
  if(wasFocused){
    const el=document.querySelector(selector);
    if(el){
      el.focus();
      if(selStart!=null){ try{ el.setSelectionRange(selStart,selEnd); }catch(e){} }
    }
  }
}

// GRAPHIQUES — répartition par secteur & usage des modules Sesame
// (calculés en direct depuis les fiches réelles, palette validée
// dataviz : bleu #2a78d6 pour le secteur, orange #eb6834 pour les modules)
// ════════════════════════════════════════

/**
 * Camembert SVG générique — segments = [{lbl, cv (nom de variable CSS
 * --dch-*), pct}], pct se totalisant à ~100 (renormalisé si besoin, ex.
 * arrondis qui ne totalisent pas exactement 100). Technique classique
 * anneau via stroke-dasharray sur des <circle>, un espace de 3px entre
 * segments (cf. règle "2px de respiration entre segments" dataviz, ajusté
 * ici pour rester visible à cette taille), survol natif via <title> —
 * même convention que les barres (title="...") utilisées ailleurs dans
 * cette vue. Légende à droite avec libellé + valeur en encre texte (jamais
 * la couleur de la série), pastille pour porter l'identité de couleur.
 */
function buildDonut(segments){
  const size=132, sw=22, r=(size-sw)/2, cx=size/2, cy=size/2;
  const circ=2*Math.PI*r;
  const rawTotal=segments.reduce((s,x)=>s+x.pct,0)||1;
  let cum=0;
  const arcs=segments.filter(s=>s.pct>0).map(s=>{
    const share=s.pct/rawTotal;
    const arcLen=share*circ;
    const gap=Math.min(3,arcLen*0.15);
    const visible=Math.max(0,arcLen-gap);
    const offset=-cum;
    cum+=arcLen;
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var('+s.cv+')" stroke-width="'+sw+'" '
      +(s.onclick?'style="cursor:pointer" onclick="'+s.onclick+'" ':'')
      +'stroke-dasharray="'+visible+' '+(circ-visible)+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+cx+' '+cy+')">'
      +'<title>'+esc(s.lbl)+' : '+s.pct+'%</title></circle>';
  }).join('');
  const svg='<svg class="donut-svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Répartition des accès par type">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--div)" stroke-width="'+sw+'"></circle>'
    +arcs+'</svg>';
  const legend='<div class="donut-legend">'+segments.map(s=>
    '<div class="donut-legend-row"'+(s.onclick?' onclick="'+s.onclick+'"':'')+'><span class="donut-swatch" style="background:var('+s.cv+')"></span>'
    +'<span class="donut-legend-lbl">'+esc(s.lbl)+'</span><span class="donut-legend-val">'+s.pct+'%</span></div>'
  ).join('')+'</div>';
  return '<div class="donut-wrap">'+svg+legend+'</div>';
}

// ── Détail cliquable des KPI (Home) ──────────────────────────────────────
// Chaque ligne/segment des cartes "Répartition…" et "Usage…" ci-dessous ouvre
// la liste des fiches qui composent ce chiffre (ex. "Non renseigné" sur la
// répartition par PMS → les fiches sans PMS saisi), dans une modale légère
// réutilisant #modal-ct — cliquer une fiche dans la liste y navigue direct.
function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function openKpiDetail(title, list){
  const rows=list.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  const body=rows.length
    ? rows.map(c=>{
        const dc=c.danger==='Élevé !!'?'bd':c.danger==='Bon client'?'bg':'bw';
        const meta=[c.ville,c.secteur].filter(Boolean).join(' · ')||'—';
        return '<div class="kpi-detail-row" onclick="closeModal();showFiche(\''+c.id+'\')">'
          +'<div class="kpi-detail-main"><div class="kpi-detail-nom">'+esc(c.nom)+'</div><div class="kpi-detail-meta">'+esc(meta)+'</div></div>'
          +'<span class="badge '+dc+'" style="font-size:10px">'+esc(c.danger||'—')+'</span>'
          +'</div>';
      }).join('')
    : '<div style="padding:16px 4px;color:var(--mu);font-size:13px">Aucune fiche.</div>';
  document.getElementById('modal-ct').innerHTML =
    '<div class="modal-bg" onmousedown="this._downOnBackdrop=(event.target===this)" onclick="if(event.target===this&&this._downOnBackdrop)closeModal()">'
    +'<div class="modal-box" style="max-width:480px">'
    +'<div class="modal-head"><div style="font-size:16px;font-weight:500">'+esc(title)+'</div>'
    +'<span style="font-size:12px;color:var(--mu);margin-left:8px;white-space:nowrap">'+rows.length+' fiche'+(rows.length>1?'s':'')+'</span>'
    +'<button class="btn btn-ghost btn-icon" onclick="closeModal()" style="margin-left:auto">✕</button></div>'
    +'<div style="max-height:60vh;overflow-y:auto">'+body+'</div>'
    +'</div></div>';
}
function kpiBySecteur(s){ openKpiDetail('Secteur : '+s, clients.filter(c=>c.type==='Client' && (c.secteur||'Non renseigné')===s)); }
function kpiByPms(p){ openKpiDetail('PMS : '+p, clients.filter(c=>{ if(c.type!=='Client') return false; const raw=(c.pms||'').trim(); return (raw && raw.toLowerCase()!=='none'?raw:'Non renseigné')===p; })); }
function kpiByFlag(k,lbl){ openKpiDetail(lbl, clients.filter(c=>c.type==='Client' && c[k])); }
function kpiByAccess(k,lbl){ openKpiDetail(lbl+' — usage réel', clients.filter(c=>c.type==='Client' && (c.nfc||0)+(c.mobile||0)+(c.code||0)+(c.qr||0)>0 && (c[k]||0)>0)); }

function renderInsights(){
  if(!clients.length) return '';
  // Les KPI de cette vue ne portent que sur les fiches Client — les
  // Prospects (pas encore clients, cf. TYPES) fausseraient des indicateurs
  // comme "Répartition par PMS" ou "Usage des modules Sesame" qui décrivent
  // le parc installé, pas le pipe commercial (déjà couvert par
  // renderPipelineKpis()).
  const clientsOnly=clients.filter(c=>c.type==='Client');

  // ── Répartition par secteur ──
  const bySecteur={};
  clientsOnly.forEach(c=>{ const s=c.secteur||'Non renseigné'; bySecteur[s]=(bySecteur[s]||0)+1; });
  const secteurRows=Object.entries(bySecteur).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxSecteur=Math.max(...secteurRows.map(r=>r[1]),1);
  const secteurHtml=secteurRows.map(([s,n])=>
    '<button type="button" class="bar-row" title="'+esc(s)+' : '+n+'" onclick="kpiBySecteur(\''+jsStr(s)+'\')">'
    +'<span class="bar-lbl-wide">'+sectorIcon(s)+'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s)+'</span></span>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+(n/maxSecteur*100)+'%;background:#2a78d6"></div></div>'
    +'<span class="bar-val">'+n+'</span>'
    +'</button>'
  ).join('');

  // ── Répartition par PMS — même forme que la répartition par secteur
  // (liste de catégories, jusqu'à plus d'une dizaine de valeurs réelles dans
  // le portefeuille : un camembert serait illisible au-delà de 5-6 tranches).
  // La valeur historique "none" (2 fiches, saisie libre avant que ce champ
  // ne devienne une liste) est regroupée avec les fiches sans PMS renseigné
  // plutôt que traitée comme un nom de PMS à part entière. ──
  const byPms={};
  clientsOnly.forEach(c=>{ const raw=(c.pms||'').trim(); const p=(raw && raw.toLowerCase()!=='none')?raw:'Non renseigné'; byPms[p]=(byPms[p]||0)+1; });
  const pmsRows=Object.entries(byPms).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxPms=Math.max(...pmsRows.map(r=>r[1]),1);
  const pmsHtml=pmsRows.map(([p,n])=>
    '<button type="button" class="bar-row" title="'+esc(p)+' : '+n+'" onclick="kpiByPms(\''+jsStr(p)+'\')">'
    +'<span class="bar-lbl-wide" style="width:130px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p)+'</span></span>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+(n/maxPms*100)+'%;background:#0f8a7a"></div></div>'
    +'<span class="bar-val">'+n+'</span>'
    +'</button>'
  ).join('');

  // ── Usage des modules Sesame — les 13 "Options actives" de la fiche
  // client (featDef), y compris Livret digital/Gestion demande et le
  // parcours onboarding/espace client : la carte "Parcours client activés"
  // qui les excluait autrefois de ce graphique a été supprimée le
  // 18/08/2026 (fusionnée dans "Options actives" sur la fiche), donc plus
  // aucune raison de les exclure ici. Le nombre total ci-contre est la
  // somme des 13 compteurs ci-dessous — le nombre de MODULES actifs sur
  // tout le portefeuille (un client avec 3 options cochées compte pour 3),
  // pas le nombre de clients ayant au moins un module. Il additionnait
  // auparavant le champ libre "Nb modules" (c.modules, saisi à la main
  // depuis l'audit) — décorrélé des 13 booléens ci-dessous et pas fiable
  // comme décompte réel de modules, corrigé le 24/08/2026. ──
  const MODULE_FEATURES=[['webApp','WebApp'],['mobileV2','Mobile V2'],['offline','Offline'],['livret','Livret digital'],['checkin','Check-in mobile'],['gestionDemande','Gestion demande'],['onbChoixChambres','Choix chambre'],['onbOccupant','Occupant'],['onbIdentite','Identité'],['onbMenage','Ménage'],['espBoutique','Boutique'],['espPoint','Points fidélité'],['espEvenement','Évènements']];
  const total=clientsOnly.length;
  const moduleCounts=MODULE_FEATURES.map(([k,lbl])=>[k,lbl,clientsOnly.filter(c=>c[k]).length]);
  const totalModulesActifs=moduleCounts.reduce((s,[,,n])=>s+n,0);
  const moduleHtml=moduleCounts.map(([k,lbl,n])=>{
    const pct=total?Math.round(n/total*100):0;
    return '<button type="button" class="bar-row" title="'+lbl+' : '+n+'/'+total+'" onclick="kpiByFlag(\''+jsStr(k)+'\',\''+jsStr(lbl)+'\')">'
      +'<span class="bar-lbl-wide" style="width:130px">'+esc(lbl)+'</span>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:#eb6834"></div></div>'
      +'<span class="bar-pct" style="width:64px;white-space:nowrap">'+n+' ('+pct+'%)</span>'
      +'</button>';
  }).join('');

  // ── Décompte par type de module installé (Sesame / Ttlock / Oneway) —
  // liste déroulante "Type de module" sur la fiche (un seul type, ou "Mix"
  // Sesame+Ttlock, cf. saveModal). Chaque compteur est la SOMME du champ
  // "Nb modules" (c.modules, saisi à la main depuis l'audit) des fiches
  // ayant ce type — pas le nombre de fiches (un client avec 51 modules
  // Sesame doit peser 51, pas 1) : la version précédente comptait les
  // clients (`.filter(c=>c[k]).length`), corrigé le 24/08/2026 à la
  // demande explicite. Total ci-contre = somme des 3 compteurs (un client
  // "Mix" compte dans Sesame ET Ttlock). Pourcentage affiché = part de ce
  // type dans le total des modules (et non plus part des clients, qui
  // n'aurait plus de sens face à une somme de quantités). ──
  const MODULE_TYPES=[['moduleSesame','Sesame','#1A6B47'],['moduleTtlock','Ttlock','#185fa5'],['moduleOneway','Oneway','#c1861d']];
  const moduleTypeCounts=MODULE_TYPES.map(([k,lbl,color])=>[lbl,color,clientsOnly.filter(c=>c[k]).reduce((s,c)=>s+(c.modules||0),0)]);
  const totalModuleTypes=moduleTypeCounts.reduce((s,[,,n])=>s+n,0);
  const moduleTypeHtml=moduleTypeCounts.map(([lbl,color,n],idx)=>{
    const pct=totalModuleTypes?Math.round(n/totalModuleTypes*100):0;
    const k=MODULE_TYPES[idx][0];
    return '<button type="button" class="bar-row" title="'+lbl+' : '+n+' module(s)" onclick="kpiByFlag(\''+jsStr(k)+'\',\''+jsStr(lbl)+'\')">'
      +'<span class="bar-lbl-wide" style="width:130px">'+esc(lbl)+'</span>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
      +'<span class="bar-pct" style="width:64px;white-space:nowrap">'+n+' ('+pct+'%)</span>'
      +'</button>';
  }).join('');

  // ── Répartition des accès par type (NFC / Mobile / Code / QR), en camembert
  // — les 4 se totalisent à 100% par fiche (ce sont les 4 façons dont un
  // client final s'identifie, pas 4 mesures indépendantes), donc calculés ici
  // comme une part d'un tout plutôt que 4 barres séparées. Uniquement sur les
  // fiches Client ayant réellement des données d'usage (audit) — une fiche
  // sans donnée (0 partout) n'est pas "0% partout", elle est simplement pas
  // encore auditée, et la mélanger aux autres déformerait la répartition
  // plutôt que de simplement réduire la couverture affichée. Couleurs :
  // palette catégorielle validée dataviz (4 teintes qui passent le contrôle
  // all-pairs CVD/normal-vision en clair ET sombre, cf. --dch-* par thème). ──
  const ACCESS_TYPES=[['nfc','NFC','--dch-nfc'],['mobile','Mobile','--dch-mobile'],['code','Code','--dch-code'],['qr','QR Code','--dch-qr']];
  const nClients=clientsOnly.length;
  const clientsWithUsage=clientsOnly.filter(c=>(c.nfc||0)+(c.mobile||0)+(c.code||0)+(c.qr||0)>0);
  const nWithUsage=clientsWithUsage.length;
  const accessShares=ACCESS_TYPES.map(([k,lbl,cv])=>{
    const sum=clientsWithUsage.reduce((s,c)=>s+(c[k]||0),0);
    const pct=nWithUsage?Math.round(sum/nWithUsage):0;
    return {k,lbl,cv,pct,onclick:"kpiByAccess('"+jsStr(k)+"','"+jsStr(lbl)+"')"};
  });
  const accessHtml=nWithUsage
    ? buildDonut(accessShares)
      + '<div class="donut-cov">'+nWithUsage+' / '+nClients+' fiches Client avec données d\'usage réelles'+(nWithUsage<nClients?' — le reste n\'est pas encore audité':'')+'</div>'
    : '';

  // La carte "Parcours client activés" (étapes d'onboarding + rubriques de
  // l'espace client) a été retirée le 18/08/2026 : ce sont des modules
  // Sesame comme les autres, désormais fusionnés dans "Options actives"
  // sur la fiche client — la doubler ici avec un graphique dédié n'avait
  // plus d'utilité.
  return '<div class="insight-grid">'
    + '<div class="card"><div class="card-head"><div class="ch-ico">◻</div><span class="ch-title">Répartition par secteur</span></div>'+secteurHtml+'</div>'
    + '<div class="card"><div class="card-head"><div class="ch-ico">▤</div><span class="ch-title">Répartition par PMS</span></div>'+pmsHtml+'</div>'
    + '<div class="card"><div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Usage des modules Sesame</span><span style="font-size:11px;color:#aaa;margin-left:8px;white-space:nowrap">'+totalModulesActifs+' au total</span></div>'+moduleHtml+'</div>'
    + '<div class="card"><div class="card-head"><div class="ch-ico">◫</div><span class="ch-title">Type de module installé</span><span style="font-size:11px;color:#aaa;margin-left:8px;white-space:nowrap">'+totalModuleTypes+' au total</span></div>'+moduleTypeHtml+'</div>'
    + '<div class="card"><div class="card-head"><div class="ch-ico">◉</div><span class="ch-title">Taux d\'usage des accès</span><span style="font-size:11px;color:#aaa;margin-left:8px">'+nClients+' clients</span></div>'+accessHtml
      +(nWithUsage?'':'<div style="font-size:12px;color:#bbb;padding:4px 0;font-style:italic">Aucune donnée d\'usage réelle sur les fiches Client</div>')+'</div>'
    + '</div>';
}

function renderList(){

    <select class="lsel" onchange="fSecteur=this.value;renderList()"><option value="">Tous secteurs</option>${sectAll.map(s=>`<option value="${s}" ${fSecteur===s?'selected':''}>${s}</option>`).join('')}</select>

  let content='';
  if(vmode==='map'){
    content=`<div id="crm-map-status" style="font-size:12px;color:var(--mu,#888);margin-bottom:8px;min-height:16px"></div>
      <div id="crm-map" style="height:520px;border-radius:12px;border:1px solid var(--bdr,#e2dfd9);background:var(--bg2,#f5f3ee)"></div>`;
  } else if(vmode==='grid'){
    content=`<div class="grid-view">${data.map(c=>{
      const dc=c.danger==='Élevé !!'?'bd':c.danger==='Bon client'?'bg':'bw';
      const feats=[c.webApp&&'WebApp',c.mobileV2&&'V2',c.checkin&&'Check-in',c.livret&&'Livret',c.gestionDemande&&'Gestion'].filter(Boolean);
      const lastAct=(c.journal||[]).slice(-1)[0];
      return`<div class="gc" onclick="showFiche('${c.id}')">
        <div class="gc-head">
          <div class="avatar" style="width:36px;height:36px;font-size:12px">${ini(c.nom)}</div>
          <div class="gc-info"><div class="gc-name">${c.nom}</div><div class="gc-sub">${c.groupe||c.secteur||'—'}</div></div>
          ${c.commercialName?`<span class="commercial-chip" title="Commercial : ${esc(c.commercialName)}">${ini(c.commercialName)}</span>`:''}
        </div>
        <div class="gc-tags">${typeBadge(c.type)}<span class="badge ${dc}" style="font-size:10px">${c.danger||'—'}</span>${c.ville?`<span class="tag t-blue" style="font-size:10px">${c.ville}</span>`:''}${inboundBadge(c)}${supportBadge(c)}</div>
        <hr class="gc-divider">
        <div class="gc-fields">
          <div class="gc-row"><span class="gc-rl">Contrat</span>${cPill(c.contrat)}</div>
          <div class="gc-row"><span class="gc-rl">Modules</span><span class="gc-rv">${c.modules||'—'}</span></div>
          <div class="gc-row"><span class="gc-rl">PMS</span><span class="gc-rv">${c.pms?pmsBadge(c.pms):'—'}</span></div>
          ${lastAct?`<div class="gc-row" style="margin-top:2px"><span class="gc-rl">Dernière activité</span><span class="gc-rv" style="color:#aaa;font-size:10px;font-weight:400">${lastAct.type}</span></div>`:''}
        </div>
        ${feats.length?`<hr class="gc-divider"><div class="gc-feats">${feats.map(f=>`<span class="tpill bg" style="font-size:10px">${f}</span>`).join('')}</div>`:''}

        <td><select class="esel" onchange="ef('${c.id}','potentiel',+this.value)"><option value="0">—</option><option value="1" ${c.potentiel===1?'selected':''}>1</option><option value="2" ${c.potentiel===2?'selected':''}>2</option><option value="3" ${c.potentiel===3?'selected':''}>3</option></select></td>
        <td><input class="ei" value="${esc(c.appel)}" onchange="ef('${c.id}','appel',this.value)" style="width:82px"></td>
        <td><select class="esel" onchange="ef('${c.id}','contrat',this.value)"><option value="non" ${c.contrat==='non'?'selected':''}>non</option><option value="oui" ${c.contrat==='oui'?'selected':''}>oui</option><option value="en cours" ${c.contrat==='en cours'?'selected':''}>en cours</option></select></td>
        <td><input type="checkbox" ${c.webApp?'checked':''} onchange="ef('${c.id}','webApp',this.checked)"></td>
        <td><input type="checkbox" ${c.checkin?'checked':''} onchange="ef('${c.id}','checkin',this.checked)"></td>
        <td style="white-space:nowrap"><button class="ta-btn ta-save" onclick="saveRow('${c.id}')">✓</button></td>

      return`<tr>
        <td><div class="avatar" style="width:26px;height:26px;font-size:10px;cursor:pointer" onclick="showFiche('${c.id}')">${ini(c.nom)}</div></td>
        <td><div class="nom-cell" onclick="showFiche('${c.id}')">${typeBadge(c.type)} ${c.nom} ${inboundBadge(c)} ${supportBadge(c)} ${c.commercialName?`<span class="commercial-chip" title="Commercial : ${esc(c.commercialName)}">${ini(c.commercialName)}</span>`:''}</div><div class="sub-cell">${c.groupe||'—'}</div></td>
        <td style="font-size:12px;color:#666">${c.secteur||'—'}</td>

        <td>${pBadge(c.potentiel)}</td>

        <td style="white-space:nowrap">

      </tr>`;
    }).join('');
    content=`<div class="tbl-wrap"><table>
      <thead><tr>
        <th style="width:34px"></th>
        ${th('nom','Client','160px')}${th('secteur','Secteur','135px')}${th('ville','Ville','85px')}
        ${th('danger','Risque','100px')}${th('potentiel','Potentiel','72px')}${th('appel','Appel','88px')}
        ${th('contrat','Contrat','75px')}<th style="width:62px">WebApp</th><th style="width:65px">Check-in</th><th style="width:68px">Actions</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }
  withFocusKept('.srch-wrap input', ()=>{ document.getElementById('main').innerHTML=stats+toolbar+content; });
  if(vmode==='map') renderMapView(data);
}

function srt(c){if(sortC===c)sortD*=-1;else{sortC=c;sortD=1;}renderList();}
function ef(id,f,v){const c=clients.find(c=>c.id===id);if(!c)return;c[f]=v;if(f==='ville'){c.lat=null;c.lng=null;}}
async function saveRow(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify(c)});
    if(!r.ok) throw new Error('http '+r.status);
    var updated = await r.json();
    Object.assign(c, updated);
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  editingId=null;updateBadges();flash('Modifications enregistrées');renderList();
}

// ════════════════════════════════════════
// VUE CARTE — positionnement géographique des clients/prospects
// Géocode adresse+ville via l'API publique api-adresse.data.gouv.fr (Base
// Adresse Nationale — gratuite, sans clé, déjà utilisée par
// l'autocomplétion d'adresse du formulaire, cf. adresseAutocomplete()) et
// met le résultat en cache sur la fiche (CrmProspect.lat/lng) pour ne pas
// re-géocoder à chaque ouverture. Carte affichée avec Leaflet + fonds de
// carte OpenStreetMap, chargés à la demande (jamais sur les autres vues).
// ════════════════════════════════════════
let crmLeafletMap=null, crmLeafletLoading=null;

function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(crmLeafletLoading) return crmLeafletLoading;
  crmLeafletLoading = new Promise((resolve,reject)=>{
    const css=document.createElement('link');
    css.rel='stylesheet'; css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('connexion internet requise'));
    document.head.appendChild(s);
  });
  return crmLeafletLoading;
}

async function renderMapView(data){
  const statusEl=()=>document.getElementById('crm-map-status');
  try{ await loadLeaflet(); }
  catch(e){
    if(statusEl()) statusEl().innerHTML='<span style="color:#a32d2d">Carte indisponible : '+esc(e.message)+'</span>';
    return;
  }
  // La vue a pu changer pendant le chargement de Leaflet (async) — le
  // conteneur n'existe alors plus, rien à faire.
  if(!document.getElementById('crm-map') || vmode!=='map') return;

  if(crmLeafletMap){ try{ crmLeafletMap.remove(); }catch(e){} crmLeafletMap=null; }
  crmLeafletMap = L.map('crm-map').setView([46.6, 2.4], 6); // France entière par défaut
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
  }).addTo(crmLeafletMap);

  const withCoords = data.filter(c=>c.lat!=null && c.lng!=null);
  const toGeocode = data.filter(c=>c.lat==null && c.lng==null && (c.adresse||c.ville));

  const markers=[];
  function addMarker(c){
    const color = c.type==='Prospect' ? '#0c447c' : '#27500a';
    const m = L.circleMarker([c.lat,c.lng], {radius:7, color:'#fff', weight:2, fillColor:color, fillOpacity:0.9}).addTo(crmLeafletMap);
    m.bindPopup(
      '<div style="min-width:170px">'
      +'<div style="font-weight:700;margin-bottom:2px">'+esc(c.nom)+'</div>'
      +'<div style="font-size:11px;color:#888;margin-bottom:8px">'+esc([c.ville,c.secteur].filter(Boolean).join(' · ')||'—')+'</div>'
      +'<button onclick="showFiche(\''+c.id+'\')" style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer">Voir la fiche</button>'
      +'</div>'
    );
    markers.push(m);
  }
  function fitToMarkers(){
    if(!markers.length) return;
    if(markers.length===1){ crmLeafletMap.setView(markers[0].getLatLng(), 12); return; }
    crmLeafletMap.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
  }
  withCoords.forEach(addMarker);
  fitToMarkers();

  function refreshStatus(){
    const el=statusEl(); if(!el) return;
    const stillMissing = data.filter(c=>c.lat==null||c.lng==null).length;
    el.textContent = stillMissing ? stillMissing+' fiche(s) non localisée(s) (adresse manquante ou introuvable)' : '';
  }
  refreshStatus();

  // Géocodage séquentiel (pas de traitement par lot côté API publique) des
  // fiches sans coordonnées en cache — un léger délai entre chaque appel
  // pour rester un usage raisonnable d'une API publique gratuite.
  for(const c of toGeocode){
    if(vmode!=='map' || !document.getElementById('crm-map')) return; // vue quittée entre-temps
    const q=[c.adresse,c.ville].filter(Boolean).join(' ');
    try{
      const r=await fetch('https://api-adresse.data.gouv.fr/search/?q='+encodeURIComponent(q)+'&limit=1');
      if(r.ok){
        const j=await r.json();
        const f=(j.features||[])[0];
        if(f && f.geometry && f.geometry.coordinates){
          c.lng=f.geometry.coordinates[0]; c.lat=f.geometry.coordinates[1];
          addMarker(c); fitToMarkers(); refreshStatus();
          apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify({id:c.id, lat:c.lat, lng:c.lng})}).catch(()=>{});
        }
      }
    }catch(e){ /* hors-ligne ou API bloquée — on retentera à la prochaine ouverture de la carte */ }
    await new Promise(res=>setTimeout(res,150));
  }
}

// ════════════════════════════════════════
async function loadAdminAccessCard(c){
  const el=document.getElementById('admin-access-card');
  if(!el)return;
  if(!c.entityId){
    el.innerHTML=`<div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Accès admin</span></div>
      <div class="log-empty">Aucun établissement Sesame rattaché à ce contact — l'accès admin nécessite une souscription activée (panneau Souscriptions) pour provisionner l'établissement.</div>`;
    return;
  }
  if(!c.email){
    el.innerHTML=`<div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Accès admin</span></div>
      <div class="log-empty">Renseignez une adresse email sur la fiche pour pouvoir créer un accès admin.</div>`;
    return;
  }
  try{
    var r = await apiFetch('/wa/adminUser/status?entityId='+encodeURIComponent(c.entityId)+'&email='+encodeURIComponent(c.email));
    var data = r.ok ? await r.json() : {exists:false};
  }catch(e){ data={exists:false}; }
  renderAdminAccessCard(c, data);
}

function renderAdminAccessCard(c, data){
  const el=document.getElementById('admin-access-card');
  if(!el)return;
  if(data.exists){
    const u=data.user;
    el.innerHTML=`<div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Accès admin</span></div>
      <div class="log-item">
        <div class="log-dot ld-g"></div>
        <div class="log-body">
          <div class="log-text"><strong>Compte actif</strong> — ${esc(u.email)} <span class="tag t-gray" style="font-size:10px;padding:1px 7px">${u.role==='sesame'?'Sesame':'Établissement'}</span></div>
          <div class="log-meta">Créé le ${new Date(u.createdAt).toLocaleDateString('fr-FR')}</div>
          <div class="log-acts">
            <button class="btn btn-sm btn-ghost" onclick="resetAdminAccess('${c.id}','${u.id}')">Réinitialiser le mot de passe</button>
            <button class="btn btn-sm btn-ghost" style="color:#a32d2d" onclick="revokeAdminAccess('${c.id}','${u.id}')">Révoquer l'accès</button>
          </div>
        </div>
      </div>`;
  } else {
    el.innerHTML=`<div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Accès admin</span></div>

      </div>
      <div class="log-acts" style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="createAdminAccess('${c.id}')">Créer un accès admin</button></div>`;
  }
}

async function createAdminAccess(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  const role=(document.getElementById('admin-access-role')||{value:'hotel'}).value;
  try{
    var r = await apiFetch('/wa/adminUser/create', {method:'POST', body:JSON.stringify({entityId:c.entityId, email:c.email, name:c.nom, role:role})});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
  }catch(e){ flash(e.message||'Erreur de création'); return; }
  alert('Accès admin créé.\n\nEmail : '+data.email+'\nMot de passe temporaire : '+data.password+'\n\nCe mot de passe ne sera plus jamais affiché — transmettez-le au contact dès maintenant.');
  loadAdminAccessCard(c);
}

async function resetAdminAccess(id,userId){
  if(!confirm("Réinitialiser le mot de passe de ce compte ?"))return;
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/adminUser/resetPassword', {method:'POST', body:JSON.stringify({id:userId})});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
  }catch(e){ flash('Erreur de réinitialisation'); return; }
  alert('Nouveau mot de passe temporaire : '+data.password+'\n\nCe mot de passe ne sera plus jamais affiché — transmettez-le au contact dès maintenant.');
}

async function revokeAdminAccess(id,userId){
  if(!confirm("Révoquer l'accès admin de ce contact ?"))return;
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{

  slot.innerHTML=`<div class="act-form">

function cancelActForm(){const s=document.getElementById('act-form-slot');if(s)s.innerHTML='';}

async function saveActivity(id){
  const txt=(document.getElementById('act-txt')||{}).value||'';
  if(!txt.trim()){flash('Veuillez saisir une description');return;}
  const type=(document.getElementById('act-type')||{}).value||'Note interne';
  const dateV=(document.getElementById('act-date')||{}).value||'';
  const author=(document.getElementById('act-author')||{}).value||'';
  const c=clients.find(c=>c.id===id);
  if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/create', {method:'POST', body:JSON.stringify({
      prospectId:id, type:type, text:txt.trim(), authorName:author, activityDate: dateV || undefined
    })});
    if(!r.ok) throw new Error('http '+r.status);
    var entry = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(!c.journal)c.journal=[];
  c.journal.push(entry);
  flash('Activité enregistrée');
  showFiche(id);
}

async function markDone(id,jid){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/markDone', {method:'POST', body:JSON.stringify({id:jid})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur'); return; }
  const j=c.journal.find(j=>j.id===jid);if(j)j.done=true;
  flash('Marqué comme fait');
  showFiche(id);
}

async function deleteAct(id,jid){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/delete', {method:'POST', body:JSON.stringify({id:jid})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur'); return; }
  c.journal=c.journal.filter(j=>j.id!==jid);
  flash('Activité supprimée');
  showFiche(id);
}

// Autocomplétion d'adresse via l'API Adresse (BAN — Base Adresse Nationale,
// data.gouv.fr) : gratuite, sans clé, réponse CORS directement utilisable
// depuis le navigateur. Sélectionner une suggestion remplit l'adresse ET la
// ville d'un coup — la saisie manuelle reste possible si l'API est
// indisponible ou si l'adresse recherchée n'y figure pas. Les coordonnées
// GPS renvoyées par cette même recherche sont aussi récupérées (champs
// cachés m-lat/m-lng) pour alimenter directement la vue Carte du CRM sans
// re-géocoder plus tard (cf. renderMapView).
let adresseDebounce=null, adresseResults=[];
function adresseAutocomplete(){
  clearTimeout(adresseDebounce);
  const inp = document.getElementById('m-adresse');
  const box = document.getElementById('m-adresse-suggestions');
  if(!inp||!box) return;
  const q = inp.value.trim();
  if(q.length<3){ box.style.display='none'; box.innerHTML=''; return; }
  adresseDebounce = setTimeout(async ()=>{
    try{
      const r = await fetch('https://api-adresse.data.gouv.fr/search/?q='+encodeURIComponent(q)+'&limit=5');
      if(!r.ok){ box.style.display='none'; return; }
      const data = await r.json();
      adresseResults = data.features||[];
      if(!adresseResults.length){ box.style.display='none'; box.innerHTML=''; return; }
      box.innerHTML = adresseResults.map((f,i)=>{
        const p=f.properties||{};
        return '<div style="padding:7px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bdr,#e2dfd9)" onmousedown="pickAdresse('+i+')">'+esc(p.label||'')+'</div>';
      }).join('');
      box.style.display='block';
    }catch(e){ box.style.display='none'; }
  }, 300);
}
function pickAdresse(i){
  const f=adresseResults[i]; if(!f) return;
  const p=f.properties||{};
  const coords=(f.geometry&&f.geometry.coordinates)||null;
  const a=document.getElementById('m-adresse'), v=document.getElementById('m-ville'), box=document.getElementById('m-adresse-suggestions');
  const lat=document.getElementById('m-lat'), lng=document.getElementById('m-lng'), pays=document.getElementById('m-pays');
  if(a) a.value = p.name||'';
  if(v && p.city) v.value = p.city;
  if(pays) pays.value = 'France'; // l'API Adresse (BAN) ne couvre que la France
  if(coords){ if(lat)lat.value=coords[1]; if(lng)lng.value=coords[0]; }
  if(box){ box.style.display='none'; box.innerHTML=''; }
}
function clearMLatLng(){
  const lat=document.getElementById('m-lat'), lng=document.getElementById('m-lng');
  if(lat) lat.value=''; if(lng) lng.value='';
}

// Recherche d'entreprises via l'API publique du même nom (data.gouv.fr,
// recherche-entreprises.api.gouv.fr) : gratuite, sans clé, CORS activé,
// interroge directement le répertoire SIRENE de l'INSEE par dénomination
// ou SIRET/SIREN. Remplit toutes les informations disponibles ayant un
// champ correspondant sur la fiche : dénomination sociale, SIRET, SIREN,
// adresse du siège (+ ville, coordonnées GPS), forme juridique, date de
// création et effectif salarié, et le nom du dirigeant principal dans
// "Référent". Même repli que l'autocomplétion d'adresse : API indisponible
// → liste masquée, saisie manuelle toujours possible, jamais bloquant.
//
// nature_juridique et tranche_effectif_salarie sont renvoyés par l'API sous
// forme de codes INSEE (pas de libellé) — FORME_JURIDIQUE_LABELS ne couvre
// que les formes les plus courantes ; le code brut est toujours affiché en
// complément (ou seul si non couvert) pour ne jamais afficher un libellé
// inventé. TRANCHE_EFFECTIF_LABELS couvre en revanche la nomenclature
// officielle complète (17 tranches, stable).
const FORME_JURIDIQUE_LABELS={
  '1000':'Entrepreneur individuel','5202':'Société en nom collectif','5310':'SCS',
  '5385':'SCA','5498':'SARL','5499':'EURL','5505':'SA à conseil d\'administration',
  '5599':'SA à directoire','5710':'SAS','5720':'SASU','6540':'SCI','9220':'Association'
};
const TRANCHE_EFFECTIF_LABELS={
  '00':'0 salarié','01':'1 à 2 salariés','02':'3 à 5 salariés','03':'6 à 9 salariés',
  '11':'10 à 19 salariés','12':'20 à 49 salariés','21':'50 à 99 salariés','22':'100 à 199 salariés',
  '31':'200 à 249 salariés','32':'250 à 499 salariés','41':'500 à 999 salariés','42':'1 000 à 1 999 salariés',
  '51':'2 000 à 4 999 salariés','52':'5 000 à 9 999 salariés','53':'10 000 salariés et plus'
};
function formeJuridiqueLabel(code){
  if(!code) return '';
  return FORME_JURIDIQUE_LABELS[code] ? FORME_JURIDIQUE_LABELS[code]+' ('+code+')' : 'Code '+code;
}
function effectifLabel(code){
  if(!code) return '';
  return TRANCHE_EFFECTIF_LABELS[code] || ('Code '+code);
}
let entrepriseDebounce=null, entrepriseResults=[];
function entrepriseAutocomplete(){
  clearTimeout(entrepriseDebounce);
  const inp = document.getElementById('m-entreprise-search');
  const box = document.getElementById('m-entreprise-suggestions');
  if(!inp||!box) return;
  const q = inp.value.trim();
  if(q.length<3){ box.style.display='none'; box.innerHTML=''; return; }
  entrepriseDebounce = setTimeout(async ()=>{
    try{
      const r = await fetch('https://recherche-entreprises.api.gouv.fr/search?q='+encodeURIComponent(q)+'&limit=5');
      if(!r.ok){ box.style.display='none'; return; }
      const data = await r.json();
      entrepriseResults = data.results||[];
      if(!entrepriseResults.length){ box.style.display='none'; box.innerHTML=''; return; }
      box.innerHTML = entrepriseResults.map((e,i)=>{
        const nom = e.nom_complet || e.nom_raison_sociale || '';
        const siret = (e.siege&&e.siege.siret) || '';
        const siren = e.siren || '';
        const adresse = (e.siege&&e.siege.adresse) || '';
        return '<div style="padding:7px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bdr,#e2dfd9)" onmousedown="pickEntreprise('+i+')">'
          +'<div style="font-weight:600">'+esc(nom)+'</div>'
          +'<div style="color:var(--mu,#888);font-size:11px">SIREN '+esc(siren)+(adresse?' · '+esc(adresse):'')+'</div>'
          +'</div>';
      }).join('');
      box.style.display='block';
    }catch(e){ box.style.display='none'; }
  }, 300);
}
function pickEntreprise(i){
  const e = entrepriseResults[i]; if(!e) return;
  const siege = e.siege || {};
  const nom = e.nom_complet || e.nom_raison_sociale || '';
  const siret = siege.siret || '';
  const siren = e.siren || '';
  const street = [siege.numero_voie, siege.type_voie, siege.libelle_voie].filter(Boolean).join(' ');
  const city = siege.libelle_commune || '';
  const lat = siege.latitude!=null ? parseFloat(siege.latitude) : null;
  const lng = siege.longitude!=null ? parseFloat(siege.longitude) : null;
  const dirigeants = e.dirigeants || [];
  const dirigeant = dirigeants.find(d=>d.type_dirigeant==='personne physique') || dirigeants[0];
  const referentName = dirigeant
    ? (dirigeant.type_dirigeant==='personne morale' ? (dirigeant.denomination||'') : [dirigeant.prenoms, dirigeant.nom].filter(Boolean).join(' '))
      + (dirigeant.qualite ? ' ('+dirigeant.qualite+')' : '')
    : '';

  const d=document.getElementById('m-denomination'), s=document.getElementById('m-siret'), n=document.getElementById('m-siren');
  const a=document.getElementById('m-adresse'), v=document.getElementById('m-ville'), pays=document.getElementById('m-pays');
  const fj=document.getElementById('m-forme-juridique'), dc=document.getElementById('m-date-creation'), ef=document.getElementById('m-effectif');
  const ref=document.getElementById('m-referent');
  const lat_=document.getElementById('m-lat'), lng_=document.getElementById('m-lng');
  const box=document.getElementById('m-entreprise-suggestions');
  if(d) d.value = nom;
  if(s) s.value = siret;
  if(n) n.value = siren;
  if(a && street) a.value = street;
  if(v && city) v.value = city;
  if(pays) pays.value = 'France'; // le répertoire SIRENE ne couvre que la France
  if(fj) fj.value = formeJuridiqueLabel(e.nature_juridique);
  if(dc && e.date_creation) dc.value = e.date_creation;
  if(ef) ef.value = effectifLabel(e.tranche_effectif_salarie);
  if(ref && referentName && !ref.value.trim()) ref.value = referentName;
  if(lat!=null && lng!=null){ if(lat_)lat_.value=lat; if(lng_)lng_.value=lng; }
  if(box){ box.style.display='none'; box.innerHTML=''; }
}
// SIRET = SIREN (9 chiffres) + NIC (5 chiffres) de l'établissement — un
// SIRET saisi/collé à la main permet de déduire le SIREN sans le ressaisir.
function siretToSiren(){
  const s=document.getElementById('m-siret'), n=document.getElementById('m-siren');
  if(!s||!n) return;
  const digits = s.value.replace(/\s/g,'');
  if(/^\d{14}$/.test(digits)) n.value = digits.slice(0,9);
}

async function saveModal(id,isNew){
  const g=i=>(document.getElementById(i)||{value:''});
  // Adresse/ville requises seulement à la création — sur une fiche déjà
  // existante, les bloquer empêcherait de modifier un tout autre champ (ex :
  // type de module) tant qu'une adresse absente depuis l'import n'est pas
  // renseignée, un blocage silencieux repéré le 24/08/2026.
  if(isNew){
    if(!g('m-adresse').value.trim()){ flash('Adresse requise'); return; }
    if(!g('m-ville').value.trim()){ flash('Ville requise'); return; }
  }
  const ch={
    nom:g('m-nom').value.trim(),type:g('m-type').value,groupe:g('m-groupe').value,secteur:g('m-secteur').value,
    denominationSociale:g('m-denomination').value.trim(),siret:g('m-siret').value.trim(),siren:g('m-siren').value.trim(),
    formeJuridique:g('m-forme-juridique').value.trim(),dateCreationEntreprise:g('m-date-creation').value||null,effectifSalarie:g('m-effectif').value.trim(),
    adresse:g('m-adresse').value.trim(),ville:g('m-ville').value.trim(),pays:g('m-pays').value.trim(),
    // m-lat/m-lng : remplis par pickAdresse()/pickEntreprise() quand une
    // suggestion vient d'être choisie, vidés par clearMLatLng() dès que
    // adresse/ville est retapée à la main — sinon ils gardent la valeur déjà
    // en cache (géocodée précédemment par la vue Carte, cf. renderMapView),
    // jamais écrasés par un géocodage qui n'a pas eu lieu dans cette édition.
    lat:g('m-lat').value?+g('m-lat').value:null,lng:g('m-lng').value?+g('m-lng').value:null,
    etoiles:g('m-etoiles').value,referent:g('m-referent').value,
    email:g('m-email').value,tel:g('m-tel').value,site:g('m-site').value,
    pms:(g('m-pms').value==='__other__'?g('m-pms-other').value.trim():g('m-pms').value),messagerie:g('m-msg').value,danger:g('m-danger').value,commercialId:g('m-commercial').value||null,
    potentiel:+g('m-pot').value,modules:+g('m-mod').value,moduleSesame:['sesame','mix'].includes(g('m-mod-type').value),moduleTtlock:['ttlock','mix'].includes(g('m-mod-type').value),moduleOneway:g('m-mod-type').value==='oneway',nbAcces:+g('m-nbacces').value,mrr:g('m-mrr').value.trim()?+g('m-mrr').value:null,contrat:g('m-contrat').value,
    priorite:+g('m-prio').value,appel:g('m-appel').value,
    nfc:+g('m-nfc').value,qr:+g('m-qr').value,mobile:+g('m-mob').value,code:+g('m-code').value,
    webApp:g('m-webapp').checked,mobileV2:g('m-v2').checked,offline:g('m-offline').checked,
    checkin:g('m-checkin').checked,livret:g('m-livret').checked,gestionDemande:g('m-gd').checked,
    onbChoixChambres:g('m-onb-chambres').checked,onbOccupant:g('m-onb-occupant').checked,
    onbIdentite:g('m-onb-identite').checked,onbMenage:g('m-onb-menage').checked,
    espBoutique:g('m-esp-boutique').checked,espPoint:g('m-esp-point').checked,espEvenement:g('m-esp-evenement').checked,
    note:g('m-note').value
  };
  if(!ch.nom){flash('Le nom est obligatoire');return;}
  try{
    var r;
    if(isNew){
      r = await apiFetch('/wa/crmProspect/create', {method:'POST', body:JSON.stringify(ch)});
    } else {
      r = await apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify({id:id, ...ch})});
    }
    if(!r.ok) throw new Error('http '+r.status);
    var saved = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(isNew){ clients.push(saved); }
  else{ const ex=clients.find(c=>c.id===id); if(ex) Object.assign(ex, saved); }
  closeModal();updateBadges();flash('Fiche enregistrée');
  if(view==='fiche'&&curId===id)showFiche(id);else renderList();
}

async function deleteClient(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  if(!confirm('Supprimer définitivement la fiche "'+c.nom+'" ? Cette action est irréversible.'))return;
  try{
    var r = await apiFetch('/wa/crmProspect/delete', {method:'POST', body:JSON.stringify({id:id})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  clients=clients.filter(c=>c.id!==id);
  updateBadges();flash('Fiche supprimée');showList();
}

function pfRows(){

function pfTotal(c){ return (+c.mrr||0)+(+c.signe||0)+(+c.previsionnel||0); }

function renderPortefeuille(){
  const rows = pfRows();
