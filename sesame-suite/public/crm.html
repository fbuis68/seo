    </div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th>Client</th><th style="width:130px">MRR (€/mois)</th><th style="width:130px">Signé (€)</th><th style="width:140px">Prévisionnel (€)</th><th style="width:120px;text-align:right">Total (€)</th>
      </tr></thead>
      <tbody>${trs.length?trs:'<tr><td colspan="5" class="log-empty">Aucun client.</td></tr>'}</tbody>
      <tfoot><tr style="font-weight:600;border-top:2px solid var(--bd,#e3e3e3)">
        <td>Totaux</td>
        <td id="pf-sum-mrr">${fmtEUR(sums.mrr)}</td>
        <td id="pf-sum-signe">${fmtEUR(sums.signe)}</td>
        <td id="pf-sum-previsionnel">${fmtEUR(sums.previsionnel)}</td>

      </tr></tfoot>
    </table></div>`; });
}

// Recalcule les totaux (pied de tableau + colonne "Total" de chaque ligne)
// à partir des valeurs actuellement saisies, sans attendre la sauvegarde —
// pour que l'addition soit immédiate pendant la frappe.
function pfLive(){
  const sums = { mrr:0, signe:0, previsionnel:0 };
  document.querySelectorAll('#main .pf-in').forEach(inp=>{
    sums[inp.dataset.field] += parseFloat(inp.value)||0;
  });
  document.getElementById('pf-sum-mrr').textContent = fmtEUR(sums.mrr);
  document.getElementById('pf-sum-signe').textContent = fmtEUR(sums.signe);
  document.getElementById('pf-sum-previsionnel').textContent = fmtEUR(sums.previsionnel);
  document.getElementById('pf-sum-grand').textContent = fmtEUR(sums.mrr+sums.signe+sums.previsionnel);
  document.querySelectorAll('#main tbody tr').forEach(tr=>{
    const inputs = tr.querySelectorAll('.pf-in');
    if(!inputs.length) return;
    let rowTotal = 0;
    inputs.forEach(inp=>rowTotal+=parseFloat(inp.value)||0);
    const td = tr.querySelector('.pf-row-total');
    if(td) td.textContent = fmtEUR(rowTotal);
  });
}

async function pfSave(id, field, val){
  const v = val.trim()===''?null:+val;
  const c = clients.find(c=>c.id===id); if(c) c[field]=v;
  try{
    const r = await apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify({id, [field]:v})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur d\'enregistrement'); }
}

// TRÉSORERIE — Encaissement + Dépenses, vision annuelle
// ════════════════════════════════════════
const TR_MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const TR_MONTHS_SHORT = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

function showTresorerie(){
  view='treso';curId=null;setNav('n-treso');bc([{label:'Trésorerie '+cashYear}]);
  tba('');
  renderTresorerie();
}

function trRows(kind){ return cashLines.filter(l=>l.kind===kind).slice().sort((a,b)=>(a.mois??99)-(b.mois??99) || a.label.localeCompare(b.label,'fr')); }
function trSolde(){ return cashLines.find(l=>l.kind==='solde_depart'); }
/** Mois (0-11) auquel le solde d'ouverture est constaté — janvier par défaut si non saisi. */
function trSoldeMois(){ const s = trSolde(); return s && s.mois!=null ? s.mois : 0; }

// ── Fréquence : mensuel (tous les mois) / trimestriel (tous les 3 mois à
// partir d'un mois de départ) / ponctuel (un seul mois, pour un encaissement
// ou une dépense qui tombe une fois dans l'année plutôt que de se répéter) ──
function trFreqLabel(f){ return {mensuel:'Mensuel', trimestriel:'Trimestriel', ponctuel:'Ponctuel'}[f] || f || '—'; }
function trFreqsFor(kind){ return kind==='depense' ? ['mensuel','ponctuel'] : ['mensuel','trimestriel','ponctuel']; }
function trFreqOpts(kind, selected){
  return trFreqsFor(kind).map(f=>`<option value="${f}" ${selected===f?'selected':''}>${trFreqLabel(f)}</option>`).join('');
}
function trMonthOptsSingle(selected){
  return TR_MONTHS.map((m,i)=>`<option value="${i}" ${(+selected)===i?'selected':''}>${m}</option>`).join('');
}
/** Montant apporté par une ligne (ou la saisie globale) pour le mois `m` (0-11). */
function trMonthlyFromSpec(spec, m){
  const val = +spec.montant || 0;
  if(spec.frequence==='mensuel') return val;
  if(spec.frequence==='trimestriel'){ const start = spec.mois ?? 0; return ((m-start+12)%3===0) ? val : 0; }
  if(spec.frequence==='ponctuel') return (spec.mois ?? 0)===m ? val : 0;
  return 0;
}
/** Montant annualisé d'une ligne (ou la saisie globale), pour les totaux affichés. */
function trAnnualFromSpec(spec){
  const val = +spec.montant || 0;
  if(spec.frequence==='mensuel') return val*12;
  if(spec.frequence==='trimestriel') return val*4;
  if(spec.frequence==='ponctuel') return val;
  return 0;
}
// moisEncaissement (0-11) seul ne distingue pas deux affaires attendues le
// même mois d'années différentes (Octobre 2026 vs Octobre 2027) — une
// affaire créée avant l'ajout d'anneeEncaissement (25/08/2026) n'a pas
// cette valeur : on la traite comme l'année civile en cours au moment du
// calcul plutôt que de l'exclure, pour ne pas faire disparaître les
// affaires déjà saisies.
function dealEncaissementYear(d){
  return d.anneeEncaissement!=null ? d.anneeEncaissement : new Date().getFullYear();
}
// ── Pipeline des affaires (CrmDeal) — reporté automatiquement sur
// l'Encaissement, pondéré par la probabilité de l'affaire. Une affaire
// "Perdue" ou sans mois d'encaissement/montant ponctuel saisi ne compte
// pas. Filtré sur cashYear (année Trésorerie affichée) en plus du mois —
// sans ça, une affaire encaissée en Octobre d'une AUTRE année se retrouvait
// additionnée dans l'Octobre de l'année actuellement consultée. ──
function trDealsFor(m){
  return deals.filter(d=>d.stage!=='Perdu' && d.moisEncaissement===m && d.montantPonctuel && dealEncaissementYear(d)===cashYear);
}
function trDealsPipelineFor(m){
  return trDealsFor(m).reduce((s,d)=>s+(+d.montantPonctuel||0)*(+d.probability||0)/100, 0);
}
function trDealsPipelineAnnual(){
  let s=0; for(let m=0;m<12;m++) s+=trDealsPipelineFor(m); return s;
}
// Détail des affaires qui composent le Pipeline d'un mois — pour repérer
// d'un coup d'œil une affaire dont l'année n'a jamais été renseignée
// explicitement (traitée par défaut comme l'année civile en cours, cf.
// dealEncaissementYear) et qui se retrouve donc peut-être comptée dans le
// mauvais mois/la mauvaise année sans que ce soit visible autrement.
function openPipelineDetail(m){
  const rows = trDealsFor(m);
  const body = rows.length
    ? rows.map(d=>{
        const pondere = (+d.montantPonctuel||0)*(+d.probability||0)/100;
        const yearNote = d.anneeEncaissement!=null
          ? ''
          : ' <span style="color:var(--bad,#b23b2c)">— année non renseignée, traitée comme '+cashYear+'</span>';
        return '<div class="kpi-detail-row" onclick="closeModal();openDealModal(\''+d.id+'\')">'
          +'<div class="kpi-detail-main"><div class="kpi-detail-nom">'+esc(d.title)+'</div>'
          +'<div class="kpi-detail-meta" style="white-space:normal;overflow:visible;text-overflow:clip">'+esc(d.prospectNom||'')+' · '+fmtEUR(d.montantPonctuel)+' × '+(d.probability||0)+'%'+yearNote+'</div></div>'
          +'<span class="num" style="font-weight:600">'+fmtEUR(pondere)+'</span>'
          +'</div>';
      }).join('')
    : '<div style="padding:16px 4px;color:var(--mu);font-size:13px">Aucune affaire.</div>';
  document.getElementById('modal-ct').innerHTML =
    '<div class="modal-bg" onmousedown="this._downOnBackdrop=(event.target===this)" onclick="if(event.target===this&&this._downOnBackdrop)closeModal()">'
    +'<div class="modal-box" style="max-width:480px">'
    +'<div class="modal-head"><div style="font-size:16px;font-weight:500">Pipeline — '+TR_MONTHS[m]+' '+cashYear+'</div>'
    +'<button class="btn btn-ghost btn-icon" onclick="closeModal()" style="margin-left:auto">✕</button></div>'
    +'<div style="max-height:60vh;overflow-y:auto">'+body+'</div>'
    +'</div></div>';
}

/**
 * Lignes qui composent le montant "encaissement"/"dépense" d'un mois donné —
 * les lignes détaillées (CrmCashLine) si le mode "Détaillé" est actif, sinon
 * la saisie globale unique, dans les deux cas uniquement ce qui contribue
 * réellement au mois demandé (fréquence mensuelle, ou trimestrielle/
 * ponctuelle tombant sur ce mois précisément) — même logique que
 * trCategoryMonthlyBase, mais ligne par ligne plutôt qu'en somme.
 */
function trKindDetailRows(kind, m){
  if(cashSettings[kind+'Mode']==='global'){
    const montant = trMonthlyFromSpec({montant:cashSettings[kind+'Montant'], frequence:cashSettings[kind+'Frequence'], mois:cashSettings[kind+'Mois']}, m);
    return montant ? [{label:'Saisie globale', montant, frequence:cashSettings[kind+'Frequence']}] : [];
  }
  return trRows(kind)
    .map(r=>({label:r.label, montant:trMonthlyFromSpec(r,m), frequence:r.frequence}))
    .filter(r=>r.montant);
}

/**
 * Détail complet d'un mois — encaissements (dont MRR portefeuille),
 * dépenses et affaires pondérées qui composent les totaux affichés dans le
 * tableau récapitulatif de la Trésorerie, pour comprendre d'où vient
 * chaque chiffre sans devoir recouper plusieurs panneaux.
 */
function openMonthDetail(m){
  const mrr = trPortfolioMrrMonthly();
  const revenuRows = trKindDetailRows('revenu', m);
  const depenseRows = trKindDetailRows('depense', m);
  const dealRows = trDealsFor(m);

  function moneyRow(label, meta, montant, clickable){
    return '<div class="kpi-detail-row"'+(clickable?'':' style="cursor:default"')+(clickable||'')+'>'
      +'<div class="kpi-detail-main"><div class="kpi-detail-nom">'+esc(label)+'</div>'
      +(meta?'<div class="kpi-detail-meta">'+meta+'</div>':'')+'</div>'
      +'<span class="num" style="font-weight:600">'+fmtEUR(montant)+'</span>'
      +'</div>';
  }
  function section(title, colorVar, total, rowsHtml, emptyLabel){
    return '<div style="margin-bottom:18px">'
      +'<div class="tr-chart-title" style="display:flex;align-items:center;gap:8px;margin-bottom:2px">'
      +'<span class="tr-sw" style="background:'+colorVar+'"></span>'+title
      +'<span class="num" style="margin-left:auto;font-weight:600">'+fmtEUR(total)+'</span></div>'
      +(rowsHtml || '<div style="padding:10px 4px;color:var(--mu);font-size:12px">'+emptyLabel+'</div>');
  }

  const revenuTotal = revenuRows.reduce((s,r)=>s+r.montant,0) + mrr;
  const revenuHtml =
    (mrr>0 ? moneyRow('MRR portefeuille', 'Récurrent — somme des fiches clients (Portefeuille)', mrr) : '')
    + revenuRows.map(r=>moneyRow(r.label, trFreqLabel(r.frequence), r.montant)).join('');

  const depenseTotal = depenseRows.reduce((s,r)=>s+r.montant,0);
  const depenseHtml = depenseRows.map(r=>moneyRow(r.label, trFreqLabel(r.frequence), r.montant)).join('');

  const dealsTotal = dealRows.reduce((s,d)=>s+(+d.montantPonctuel||0)*(+d.probability||0)/100, 0);
  const dealsHtml = dealRows.map(d=>{
    const pondere = (+d.montantPonctuel||0)*(+d.probability||0)/100;
    return moneyRow(d.title, esc(d.prospectNom||'')+' · '+fmtEUR(d.montantPonctuel)+' × '+(d.probability||0)+'%', pondere,
      ' onclick="closeModal();openDealModal(\''+d.id+'\')"');
  }).join('');

  document.getElementById('modal-ct').innerHTML =
    '<div class="modal-bg" onmousedown="this._downOnBackdrop=(event.target===this)" onclick="if(event.target===this&&this._downOnBackdrop)closeModal()">'
    +'<div class="modal-box" style="max-width:560px">'
    +'<div class="modal-head"><div style="font-size:16px;font-weight:500">Détail — '+TR_MONTHS[m]+' '+cashYear+'</div>'
    +'<button class="btn btn-ghost btn-icon" onclick="closeModal()" style="margin-left:auto">✕</button></div>'
    +'<div style="max-height:65vh;overflow-y:auto;padding-top:6px">'
    +section('Encaissements', 'var(--tr-signe)', revenuTotal, revenuHtml, 'Aucun encaissement ce mois.')
    +section('Dépenses', 'var(--tr-depense)', depenseTotal, depenseHtml, 'Aucune dépense ce mois.')
    +section('Affaires pondérées (pipeline)', 'var(--tr-pipeline)', dealsTotal, dealsHtml, 'Aucune affaire ce mois.')
    +'</div></div></div>';
}

/** Montant de la catégorie hors pipeline des affaires — lignes CrmCashLine ou saisie globale uniquement. */
function trCategoryMonthlyBase(kind, m){
  return cashSettings[kind+'Mode']==='global'
    ? trMonthlyFromSpec({montant:cashSettings[kind+'Montant'], frequence:cashSettings[kind+'Frequence'], mois:cashSettings[kind+'Mois']}, m)
    : trRows(kind).reduce((s,r)=>s+trMonthlyFromSpec(r,m),0);
}
/** Total annuel de la catégorie, selon le mode actif (global ou somme des lignes détaillées). */
function trCategoryAnnual(kind){
  const base = cashSettings[kind+'Mode']==='global'
    ? trAnnualFromSpec({montant:cashSettings[kind+'Montant'], frequence:cashSettings[kind+'Frequence']})
    : trRows(kind).reduce((s,r)=>s+trAnnualFromSpec(r),0);
  return kind==='revenu' ? base + trDealsPipelineAnnual() : base;
}
/** Montant de la catégorie pour le mois `m`, selon le mode actif (inclut le pipeline des affaires pour "revenu"). */
function trCategoryMonthly(kind, m){
  const base = trCategoryMonthlyBase(kind, m);
  return kind==='revenu' ? base + trDealsPipelineFor(m) : base;
}

// MRR du portefeuille (somme de CrmProspect.mrr, tous types confondus —
// même somme que le pied de tableau Portefeuille) : un flux récurrent
// mensuel, indépendant des lignes CrmCashLine ("Signé" ci-dessous, saisies
// manuellement) et du pipeline pondéré des affaires — reporté
// automatiquement sur la Trésorerie (25/08/2026) plutôt que de rester
// cantonné au seul panneau Portefeuille comme jusqu'ici.
function trPortfolioMrrMonthly(){
  return clients.reduce((s,c)=>s+(+c.mrr||0), 0);
}

function trModeToggle(kind){
  const mode = cashSettings[kind+'Mode'];
  const btn = (v,lbl) => `<button type="button" onclick="trSetMode('${kind}','${v}')" style="padding:4px 10px;font-size:11px;font-weight:600;border:none;cursor:pointer;background:${mode===v?'var(--a)':'transparent'};color:${mode===v?'#fff':'var(--mu)'}">${lbl}</button>`;
  return `<div style="display:inline-flex;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;margin-left:12px">${btn('global','Global')}${btn('detail','Détaillé')}</div>`;
}

function trLineRow(r, kind){
  const showMois = r.frequence !== 'mensuel';

  return `
    <div class="tr-row">
      <div class="tr-row-top">
        <input class="ei tr-name" value="${esc(r.label)}" oninput="trEditLocal('${r.id}','label',this.value)" onchange="trSave('${r.id}','label',this.value)" placeholder="${kind==='revenu'?'Libellé (ex. Abonnements clients)':'Libellé (ex. Salaires)'}">
        <select class="tr-freq" title="Fréquence" onchange="trFreqChange('${r.id}','${kind}',this.value)">${trFreqOpts(kind, r.frequence)}</select>
        ${showMois?`<select class="tr-mois" title="${moisTitle}" onchange="trEditLocal('${r.id}','mois',+this.value);trSave('${r.id}','mois',+this.value)">${trMonthOptsSingle(r.mois)}</select>`:''}
        <input class="ei tr-amt num" type="number" step="10" value="${r.montant}" oninput="trEditLocal('${r.id}','montant',+this.value)" onchange="trSave('${r.id}','montant',+this.value)">
        <button class="ta-btn" title="Supprimer" onclick="trDelete('${r.id}')">✕</button>
      </div>

}

function trGlobalBlock(kind){
  const montant = cashSettings[kind+'Montant'], freq = cashSettings[kind+'Frequence'], mois = cashSettings[kind+'Mois'];
  const showMois = freq !== 'mensuel';
  const rows = trRows(kind);
  const linesSum = rows.reduce((s,r)=>s+trAnnualFromSpec(r),0);
  const globalAnnual = trAnnualFromSpec({montant, frequence:freq});
  const delta = linesSum - globalAnnual;
  return `
    <div class="tr-row">
      <div class="tr-row-top">
        <input class="ei tr-amt num" type="number" step="10" value="${montant}" oninput="trGlobalLocal('${kind}','Montant',+this.value)" onchange="trGlobalSave('${kind}','Montant',+this.value)" placeholder="Montant">
        <select class="tr-freq" title="Fréquence" onchange="trGlobalFreqChange('${kind}',this.value)">${trFreqOpts(kind, freq)}</select>
        ${showMois?`<select class="tr-mois" title="${freq==='trimestriel'?'Départ (tous les 3 mois)':'Mois'}" onchange="trGlobalLocal('${kind}','Mois',+this.value);trGlobalSave('${kind}','Mois',+this.value)">${trMonthOptsSingle(mois)}</select>`:''}
      </div>
    </div>
    ${rows.length ? `
      <div class="tr-caveat" style="margin-top:10px">Lignes détaillées existantes — modifiables ci-dessous (mensuel ou ponctuel par mois), sans compter dans le total "Global" ci-dessus tant que ce mode reste actif — somme annualisée <b class="num">${fmtEUR(linesSum)}</b>, écart avec la saisie globale : <b class="num" style="color:${Math.abs(delta)<1?'var(--good,#1a6b47)':'var(--bad,#b23b2c)'}">${delta>=0?'+':''}${fmtEUR(delta)}</b></div>
      <div class="tr-panel-body">${rows.map(r=>trLineRow(r, kind)).join('')}</div>
    ` : ''}`;
}

function trCategoryCard(kind, title, colorVar){
  const mode = cashSettings[kind+'Mode'];
  const rows = trRows(kind);
  const mrr = kind==='revenu' ? trPortfolioMrrMonthly()*12 : 0;
  const total = trCategoryAnnual(kind) + mrr;
  const body = mode==='global'
    ? trGlobalBlock(kind)
    : (rows.length===0 ? `<div class="log-empty">Aucune ligne. Ajoutez ${kind==='revenu'?'un encaissement':'une dépense'}.</div>` : rows.map(r=>trLineRow(r,kind)).join(''));
  const pipeline = kind==='revenu' ? trDealsPipelineAnnual() : 0;
  return `
    <div class="card" style="margin-bottom:0">
      <div class="card-head">
        <div class="ch-ico" style="background:${colorVar};border-color:${colorVar}"></div>
        <span class="ch-title">${title}</span>

      ${mode==='detail'?`<button class="add-row" onclick="trAdd('${kind}')">+ Ajouter une ligne</button>`:''}

      ${pipeline>0?`<div class="tr-caveat">dont <b class="num">${fmtEUR(pipeline)}</b> pondéré depuis les affaires en cours (montant ponctuel × probabilité, module Affaires) — reporté automatiquement, non éditable ici.</div>`:''}
    </div>`;
}

// Le solde d'ouverture est désormais constaté à un mois choisi (pas
// forcément janvier) — la trésorerie cumulée n'a pas de sens avant ce
// mois-là (cum=null, affiché "—"/absent des graphes), et démarre au solde
// saisi + le net du mois de constatation lui-même.
function trComputeMonthly(){
  const solde = trSolde();
  const soldeMois = trSoldeMois();
  const soldeMontant = solde ? (+solde.montant||0) : 0;
  let cum = 0;
  const months = [];
  for(let m=0;m<12;m++){
    // Avant le mois du solde d'ouverture, on ignore aussi les encaissements
    // et dépenses eux-mêmes (pas seulement la trésorerie cumulée) — les
    // montrer fausserait le graphique "Encaissement vs dépenses" en
    // affichant des mois qui ne font pas partie de la période suivie.
    const beforeSolde = m < soldeMois;
    const mrr = beforeSolde ? 0 : trPortfolioMrrMonthly();
    const revenuBase = beforeSolde ? 0 : trCategoryMonthlyBase('revenu', m);
    const pipeline = beforeSolde ? 0 : trDealsPipelineFor(m);
    const revenu = mrr + revenuBase + pipeline;
    const depenses = beforeSolde ? 0 : trCategoryMonthly('depense', m);
    const net = revenu - depenses;
    let curCum;
    if(beforeSolde) curCum = null;
    else if(m === soldeMois){ cum = soldeMontant + net; curCum = cum; }
    else { cum += net; curCum = cum; }
    months.push({ m, revenu, mrr, revenuBase, pipeline, depenses, net, cum: curCum });
  }
  return months;
}

function trRenderCharts(){
  const months = trComputeMonthly();
  trRenderBarChart(months);
  trRenderLineChart(months);
  trRenderMonthTable(months);

  // Totaux annuels (puces "Recettes/Dépenses (année)" + en-tête des deux
  // cartes catégorie) — recalculés et réinjectés ici à chaque frappe/édition
  // d'une ligne (cf. trEditLocal), sans passer par un rendu complet de la
  // page (qui ferait perdre le focus du champ en cours d'édition). Avant ce
  // correctif, ces totaux restaient figés à leur valeur du dernier rendu
  // complet — une dépense ajoutée/modifiée semblait alors ne "pas
  // apparaître", alors qu'elle était bien enregistrée (visible dans le
  // graphique et le tableau mensuel juste en dessous, déjà mis à jour ici).
  const revenuAnnuel = trCategoryAnnual('revenu') + trPortfolioMrrMonthly()*12;
  const depenseAnnuel = trCategoryAnnual('depense');
  ['tr-chip-revenu','tr-cardtotal-revenu'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.textContent = fmtEUR(revenuAnnuel) + (id==='tr-cardtotal-revenu'?'/an':'');
  });
  ['tr-chip-depense','tr-cardtotal-depense'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.textContent = fmtEUR(depenseAnnuel) + (id==='tr-cardtotal-depense'?'/an':'');
  });

  const last = months[months.length-1];
  const heroEl = document.getElementById('tr-hero-balance');
  if(!heroEl) return;
  heroEl.textContent = fmtEUR(Math.abs(last.cum)) .replace(/^/, last.cum<0?'−':'');
  heroEl.className = 'tr-hero-val num ' + (last.cum<0?'neg':'pos');
  const solde = trSolde(); const startBalance = solde?solde.montant:0;
  document.getElementById('tr-hero-sub-note').textContent = (last.cum>=startBalance?'↑ ':'↓ ') + 'depuis ' + fmtEUR(startBalance) + ' au 1er '+TR_MONTHS[trSoldeMois()];
}

function trRenderBarChart(months){
  const svg = document.getElementById('tr-chart-bars'); if(!svg) return;
  const W = 940, H = 260, padL = 8, padR = 8, padT = 18, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const groupW = plotW / 12;
  const barW = Math.min(30, groupW*0.30);
  const gap = 6;
  const maxVal = Math.max(1, ...months.map(mo=>Math.max(mo.revenu, mo.depenses)));
  const scale = v => (v/maxVal) * plotH;

  let s = '';
  months.forEach((mo,i)=>{
    const cx = padL + groupW*i + groupW/2;
    const baseY = padT + plotH;
    const xR = cx - gap/2 - barW;
    // Recettes empilées : MRR portefeuille (vert, le socle récurrent) en
    // bas, lignes/saisie globale "Signé" (bleu) au milieu, pipeline pondéré
    // des affaires (doré) au sommet — pour distinguer visuellement le
    // récurrent acquis, le ponctuel déjà signé, et ce qui dépend encore
    // d'une probabilité de closing.
    const hMrr = scale(mo.mrr);
    const hBase = scale(mo.revenuBase);
    const hPipe = scale(mo.pipeline);
    if(hMrr>0) s += `<rect x="${xR}" y="${baseY-hMrr}" width="${barW}" height="${Math.max(hMrr-1.5,0)}" rx="2.5" fill="var(--tr-mrr)"></rect>`;
    if(hBase>0) s += `<rect x="${xR}" y="${baseY-hMrr-hBase}" width="${barW}" height="${Math.max(hBase-1.5,0)}" rx="2.5" fill="var(--tr-signe)"></rect>`;
    if(hPipe>0) s += `<rect x="${xR}" y="${baseY-hMrr-hBase-hPipe}" width="${barW}" height="${Math.max(hPipe-1.5,0)}" rx="2.5" fill="var(--tr-pipeline)"></rect>`;
    if(hMrr+hBase+hPipe>0){
      s += `<text class="tr-bar-lbl" x="${xR+barW/2}" y="${baseY-hMrr-hBase-hPipe-5}">${Math.round(mo.revenu/1000)}k</text>`;
    }
    const xD = cx + gap/2;
    const hD = scale(mo.depenses);
    if(hD>0){ s += `<rect x="${xD}" y="${baseY-hD}" width="${barW}" height="${Math.max(hD-1.5,0)}" rx="2.5" fill="var(--tr-depense)"></rect>`; }
    s += `<rect x="${cx-groupW/2}" y="${padT}" width="${groupW}" height="${plotH}" fill="transparent" class="tr-hitgroup" data-month="${i}"></rect>`;
    s += `<text class="tr-month-lbl" x="${cx}" y="${H-10}">${TR_MONTHS_SHORT[i]}</text>`;
  });
  s += `<line class="tr-grid-line" x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}"></line>`;
  svg.innerHTML = s;

  const tt = document.getElementById('tr-tt-bars');
  svg.querySelectorAll('.tr-hitgroup').forEach(el=>{
    el.addEventListener('mousemove', (ev)=>{
      const i = +el.dataset.month, mo = months[i];
      tt.innerHTML = `<b>${TR_MONTHS[i]}</b>`+
        (mo.mrr>0?`<div class="tr-tt-row"><span>MRR</span><span class="num">${fmtEUR(mo.mrr)}</span></div>`:'')+
        `<div class="tr-tt-row"><span>Signé</span><span class="num">${fmtEUR(mo.revenuBase)}</span></div>`+
        (mo.pipeline>0?`<div class="tr-tt-row"><span>Pipeline (Affaires)</span><span class="num">${fmtEUR(mo.pipeline)}</span></div>`:'')+
        `<div class="tr-tt-row"><span>Dépenses</span><span class="num">−${fmtEUR(mo.depenses)}</span></div>`+
        `<div class="tr-tt-row" style="border-top:1px solid rgba(255,255,255,.2);margin-top:3px;padding-top:3px"><span>Net</span><span class="num">${(mo.net>=0?'+':'−')+fmtEUR(Math.abs(mo.net))}</span></div>`;
      trPositionTooltip(tt, ev, svg);
      tt.style.opacity = 1;
    });
    el.addEventListener('mouseleave', ()=>{ tt.style.opacity = 0; });
  });
}

// Les mois avant le mois du solde d'ouverture n'ont pas de trésorerie
// cumulée connue (mo.cum===null) — la courbe ne démarre qu'à partir de là,
// mais les 12 mois restent affichés en abscisse pour le repère visuel.
function trRenderLineChart(months){
  const svg = document.getElementById('tr-chart-line'); if(!svg) return;
  const W = 940, H = 200, padL = 40, padR = 12, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const defined = months.filter(mo=>mo.cum!=null);
  const vals = defined.map(mo=>mo.cum);
  const minV = Math.min(0, ...(vals.length?vals:[0])), maxV = Math.max(0, ...(vals.length?vals:[0]));
  const range = (maxV - minV) || 1;
  const yFor = v => padT + plotH - ((v-minV)/range)*plotH;
  const xFor = i => padL + (plotW/(months.length-1))*i;
  const zeroY = yFor(0);
  let pts = defined.map(mo=>[xFor(mo.m), yFor(mo.cum)]);
  let linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

  function areaPath(filterAbove){
    let d = ''; let open=false;
    for(let i=0;i<pts.length;i++){
      const above = defined[i].cum >= 0;
      if(above===filterAbove){
        if(!open){ d += `M ${pts[i][0].toFixed(1)},${zeroY.toFixed(1)} L ${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} `; open=true; }
        else d += `L ${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} `;
      } else if(open){ d += `L ${pts[i-1][0].toFixed(1)},${zeroY.toFixed(1)} Z `; open=false; }
    }
    if(open) d += `L ${pts[pts.length-1][0].toFixed(1)},${zeroY.toFixed(1)} Z `;
    return d;
  }

  let s = '';
  s += `<defs>
    <linearGradient id="trGPos" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--good,#1a6b47)" stop-opacity="0.22"/><stop offset="100%" stop-color="var(--good,#1a6b47)" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="trGNeg" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="var(--bad,#b23b2c)" stop-opacity="0.22"/><stop offset="100%" stop-color="var(--bad,#b23b2c)" stop-opacity="0.02"/></linearGradient>
  </defs>`;
  s += `<line class="tr-zero-line" x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}"></line>`;
  s += `<text class="tr-axis-lbl" x="${padL-6}" y="${zeroY+3}" text-anchor="end">0</text>`;
  s += `<text class="tr-axis-lbl" x="${padL-6}" y="${padT+8}" text-anchor="end">${Math.round(maxV/1000)}k</text>`;
  s += `<text class="tr-axis-lbl" x="${padL-6}" y="${padT+plotH}" text-anchor="end">${Math.round(minV/1000)}k</text>`;
  s += `<path d="${areaPath(true)}" fill="url(#trGPos)"></path>`;
  s += `<path d="${areaPath(false)}" fill="url(#trGNeg)"></path>`;
  s += `<path d="${linePath}" fill="none" stroke="var(--tx)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>`;
  pts.forEach((p,idx)=>{
    const mo = defined[idx];
    const color = mo.cum>=0 ? 'var(--good,#1a6b47)' : 'var(--bad,#b23b2c)';
    s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${color}" stroke="var(--card)" stroke-width="1.4"></circle>`;
    s += `<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="transparent" class="tr-hitpt" data-month="${mo.m}"></circle>`;
  });
  months.forEach((mo,i)=>{
    s += `<text class="tr-month-lbl" x="${xFor(i)}" y="${H-8}">${TR_MONTHS_SHORT[i]}</text>`;
  });
  if(pts.length){
    const lastP = pts[pts.length-1], lastMo = defined[defined.length-1];
    const lastLblY = Math.max(padT+10, Math.min(padT+plotH-4, lastP[1]-9));
    s += `<text class="tr-bar-lbl" x="${Math.max(lastP[0]-2, padL+40)}" y="${lastLblY}" text-anchor="end" font-weight="600">${fmtEUR(lastMo.cum)}</text>`;
  }
  svg.innerHTML = s;

  const tt = document.getElementById('tr-tt-line');
  svg.querySelectorAll('.tr-hitpt').forEach(el=>{
    el.addEventListener('mousemove', (ev)=>{
      const i = +el.dataset.month, mo = months[i];
      tt.innerHTML = `<b>${TR_MONTHS[i]}</b>`+
        `<div class="tr-tt-row"><span>Net du mois</span><span class="num">${(mo.net>=0?'+':'−')+fmtEUR(Math.abs(mo.net))}</span></div>`+
        `<div class="tr-tt-row"><span>Trésorerie cumulée</span><span class="num">${fmtEUR(mo.cum)}</span></div>`;
      trPositionTooltip(tt, ev, svg);
      tt.style.opacity = 1;
    });
    el.addEventListener('mouseleave', ()=>{ tt.style.opacity = 0; });
  });
}

function trPositionTooltip(tt, ev, svg){
  const wrapRect = svg.closest('.tr-chart-wrap').getBoundingClientRect();
  tt.style.left = (ev.clientX - wrapRect.left) + 'px';
  tt.style.top = (ev.clientY - wrapRect.top - 14) + 'px';
}

// Cellule "—" (période non suivie) ou "–" (valeur nulle, ex. pas de
// pipeline ce mois-là) plutôt qu'un 0,00 € qui alourdirait la lecture du
// tableau — même convention que la maquette de référence.
function trCell(v, before){
  if(before) return '—';
  return v ? fmtEUR(v) : '–';
}
function trRenderMonthTable(months){
  const body = document.getElementById('tr-month-tbody'); if(!body) return;
  body.innerHTML = months.map(mo=>{
    const before = mo.cum==null; // avant le mois du solde d'ouverture — période non suivie
    return `
    <tr${before?' style="opacity:.45"':''}>
      <td${before?'':' style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted" onclick="openMonthDetail('+mo.m+')" title="Détail du mois — encaissements, dépenses, affaires pondérées"'}>${TR_MONTHS[mo.m]}</td>
      <td class="num" style="text-align:right">${trCell(mo.mrr, before)}</td>
      <td class="num" style="text-align:right">${trCell(mo.revenuBase, before)}</td>
      <td class="num" style="text-align:right${!before&&mo.pipeline?';cursor:pointer;text-decoration:underline;text-decoration-style:dotted' : ''}" ${!before&&mo.pipeline?'onclick="openPipelineDetail('+mo.m+')" title="Voir les affaires qui composent ce pipeline"':''}>${trCell(mo.pipeline, before)}</td>
      <td class="num" style="text-align:right;font-weight:500">${trCell(mo.revenu, before)}</td>
      <td class="num" style="text-align:right">${trCell(mo.depenses, before)}</td>
      <td class="num" style="text-align:right;font-weight:500;color:${before?'inherit':(mo.net>=0?'var(--good,#1a6b47)':'var(--bad,#b23b2c)')}">${before?'—':(mo.net>=0?'+':'−')+fmtEUR(Math.abs(mo.net))}</td>
      <td class="num" style="text-align:right;font-weight:600;${!before&&mo.cum<0?'color:var(--bad,#b23b2c)':''}">${before?'—':fmtEUR(mo.cum)}</td>
    </tr>`;
  }).join('');
}

// ── Lignes détaillées Encaissement/Dépense (CrmCashLine) ──
function trEditLocal(id, field, value){
  const row = cashLines.find(r=>r.id===id); if(!row) return;
  row[field] = value;
  trRenderCharts();
  if(field==='mois') renderTresorerie();
}
async function trSave(id, field, value){
  try{
    const r = await apiFetch('/wa/crmCashLine/update', {method:'POST', body:JSON.stringify({id, [field]:value})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur d\'enregistrement'); }
}
async function trFreqChange(id, kind, freq){
  const row = cashLines.find(r=>r.id===id); if(!row) return;
  row.frequence = freq;
  if(freq==='mensuel') row.mois = null;
  else if(row.mois==null) row.mois = 0;
  renderTresorerie();
  try{
    const r = await apiFetch('/wa/crmCashLine/update', {method:'POST', body:JSON.stringify({id, frequence:freq, mois:row.mois})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur d\'enregistrement'); }
}
async function trAdd(kind){
  const defaults = { montant:0, frequence:'mensuel', mois:null };
  const label = kind==='revenu' ? 'Nouvel encaissement' : 'Nouvelle dépense';
  try{
    const r = await apiFetch('/wa/crmCashLine/create', {method:'POST', body:JSON.stringify({annee:cashYear, kind, label, ...defaults})});
    if(!r.ok) throw new Error('http '+r.status);
    const row = await r.json();
    cashLines.push(row);
  }catch(e){ flash('Erreur de création'); return; }
  renderTresorerie();
}
async function trDelete(id){
  cashLines = cashLines.filter(r=>r.id!==id);
  renderTresorerie();
  try{
    const r = await apiFetch('/wa/crmCashLine/delete', {method:'POST', body:JSON.stringify({id})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); }
}

var dealViewMode = 'kanban'; // kanban | monthly
var dealMonthlyLayout = 'list'; // list | kanban — sous-bascule de la vue "monthly"
// Funnel des affaires en cours (renderDealFunnel) — masquable pour laisser
// plus de place au Kanban en dessous, préférence mémorisée par navigateur
// (comme le thème d'interface, cf. SESAME_UI_THEME) plutôt que remise à
// zéro à chaque rechargement.
var dealFunnelVisible = (function(){ try{ return localStorage.getItem('SESAME_CRM_FUNNEL_HIDDEN')!=='1'; }catch(e){ return true; } })();

function dealSetViewMode(v){ dealViewMode = v; renderAffaires(); }
function dealSetMonthlyLayout(v){ dealMonthlyLayout = v; renderAffaires(); }
function dealToggleFunnel(){

  try{ localStorage.setItem('SESAME_CRM_FUNNEL_HIDDEN', dealFunnelVisible?'0':'1'); }catch(e){}

// Détail montant d'une affaire, sur les cartes Kanban — montant ponctuel,
// montant pondéré (ponctuel × probabilité, même convention que le pipeline
// Trésorerie, cf. trDealsPipelineFor) et MRR (montant récurrent mensuel,
// champ "amount"), chacun affiché seulement s'il est renseigné.
function dealCardAmounts(d){
  const pondere = (+d.montantPonctuel||0)*(+d.probability||0)/100;
  const rows = [];
  if(d.montantPonctuel) rows.push(['Ponctuel', fmtEUR(d.montantPonctuel)]);
  if(pondere) rows.push(['Pondéré', fmtEUR(pondere)]);
  if(d.amount) rows.push(['MRR', fmtEUR(d.amount)+'/mois']);
  if(!rows.length) return '<span class="kanban-card-amount">—</span>';
  return '<div style="display:flex;flex-direction:column;gap:1px">' + rows.map(([l,v])=>
    `<div style="font-size:10px;line-height:1.4;white-space:nowrap"><span style="color:var(--mu)">${l} </span><b class="num" style="color:var(--tx);font-weight:600">${v}</b></div>`
  ).join('') + '</div>';
}

function renderAffaires(){
  const filtered = dealFilterCommercial ? deals.filter(d=>d.commercialId===dealFilterCommercial) : deals;
  const filterBar = `<div class="list-toolbar" style="margin-bottom:14px">
    <select class="lsel" onchange="dealFilterCommercial=this.value;renderAffaires()">
      <option value="">Tous commerciaux</option>
      ${COMMERCIALS.map(c=>`<option value="${c.id}" ${dealFilterCommercial===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
    </select>
    <div style="display:flex;border:1px solid var(--bdr);border-radius:8px;overflow:hidden">
      <button onclick="dealSetViewMode('kanban')" style="border:none;cursor:pointer;padding:6px 12px;font-size:12px;font-weight:500;background:${dealViewMode==='kanban'?'var(--a)':'var(--card)'};color:${dealViewMode==='kanban'?'#fff':'var(--tx)'}">Kanban (étapes)</button>
      <button onclick="dealSetViewMode('monthly')" style="border:none;cursor:pointer;padding:6px 12px;font-size:12px;font-weight:500;background:${dealViewMode==='monthly'?'var(--a)':'var(--card)'};color:${dealViewMode==='monthly'?'#fff':'var(--tx)'}">Mois par mois</button>
    </div>
    ${dealViewMode==='monthly'?`<div style="display:flex;border:1px solid var(--bdr);border-radius:8px;overflow:hidden">
      <button onclick="dealSetMonthlyLayout('list')" style="border:none;cursor:pointer;padding:6px 12px;font-size:12px;font-weight:500;background:${dealMonthlyLayout==='list'?'var(--tx)':'var(--card)'};color:${dealMonthlyLayout==='list'?'var(--card)':'var(--tx)'}">Liste</button>
      <button onclick="dealSetMonthlyLayout('kanban')" style="border:none;cursor:pointer;padding:6px 12px;font-size:12px;font-weight:500;background:${dealMonthlyLayout==='kanban'?'var(--tx)':'var(--card)'};color:${dealMonthlyLayout==='kanban'?'var(--card)':'var(--tx)'}">Kanban</button>
    </div>`:''}
    ${dealViewMode==='kanban'?`<button class="btn btn-ghost btn-sm" onclick="dealToggleFunnel()" title="${dealFunnelVisible?'Masquer le funnel pour laisser plus de place au Kanban':'Afficher le funnel des affaires en cours'}">${dealFunnelVisible?'▲ Masquer le funnel':'▼ Afficher le funnel'}</button>`:''}
    <span class="count-lbl">${filtered.length} affaire${filtered.length>1?'s':''}</span>
  </div>`;

  if(dealViewMode==='monthly'){
    const body = dealMonthlyLayout==='kanban' ? renderAffairesMonthlyKanban(filtered) : renderAffairesMonthly(filtered);
    document.getElementById('main').innerHTML = filterBar + body;
    return;
  }

  const cols = DEAL_STAGES.map(stage=>{
    const items = filtered.filter(d=>d.stage===stage);
    const total = items.reduce((s,d)=>s+(d.amount||0),0);
    return `<div class="kanban-col">
      <div class="kanban-col-head"><span class="tag ${STAGE_TAG[stage]}" style="font-size:10px">${stage}</span><span class="kanban-col-total">${items.length} · ${fmtEUR(total)}</span></div>
      <div class="kanban-cards">
        ${items.length===0?'<div class="kanban-empty">—</div>':items.map(d=>`
          <div class="kanban-card" onclick="openDealModal('${d.id}')">
            <div class="kanban-card-title">${esc(d.title)}</div>
            <div class="kanban-card-client">${esc(d.prospectNom)}</div>
            <div class="kanban-card-foot">
              ${dealCardAmounts(d)}
              ${d.commercialName?`<span class="commercial-chip" title="${esc(d.commercialName)}">${ini(d.commercialName)}</span>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML = filterBar + (dealFunnelVisible?renderDealFunnel(filtered):'') + `<div class="kanban-wrap">${cols}</div>`;
}

// ── Vue "Mois par mois" — regroupe les affaires par mois de leur date de
// clôture prévue (closeDate), pour visualiser le pipeline commercial dans
// le temps plutôt que par étape. "Pondéré" = montant ponctuel × probabilité,
// même convention que le "Pipeline pondéré (Affaires)" de la Trésorerie
// (cf. trDealsPipelineFor) — seul le regroupement diffère : ici par mois de
// clôture prévue (closeDate), là-bas par mois d'encaissement
// (moisEncaissement). Le montant mensuel récurrent (amount) reste affiché
// par affaire, mais n'entre plus dans ce total pondéré.
function dealMonthKey(d){
  if(!d.closeDate) return null;
  const dt = new Date(d.closeDate);
  if(isNaN(dt.getTime())) return null;
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
}

function renderAffairesMonthly(filtered){
  const withDate = filtered.filter(d=>dealMonthKey(d));
  const noDate = filtered.filter(d=>!dealMonthKey(d));
  if(!withDate.length && !noDate.length){
    return '<div style="padding:30px;text-align:center;color:var(--mu);font-size:13px">Aucune affaire.</div>';
  }

  const groups = {};
  withDate.forEach(d=>{ const k=dealMonthKey(d); (groups[k]=groups[k]||[]).push(d); });
  const keys = Object.keys(groups).sort();

  const monthBlocks = keys.map(k=>{
    const [y,m] = k.split('-');
    const items = groups[k].slice().sort((a,b)=>(b.amount||0)-(a.amount||0));
    const live = items.filter(d=>d.stage!=='Perdu');
    const totalPondere = live.reduce((s,d)=>s+(d.montantPonctuel||0)*(d.probability||0)/100,0);
    return `<div style="border:1px solid var(--bdr);border-radius:10px;margin-bottom:14px;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--al);border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:6px">
        <div style="font-weight:600">${TR_MONTHS[+m-1]} ${y}</div>
        <div style="font-size:12px;color:var(--mu)">${items.length} affaire${items.length>1?'s':''} · pondéré ${fmtEUR(totalPondere)}</div>
      </div>
      <div>
        ${items.map(d=>`
          <div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--div);cursor:pointer" onclick="openDealModal('${d.id}')">
            <span class="tag ${STAGE_TAG[d.stage]}" style="font-size:10px;flex:0 0 auto">${d.stage}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.title)}</div>
              <div style="font-size:11px;color:var(--mu)">${esc(d.prospectNom)}${d.commercialName?' · '+esc(d.commercialName):''}</div>
            </div>
            <div style="text-align:right;font-size:12px;flex:0 0 auto">
              ${d.amount?`<div>MRR ${fmtEUR(d.amount)}</div>`:''}
              ${d.montantPonctuel?`<div style="color:var(--mu)">Ponctuel ${fmtEUR(d.montantPonctuel)}</div>`:''}
              ${d.montantPonctuel?`<div style="color:var(--mu)">Pondéré ${fmtEUR((+d.montantPonctuel||0)*(+d.probability||0)/100)} (${d.probability||0}%)</div>`:`<div style="color:var(--mu)">${d.probability||0}%</div>`}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  const noDateBlock = noDate.length ? `<div style="border:1px dashed var(--bdr);border-radius:10px;padding:10px 14px;color:var(--mu);font-size:12px">
    <b>${noDate.length} affaire${noDate.length>1?'s':''} sans date de clôture prévue</b> — ${noDate.map(d=>esc(d.title)).join(', ')}
  </div>` : '';

  return monthBlocks + noDateBlock;
}

// ── Même regroupement que renderAffairesMonthly, mais en colonnes (une par
// mois) plutôt qu'en blocs empilés — pour glisser d'un coup d'œil d'un mois
// à l'autre comme sur le Kanban par étape.
function renderAffairesMonthlyKanban(filtered){
  const withDate = filtered.filter(d=>dealMonthKey(d));
  const noDate = filtered.filter(d=>!dealMonthKey(d));
  if(!withDate.length && !noDate.length){
    return '<div style="padding:30px;text-align:center;color:var(--mu);font-size:13px">Aucune affaire.</div>';
  }

  const groups = {};
  withDate.forEach(d=>{ const k=dealMonthKey(d); (groups[k]=groups[k]||[]).push(d); });
  const keys = Object.keys(groups).sort();

  const monthCol = (label, items) => {
    const live = items.filter(d=>d.stage!=='Perdu');
    // Pondéré = montant ponctuel × probabilité (cf. commentaire au-dessus
    // de renderAffairesMonthly — même convention partout dans ce module).
    const totalPondere = live.reduce((s,d)=>s+(d.montantPonctuel||0)*(d.probability||0)/100,0);
    return `<div class="kanban-col">
      <div class="kanban-col-head"><span>${label}</span><span class="kanban-col-total">${items.length} · ${fmtEUR(totalPondere)} pond.</span></div>
      <div class="kanban-cards">
        ${items.length===0?'<div class="kanban-empty">—</div>':items.slice().sort((a,b)=>(b.amount||0)-(a.amount||0)).map(d=>`
          <div class="kanban-card" onclick="openDealModal('${d.id}')">
            <div style="margin-bottom:4px"><span class="tag ${STAGE_TAG[d.stage]}" style="font-size:9px">${d.stage}</span></div>
            <div class="kanban-card-title">${esc(d.title)}</div>
            <div class="kanban-card-client">${esc(d.prospectNom)}</div>
            <div class="kanban-card-foot">
              ${dealCardAmounts(d)}
              ${d.commercialName?`<span class="commercial-chip" title="${esc(d.commercialName)}">${ini(d.commercialName)}</span>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  };

  const cols = keys.map(k=>{
    const [y,m] = k.split('-');
    return monthCol(TR_MONTHS_SHORT[+m-1]+' '+y, groups[k]);
  }).join('') + (noDate.length ? monthCol('Sans date', noDate) : '');

  return `<div class="kanban-wrap">${cols}</div>`;
}

// ── Funnel des affaires en cours, par étape (hors "Perdu", qui est une
// sortie du pipeline plutôt qu'une étape de progression) — respecte le
// filtre commercial actif de la vue. Bandes en dégradé de couleurs
// catégorielles distinctes (une par étape, mêmes teintes que les vars
// --dch-* déjà utilisées ailleurs pour les points d'accès — validées
// anti-daltonisme via le script dataviz/validate_palette.js), largeur
// décroissante par construction (un funnel ne s'élargit jamais) même si les
// effectifs réels ne le sont pas strictement. Taux de conversion affiché
// entre deux étapes consécutives — photo instantanée de la répartition
// actuelle, pas un suivi de cohorte dans le temps (aucun historique des
// transitions d'étape n'est conservé).
const DEAL_FUNNEL_COLORS = ['var(--dch-nfc)','var(--dch-code)','var(--dch-violet)','var(--dch-mobile)','var(--dch-qr)'];

function renderDealFunnel(filtered){
  const stages = DEAL_STAGES.filter(s=>s!=='Perdu');
  const counts = stages.map(s=>filtered.filter(d=>d.stage===s).length);
  const max = Math.max(1, ...counts);

  const widths = counts.map(n=>Math.max(22, Math.round(n/max*100)));
  for(let i=1;i<widths.length;i++) widths[i] = Math.min(widths[i], widths[i-1]);

  const bandH = 50, gap = 3, halfMax = 168, cx = 190;
  const svgH = widths.length*bandH + (widths.length-1)*gap;
  const bands = widths.map((w,i)=>{
    const topW = i===0 ? 2*halfMax : (widths[i-1]/100*2*halfMax);
    const botW = w/100*2*halfMax;
    const y0 = i*(bandH+gap), y1 = y0+bandH;
    const tl = cx-topW/2, tr = cx+topW/2, bl = cx-botW/2, br = cx+botW/2;
    return `<polygon points="${tl},${y0} ${tr},${y0} ${br},${y1} ${bl},${y1}" fill="${DEAL_FUNNEL_COLORS[i]}"/>`
      + `<text x="${cx}" y="${(y0+y1)/2+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">${i+1}</text>`;
  }).join('');

  const rows = stages.map((s,i)=>{
    const n = counts[i];
    const conv = i>0 && counts[i-1]>0 ? Math.round(n/counts[i-1]*100) : null;
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;${i<stages.length-1?'border-bottom:1px solid var(--div)':''}">
      <span style="width:22px;height:22px;border-radius:50%;background:${DEAL_FUNNEL_COLORS[i]};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${s}</div>
        <div style="font-size:11px;color:var(--mu)">${n} affaire${n>1?'s':''}${conv!=null?` · ${conv}% depuis l'étape précédente`:''}</div>
      </div>
    </div>`;
  }).join('');

  return `<div style="border:1px solid var(--bdr);border-radius:10px;padding:16px;margin-bottom:16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center">
    <div style="flex:1;min-width:220px">
      <div style="font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Funnel des affaires en cours</div>
      ${rows}
    </div>
    <svg width="380" height="${svgH}" viewBox="0 0 380 ${svgH}" style="flex-shrink:0">${bands}</svg>
  </div>`;
}

async function saveDeal(id,isNew){
  captureDealDraft();
  const md = DEAL_DRAFT;
  const prospectId = (document.getElementById('d-prospect')||{value:md.prospectId}).value;
  if(!md.title || !md.title.trim()){ flash('Le titre est obligatoire'); return; }
  if(!prospectId){ flash('Sélectionnez un client'); return; }
  const body = {
    prospectId, commercialId: md.commercialId||null, title: md.title.trim(), stage: md.stage,
    amount: +md.amount||0, probability: +md.probability||0, closeDate: md.closeDate||null, lostReason: md.lostReason||'',
    montantPonctuel: md.montantPonctuel==null?null:+md.montantPonctuel, moisEncaissement: md.moisEncaissement==null?null:+md.moisEncaissement,
    anneeEncaissement: md.anneeEncaissement==null?null:+md.anneeEncaissement
  };
  try{
    var r = isNew
      ? await apiFetch('/wa/crmDeal/create', {method:'POST', body:JSON.stringify(body)})
      : await apiFetch('/wa/crmDeal/update', {method:'POST', body:JSON.stringify({id:id, ...body})});
    if(!r.ok) throw new Error('http '+r.status);
    var saved = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(isNew){ deals.push(saved); } else { const ex=deals.find(d=>d.id===id); if(ex) Object.assign(ex, saved); }
  closeModal(); flash('Affaire enregistrée');
  if(view==='affaires') renderAffaires();
  // Toujours réafficher la fiche courante (pas seulement si elle correspond
  // au client de l'affaire) : une réattribution à un autre client doit aussi
  // faire disparaître l'affaire de la fiche qu'on est en train de regarder.
  if(view==='fiche') showFiche(curId);
}

async function deleteDeal(id){
  if(!confirm('Supprimer cette affaire et ses devis ? Cette action est irréversible.'))return;
  const wasProspectId = (deals.find(d=>d.id===id)||{}).prospectId;
  try{
    var r = await apiFetch('/wa/crmDeal/delete', {method:'POST', body:JSON.stringify({id:id})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  deals = deals.filter(d=>d.id!==id);
  closeModal(); flash('Affaire supprimée');
  if(view==='affaires') renderAffaires();
  if(view==='fiche'&&curId===wasProspectId) showFiche(curId);
}

function quoteTotals(){
  const q = QUOTE_DRAFT;
  let mrr=0, oneoff=0;
  (q.lines||[]).forEach(l=>{ const t=(+l.qty||0)*(+l.unitPrice||0); if(l.recurring) mrr+=t; else oneoff+=t; });
  const discount = (q.discountPct||0)/100;
  return { mrr, oneoff, mrrNet: mrr*(1-discount), oneoffNet: oneoff*(1-discount) };
}

function captureQuoteLines(){
  const lines = QUOTE_DRAFT.lines||[];
  lines.forEach((l,i)=>{

    if(gl) l.label = gl.value;
    if(gd) l.description = gd.value;
    if(gq) l.qty = +gq.value || 0;
    if(gp) l.unitPrice = +gp.value || 0;
    if(gr) l.recurring = gr.checked;
  });

}

        ${(q.lines||[]).length?'<button class="btn btn-ghost" onclick="saveQuoteAsTemplate()">💾 Enregistrer comme modèle</button>':''}

async function saveQuote(){
  captureQuoteLines();
  const q = QUOTE_DRAFT;
  const body = {
    dealId: q.dealId,
    lines: (q.lines||[]).map(l=>({label:l.label, description:l.description||'', qty:+l.qty||0, unitPrice:+l.unitPrice||0, recurring:!!l.recurring})),
    discountPct: +q.discountPct||0, notes: q.notes||'', status: q.status||'brouillon'
  };
  try{
    var r = q.id
      ? await apiFetch('/wa/crmQuote/update', {method:'POST', body:JSON.stringify({id:q.id, ...body})})
      : await apiFetch('/wa/crmQuote/create', {method:'POST', body:JSON.stringify(body)});
    if(!r.ok) throw new Error('http '+r.status);
    var saved = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement du devis'); return; }
  QUOTE_DRAFT = {...saved, _new:false};
  const deal = deals.find(d=>d.id===q.dealId);
  if(deal){
    deal.quotes = deal.quotes||[];
    const idx = deal.quotes.findIndex(x=>x.id===saved.id);
    const summary = {id:saved.id, number:saved.number, status:saved.status};
    if(idx>=0) deal.quotes[idx]=summary; else deal.quotes.push(summary);
  }
  flash('Devis enregistré ✓');
  renderQuoteModal();
}

async function deleteQuote(){
  const q = QUOTE_DRAFT; if(!q || !q.id) return;
  if(!confirm('Supprimer ce devis ? Cette action est irréversible.')) return;
  try{
    var r = await apiFetch('/wa/crmQuote/delete', {method:'POST', body:JSON.stringify({id:q.id})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  const deal = deals.find(d=>d.id===q.dealId);
  if(deal) deal.quotes = (deal.quotes||[]).filter(x=>x.id!==q.id);
  closeModal(); flash('Devis supprimé');
  if(view==='affaires') renderAffaires();
}

async function saveProduct(id){
  const g=i=>(document.getElementById(i)||{value:''}).value;
  const body = {
    label: g('p-label').trim(), sku: g('p-sku').trim(), unitPrice: +g('p-price')||0,
    recurring: g('p-recurring')==='1', description: g('p-desc'),
    stockable: (document.getElementById('p-stockable')||{checked:false}).checked,
  };
  if(id){ const activeEl=document.getElementById('p-active'); if(activeEl) body.active = activeEl.checked; }
  if(!body.label){ flash('Le libellé est obligatoire'); return; }
  try{
    var r = id
      ? await apiFetch('/wa/crmProduct/update', {method:'POST', body:JSON.stringify({id:id, ...body})})
      : await apiFetch('/wa/crmProduct/create', {method:'POST', body:JSON.stringify(body)});
    if(!r.ok) throw new Error('http '+r.status);
    var saved = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(id){ const ex=crmProducts.find(p=>p.id===id); if(ex) Object.assign(ex, saved); } else { crmProducts.push(saved); }
  closeModal(); flash('Produit enregistré'); renderCrmProducts();
}

async function deleteProduct(id){
  if(!confirm('Supprimer ce produit du catalogue ?'))return;
  try{
    var r = await apiFetch('/wa/crmProduct/delete', {method:'POST', body:JSON.stringify({id:id})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  crmProducts = crmProducts.filter(p=>p.id!==id);
  closeModal(); flash('Produit supprimé'); renderCrmProducts();
}

async function saveCrmUser(id){
  const g=i=>(document.getElementById(i)||{value:''}).value;

      if(activeEl) body.active = activeEl.value==='1';

async function sendCredentialsEmail(name, login, password){
  const to=(document.getElementById('cred-to')||{value:''}).value.trim();
  const key=(document.getElementById('cred-tpl')||{value:''}).value;
  if(!to||!key){ flash('Destinataire et modèle requis'); return; }

    var r = await apiFetch('/wa/message/send', {method:'POST', body:JSON.stringify({
      scope:'crm', channel:'email', templateKey:key, to:to,
      variables:{nom:name, login:login, password:password, loginUrl:location.origin+'/crm.html'}

const TICKET_TYPES = ['Incident technique','Question','Demande','Facturation','Autre'];

async function ticketQualify(id){
  const g=i=>(document.getElementById(i)||{value:''}).value;
  const body = { id, status:g('tkt-status'), priority:g('tkt-priority'), type:g('tkt-type'), agentId:g('tkt-agent')||null };
  try{
    const r = await apiFetch('/wa/crmTicket/update', {method:'POST', body:JSON.stringify(body)});
    if(!r.ok) throw new Error('http '+r.status);
    const updated = await r.json();
    const i = tickets.findIndex(x=>x.id===id); if(i>-1) tickets[i]=updated;
    updateBadges();
    flash('Ticket mis à jour');
  }catch(e){ flash('Erreur d\'enregistrement'); }
}

function ticketInsertTemplate(){
  const key = (document.getElementById('tkt-tpl-pick')||{value:''}).value;
  if(!key) return;
  const tpl = MSG_TEMPLATES.find(m=>m.key===key && m.channel==='email');
  if(!tpl) return;
  const vars = { nom: CURRENT_TICKET.prospectNom, secteur:'' };
  document.getElementById('tkt-reply-body').value = tpl.bodyHtml.replace(/\{\{\s*(\w+)\s*\}\}/g, (_m,k)=>vars[k]||'');
}

function filesToDataUrls(fileList, cb){
  const files = Array.from(fileList||[]);
  if(!files.length){ cb([]); return; }
  let done=0; const out=new Array(files.length);
  files.forEach((f,i)=>{
    const r = new FileReader();
    r.onload = e=>{ out[i]=e.target.result; done++; if(done===files.length) cb(out); };
    r.readAsDataURL(f);
  });
}

function ticketSendReply(id, kind){
  const bodyEl = document.getElementById('tkt-reply-body');
  const text = bodyEl.value.trim();
  if(!text){ flash('Message requis'); return; }
  const filesEl = document.getElementById('tkt-reply-files');
  filesToDataUrls(filesEl.files, async (attachments)=>{
    try{
      const r = await apiFetch('/wa/crmTicket/reply', {method:'POST', body:JSON.stringify({ id, body:text, attachments, kind })});
      if(!r.ok) throw new Error('http '+r.status);
    }catch(e){ flash('Erreur d\'enregistrement'); return; }
    flash(kind==='reply'?'Réponse envoyée':'Note ajoutée');
    const r2 = await apiFetch('/wa/crmTicket/get?id='+encodeURIComponent(id));
    const t2 = await r2.json();
    const i = tickets.findIndex(x=>x.id===id); if(i>-1) tickets[i]=t2;
    updateBadges();
    renderTicketDetail(t2);
  });
}

async function saveTemplate(id){
  const g=i=>(document.getElementById(i)||{value:''}).value;

  if(!body.key||!body.name||!body.bodyHtml||(body.channel==='email'&&!body.subject)||(body.channel==='whatsapp'&&!body.whatsappContentSid)){flash('Tous les champs sont requis');return;}
  try{
    var r = await apiFetch('/wa/messageTemplate/upsert', {method:'POST', body:JSON.stringify(body)});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    const i=MSG_TEMPLATES.findIndex(t=>t.id===data.id);
    if(i>-1) MSG_TEMPLATES[i]=data; else MSG_TEMPLATES.push(data);

}

  MSG_TEMPLATES=MSG_TEMPLATES.filter(t=>t.id!==id);

// récurrence programmée (portée CRM/Sesame, scope=crm)
// ════════════════════════════════════════
const TRIGGERS_CRM = [
  {key:'crm.prospect_created', label:'Nouveau prospect CRM', timingModes:['immediate']},
  {key:'crm.contract_signed', label:'Contrat signé', timingModes:['immediate']},
  {key:'crm.subscription_activated', label:'Souscription activée', timingModes:['immediate']},
  {key:'crm.subscription_cancelled', label:'Souscription annulée', timingModes:['immediate']},
  {key:'crm.subscription_trial_ending', label:"Fin d'essai souscription", timingModes:['offset']},
  {key:'crm.newsletter', label:'Newsletter récurrente', timingModes:['recurring']},
  {key:'crm.ticket_created', label:'Nouveau ticket support', timingModes:['immediate']},
  {key:'crm.ticket_client_replied', label:'Client a répondu à un ticket', timingModes:['immediate']},
];
let AUTO_RULES=[];

function showAutomationPanel(){
  view='auto';setNav('n-auto');
  bc([{label:'Automatisations'}]);tba('');
  document.getElementById('main').innerHTML='<div class="card">Chargement…</div>';
  loadAutomationPanelData();
}

async function loadAutomationPanelData(){
  await ensureTemplatesLoaded();
  try{
    var r = await apiFetch('/wa/automationRule/list?scope=crm');
    AUTO_RULES = r.ok ? await r.json() : [];
  }catch(e){ AUTO_RULES=[]; }
  renderAutomationPanel();
}

function triggerLabel(key){ const t=TRIGGERS_CRM.find(t=>t.key===key); return t?t.label:key; }
function timingSummary(r){
  if(r.timingMode==='immediate') return 'Immédiat';
  if(r.timingMode==='offset'){
    const v=r.offsetValue||0;
    return Math.abs(v)+' '+unitLabel(r.offsetUnit)+' '+(v<0?'avant':'après');
  }
  // Rétro-compatibilité d'affichage pour d'éventuelles règles créées sous
  // l'ancien système à deux modes séparés (avant remplacement par "offset").
  if(r.timingMode==='before') return (r.offsetValue||0)+' '+unitLabel(r.offsetUnit)+' avant';
  if(r.timingMode==='after') return (r.offsetValue||0)+' '+unitLabel(r.offsetUnit)+' après';
  if(r.timingMode==='recurring'){
    const rec={daily:'Tous les jours',weekly:'Toutes les semaines',monthly:'Tous les mois'}[r.recurrence]||r.recurrence;
    return rec+' à '+(r.atTime||'—');
  }
  return r.timingMode;
}
function unitLabel(u){ return {minutes:'min',hours:'h',days:'j',months:'mois'}[u]||u||''; }

function renderAutomationPanel(){
  document.getElementById('main').innerHTML=`
  <div class="card">
    <div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Règles d'automatisation</span><button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openRuleModal(null)">+ Nouvelle règle</button></div>
    ${AUTO_RULES.length===0?'<div class="log-empty">Aucune règle. Ex : envoyer une newsletter tous les mois à 11h00, ou relancer automatiquement un nouveau prospect.</div>':AUTO_RULES.map(r=>`
      <div class="log-item">
        <div class="log-dot ${r.enabled?'ld-g':'ld-r'}"></div>
        <div class="log-body">
          <div class="log-text"><strong>${esc(r.name)}</strong> <span class="tag t-gray" style="font-size:10px;padding:1px 7px">${triggerLabel(r.trigger)}</span> <span class="tag t-blue" style="font-size:10px;padding:1px 7px">${CHANNEL_LABEL[r.channel]}</span></div>
          <div class="log-meta">${timingSummary(r)} — modèle : ${esc(r.templateKey)} — destinataire : ${r.recipientMode==='custom'?esc(r.recipientOverride):'automatique'}${r.senderName?' — expéditeur : '+esc(r.senderName):''}${r.lastRunAt?' — dernier envoi : '+new Date(r.lastRunAt).toLocaleString('fr-FR'):''}</div>
          ${r.lastError?`<div class="log-meta" style="color:#a32d2d">⚠ Problème lors du dernier déclenchement (${r.lastErrorAt?new Date(r.lastErrorAt).toLocaleString('fr-FR'):''}) : ${esc(r.lastError)}</div>`:''}
          <div class="log-acts">
            <button class="btn btn-sm btn-ghost" onclick="openRuleModal('${r.id}')">Modifier</button>

          </div>
        </div>
      </div>`).join('')}
  </div>`;

function renderRuleTimingFields(){
  const r = window._ruleEditing || {};
  const triggerKey = (document.getElementById('rule-trigger')||{value:r.trigger}).value;
  const trig = TRIGGERS_CRM.find(t=>t.key===triggerKey);
  const mode = trig ? trig.timingModes[0] : 'immediate';
  const el = document.getElementById('rule-timing-fields');
  if(!el)return;
  if(mode==='immediate'){
    el.innerHTML = '<input type="hidden" id="rule-timingMode" value="immediate">';
  } else if(mode==='offset'){
    const v=r.timingMode==='offset'?(r.offsetValue||1):Math.abs(r.offsetValue||1);
    const mag=Math.abs(v)||1;
    const sign=(r.timingMode==='before'||v<0)?'before':'after';
    el.innerHTML = `<input type="hidden" id="rule-timingMode" value="offset">
      <div class="form-grid" style="margin-top:8px">
        <div class="ff"><label>Sens</label><select id="rule-offsetSign"><option value="before" ${sign==='before'?'selected':''}>Avant</option><option value="after" ${sign==='after'?'selected':''}>Après</option></select></div>
        <div class="ff"><label>Délai</label><input type="number" id="rule-offsetValue" value="${mag}" min="1"></div>
        <div class="ff"><label>Unité</label><select id="rule-offsetUnit">
          <option value="minutes" ${r.offsetUnit==='minutes'?'selected':''}>Minutes</option>
          <option value="hours" ${r.offsetUnit==='hours'?'selected':''}>Heures</option>
          <option value="days" ${!r.offsetUnit||r.offsetUnit==='days'?'selected':''}>Jours</option>
          <option value="months" ${r.offsetUnit==='months'?'selected':''}>Mois</option>

  el.innerHTML = `<div class="modal-section">Audience</div>
    <div class="form-grid">
      <div class="ff"><label>Type de fiche</label><select id="rule-aud-type"><option value="all" ${!af.type||af.type==='all'?'selected':''}>Toutes</option><option value="Prospect" ${af.type==='Prospect'?'selected':''}>Prospects</option><option value="Client" ${af.type==='Client'?'selected':''}>Clients</option></select></div>
      <div class="ff"><label>Secteur (optionnel)</label><input id="rule-aud-secteur" value="${esc(af.secteur||'')}" placeholder="Tous secteurs"></div>
    </div>`;
}

function renderRuleTplOptions(){
  const r = window._ruleEditing || {};
  const chan = (document.getElementById('rule-channel')||{value:r.channel}).value;
  const sel = document.getElementById('rule-template');
  if(!sel)return;
  const opts = MSG_TEMPLATES.filter(t=>t.channel===chan);
  sel.innerHTML = opts.length ? opts.map(t=>`<option value="${esc(t.key)}" ${r.templateKey===t.key?'selected':''}>${esc(t.name)}</option>`).join('') : '<option value="">— aucun modèle pour ce canal —</option>';
}

async function saveRule(id){
  const g=i=>(document.getElementById(i)||{value:''}).value;
  const triggerKey=g('rule-trigger');
  const recipientMode = g('rule-recipientMode')||'event';
  const body={
    name:g('rule-name').trim(), trigger:triggerKey, enabled:g('rule-enabled')==='1',
    timingMode:g('rule-timingMode'), channel:g('rule-channel'), templateKey:g('rule-template'),
    offsetValue: document.getElementById('rule-offsetValue') ? (function(){
      const mag=+g('rule-offsetValue');
      const sign=document.getElementById('rule-offsetSign') ? g('rule-offsetSign') : 'after';
      return sign==='before' ? -mag : mag;
    })() : null,
    offsetUnit: document.getElementById('rule-offsetUnit') ? g('rule-offsetUnit') : null,
    recurrence: document.getElementById('rule-recurrence') ? g('rule-recurrence') : null,
    atTime: document.getElementById('rule-atTime') ? g('rule-atTime') : null,
    dayOfWeek: document.getElementById('rule-dayOfWeek') ? +g('rule-dayOfWeek') : null,
    dayOfMonth: document.getElementById('rule-dayOfMonth') ? +g('rule-dayOfMonth') : null,
    recipientMode: recipientMode,
    recipientOverride: document.getElementById('rule-recipientOverride') ? g('rule-recipientOverride').trim() : null,
    senderName: document.getElementById('rule-senderName') ? g('rule-senderName').trim() : null,
    scope:'crm',
  };
  if(triggerKey==='crm.newsletter'){
    body.audienceFilter = { type: g('rule-aud-type')||'all', secteur: g('rule-aud-secteur')||'' };
  }
  if(!body.name){flash('Le nom est requis');return;}
  if(!body.templateKey){flash('Sélectionnez un modèle pour ce canal');return;}
  if(recipientMode==='custom' && !body.recipientOverride){flash('Indiquez le destinataire personnalisé');return;}
  try{
    var r;
    if(id) r = await apiFetch('/wa/automationRule/update', {method:'POST', body:JSON.stringify({id:id, ...body})});
    else r = await apiFetch('/wa/automationRule/create', {method:'POST', body:JSON.stringify(body)});
    var data = await r.json();
    if(!r.ok) throw new Error(data.error||'http '+r.status);
    const i=AUTO_RULES.findIndex(x=>x.id===data.id);
    if(i>-1) AUTO_RULES[i]=data; else AUTO_RULES.push(data);
  }catch(e){ flash(e.message||'Erreur d\'enregistrement'); return; }
  closeModal();flash('Règle enregistrée');renderAutomationPanel();
}

async function toggleRule(id){
  const r=AUTO_RULES.find(r=>r.id===id);if(!r)return;
  try{
    var res = await apiFetch('/wa/automationRule/update', {method:'POST', body:JSON.stringify({id:id, ...r, enabled:!r.enabled, scope:'crm'})});
    var data = await res.json();
    if(!res.ok) throw new Error(data.error||'http '+res.status);
    Object.assign(r, data);
  }catch(e){ flash('Erreur'); return; }
  flash(r.enabled?'Règle activée':'Règle désactivée');renderAutomationPanel();
}

async function deleteRule(id){
  if(!confirm('Supprimer cette règle ?'))return;
  try{
    var r = await apiFetch('/wa/automationRule/delete', {method:'POST', body:JSON.stringify({id:id, scope:'crm'})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur de suppression'); return; }
  AUTO_RULES=AUTO_RULES.filter(r=>r.id!==id);
  flash('Règle supprimée');renderAutomationPanel();
}

async function testRule(id){
  const r=AUTO_RULES.find(r=>r.id===id);if(!r)return;
  const suggestion = r.recipientMode==='custom' ? r.recipientOverride : '';
  const label = r.channel==='email' ? 'adresse email' : 'numéro de mobile';
  const to = prompt('Envoyer un test à quel '+label+' ?', suggestion||'');
  if(!to)return;
  try{
    var res = await apiFetch('/wa/automationRule/test', {method:'POST', body:JSON.stringify({id:id, to:to, scope:'crm'})});
    var data = await res.json();
    if(!res.ok) throw new Error(data.error||'http '+res.status);
    flash('Test envoyé à '+to);
  }catch(e){ flash('Échec du test : '+(e.message||'erreur')); }
  await loadAutomationPanelData();
}

  const csv='﻿'+[h,...rows].map(r=>r.join(';')).join('\n');
