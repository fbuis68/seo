<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sesame CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f4f0;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── TOPBAR ── */
.topbar{background:#fff;border-bottom:0.5px solid #e2dfd9;padding:0 18px;height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:50}
.logo{font-size:14px;font-weight:600;letter-spacing:-.02em;color:#1a1a1a}.logo em{color:#8a2b2b;font-style:normal}
.tb-sep{color:#d5d2cc;font-size:16px;margin:0 2px}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px}
.bc-link{color:#999;cursor:pointer}.bc-link:hover{color:#1a1a1a;text-decoration:underline}
.bc-cur{color:#1a1a1a;font-weight:500}
.bc-sep{color:#d5d2cc}
.tb-right{margin-left:auto;display:flex;gap:7px;align-items:center}

/* ── BUTTONS ── */
.btn{font-family:inherit;font-size:12px;padding:0 13px;height:31px;border-radius:8px;border:0.5px solid #d0cdc6;background:#fff;color:#444;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .1s;white-space:nowrap;flex-shrink:0}
.btn:hover{background:#f0ede8;border-color:#bbb}
.btn-primary{background:#8a2b2b;border-color:#8a2b2b;color:#fff}.btn-primary:hover{background:#711f1f}
.btn-ghost{background:transparent;border-color:#d0cdc6;color:#555}
.btn-green{background:#eaf3de;border-color:#c0dd97;color:#27500a}.btn-green:hover{background:#d5ecb8}
.btn-amber{background:#faeeda;border-color:#fac775;color:#633806}
.btn-purple{background:#eeedfe;border-color:#afa9ec;color:#3c3489}
.btn-sm{height:27px;font-size:11px;padding:0 9px;border-radius:7px}
.btn-icon{width:30px;padding:0;justify-content:center;font-size:14px}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:210px;flex-shrink:0;background:#fff;border-right:0.5px solid #e2dfd9;display:flex;flex-direction:column;overflow-y:auto}
.nav-lbl{font-size:10px;font-weight:500;color:#c0bdb8;padding:14px 16px 3px;letter-spacing:.07em;text-transform:uppercase;user-select:none}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;color:#666;cursor:pointer;transition:background .1s;user-select:none}
.nav-item:hover{background:#f7f6f3;color:#1a1a1a}
.nav-item.active{background:#f0ede8;color:#1a1a1a;font-weight:500}
.nav-ico{width:15px;height:15px;border:1px solid #d0cdc6;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#bbb;flex-shrink:0}
.nav-item.active .nav-ico{border-color:#999;color:#666}
.nb{margin-left:auto;font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px}
.nb-r{background:#fcebeb;color:#791f1f}.nb-a{background:#faeeda;color:#633806}
.s-hr{border:none;border-top:0.5px solid #eeece8;margin:6px 0}
.view-toggle{display:flex;gap:5px;padding:8px 12px 10px}
.vt{flex:1;font-size:11px;height:27px;border-radius:7px;border:0.5px solid #d0cdc6;background:#fff;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .1s;font-family:inherit}
.vt:hover{background:#f0ede8}
.vt.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}

/* ── CARDS ── */
.card{background:#fff;border:0.5px solid #e2dfd9;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:9px;border-bottom:0.5px solid #eeece8}
.ch-ico{width:18px;height:18px;border:1px solid #d0cdc6;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa;flex-shrink:0}
.ch-title{font-size:13px;font-weight:500;color:#1a1a1a;flex:1}
.divl{border:none;border-top:0.5px solid #eeece8;margin:10px 0}

/* ── TAGS / BADGES ── */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 9px;border-radius:20px;border:0.5px solid}
.t-gray{background:#f1efe8;color:#555;border-color:#d8d6cf}
.t-blue{background:#e6f1fb;color:#0c447c;border-color:#b5d4f4}
.t-green{background:#eaf3de;color:#27500a;border-color:#c0dd97}
.t-red{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
.t-amber{background:#faeeda;color:#633806;border-color:#fac775}
.t-purple{background:#eeedfe;color:#3c3489;border-color:#afa9ec}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.bd{background:#fcebeb;color:#791f1f}.bw{background:#faeeda;color:#633806}
.bg{background:#eaf3de;color:#27500a}.bn{background:#f1efe8;color:#999}.bi{background:#e6f1fb;color:#0c447c}

/* ── FICHE ── */
.hero-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:13px}
.avatar{border-radius:50%;background:#eeedfe;display:flex;align-items:center;justify-content:center;font-weight:600;color:#3c3489;flex-shrink:0;font-size:15px}
.hero-name{font-size:18px;font-weight:500;margin-bottom:5px}
.tags-row{display:flex;gap:5px;flex-wrap:wrap}
.score-box{margin-left:auto;text-align:right;flex-shrink:0}
.score-lbl{font-size:11px;color:#aaa;margin-bottom:1px}
.score-num{font-size:26px;font-weight:500;line-height:1}
.score-sub{font-size:11px;color:#aaa;margin-top:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px}
.field{padding:3px 0}
.fl{font-size:11px;color:#bbb;margin-bottom:1px;display:flex;align-items:center;gap:3px}
.fl-ico{width:13px;height:13px;border:1px solid #e0ddd6;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:7px;color:#ccc}
.fv{font-size:13px;color:#1a1a1a}
.fv a{color:#185fa5;text-decoration:none}.fv a:hover{text-decoration:underline}
.fv-sub{font-size:11px;color:#aaa;margin-top:1px}
.alert-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:4px}
.apill{font-size:11px;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;background:#faeeda;color:#633806;border:0.5px solid #fac775}

/* TWO COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

/* BARS */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-lbl{font-size:12px;color:#666;width:68px;flex-shrink:0}
.bar-track{flex:1;height:5px;background:#f1efe8;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-pct{font-size:12px;font-weight:500;width:32px;text-align:right;color:#1a1a1a}

/* FEATURE PILLS */
.feat-lbl{font-size:11px;color:#bbb;margin:9px 0 5px}
.feat-pills{display:flex;flex-wrap:wrap;gap:4px}
.fp{font-size:11px;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;border:0.5px solid}
.fp-on{background:#eaf3de;color:#27500a;border-color:#c0dd97}
.fp-off{background:#fcebeb;color:#791f1f;border-color:#f7c1c1}
.fp-ico{width:11px;height:11px;border:1px solid currentColor;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:7px;opacity:.7;flex-shrink:0}

/* UPSELL */
.upsell-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid #f0ede8}
.upsell-row:last-child{border-bottom:none}
.ups-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ups-info{flex:1}
.ups-name{font-size:13px;font-weight:500}
.ups-price{font-size:10px;padding:1px 7px;border-radius:20px;display:inline-block;margin-top:1px}

/* JOURNAL */
.log-item{display:flex;gap:10px;padding:9px 0;border-bottom:0.5px solid #f0ede8}
.log-item:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ld-g{background:#639922}.ld-a{background:#ef9f27}.ld-r{background:#e24b4a}.ld-b{background:#185fa5}
.log-body{flex:1}
.log-text{font-size:13px;line-height:1.45;color:#1a1a1a}
.log-meta{font-size:11px;color:#aaa;margin-top:2px}
.log-acts{display:flex;gap:6px;margin-top:6px}
.log-empty{font-size:12px;color:#bbb;padding:8px 0;font-style:italic}

/* ADD ACTIVITY FORM */
.act-form{background:#f9f8f6;border-radius:10px;padding:12px;margin-top:4px;border:0.5px solid #e2dfd9}
.act-form textarea{width:100%;font-family:inherit;font-size:13px;border:0.5px solid #d0cdc6;border-radius:8px;padding:8px 10px;background:#fff;color:#1a1a1a;resize:vertical;min-height:64px;outline:none;line-height:1.5}
.act-form textarea:focus{border-color:#8a2b2b;box-shadow:0 0 0 2px rgba(138,43,43,.08)}
.act-form-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.act-type-sel{font-family:inherit;font-size:12px;padding:0 8px;height:30px;border:0.5px solid #d0cdc6;border-radius:7px;background:#fff;color:#444;outline:none;cursor:pointer}
.act-date-inp{font-family:inherit;font-size:12px;padding:0 8px;height:30px;border:0.5px solid #d0cdc6;border-radius:7px;background:#fff;color:#444;outline:none;width:130px}

/* ── LIST VIEW ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:10px;padding:.65rem .9rem;border:0.5px solid #e2dfd9}
.stat-lbl{font-size:11px;color:#aaa;margin-bottom:2px}
.stat-val{font-size:20px;font-weight:500}
.list-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.srch-wrap{position:relative}
.srch-wrap input{font-family:inherit;font-size:12px;padding:0 10px 0 30px;height:32px;border:0.5px solid #d0cdc6;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;width:200px}
.srch-wrap input:focus{border-color:#8a2b2b;box-shadow:0 0 0 2px rgba(138,43,43,.08)}
.srch-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:#ccc;pointer-events:none}
.lsel{font-family:inherit;font-size:12px;padding:0 8px;height:32px;border:0.5px solid #d0cdc6;border-radius:8px;background:#fff;color:#444;outline:none;cursor:pointer}
.count-lbl{font-size:12px;color:#aaa;margin-left:auto}

/* TABLE */
.tbl-wrap{background:#fff;border:0.5px solid #e2dfd9;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:#f9f8f6;font-size:11px;font-weight:500;color:#aaa;padding:8px 10px;text-align:left;border-bottom:0.5px solid #e2dfd9;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:#1a1a1a}
td{padding:7px 10px;border-bottom:0.5px solid #f0ede8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9f7}
tr.erow td{background:#f5f3ff}
.nom-cell{font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nom-cell:hover{color:#8a2b2b}
.sub-cell{font-size:11px;color:#bbb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpill{font-size:10px;padding:2px 8px;border-radius:20px}
.ta-btn{font-size:12px;width:27px;height:26px;border-radius:6px;border:0.5px solid #d0cdc6;background:transparent;color:#777;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .1s}
.ta-btn:hover{background:#f0ede8;color:#1a1a1a}
.ta-save{background:#eeedfe;border-color:#afa9ec;color:#3c3489}
.ei{font-size:12px;padding:0 5px;height:26px;border:0.5px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;width:100%;font-family:inherit;outline:none}
.esel{font-size:11px;padding:0 4px;height:26px;border:0.5px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;width:100%;font-family:inherit;outline:none}
.sarr{font-size:9px;opacity:.4;margin-left:1px}

/* GRID VIEW */
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gc{background:#fff;border:0.5px solid #e2dfd9;border-radius:12px;padding:14px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.gc:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:#bbb}
.gc-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.gc-info{flex:1;min-width:0}
.gc-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-sub{font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.gc-fields{display:flex;flex-direction:column;gap:4px}
.gc-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.gc-rl{color:#aaa}.gc-rv{font-weight:500}
.gc-divider{border:none;border-top:0.5px solid #eeece8;margin:8px 0}
.gc-feats{display:flex;gap:3px;flex-wrap:wrap}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px;overflow-y:auto}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:1.4rem}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-head input.name-inp{font-size:16px;font-weight:500;border:none;padding:0;flex:1;background:transparent;outline:none;color:#1a1a1a;font-family:inherit}
.modal-head input.name-inp:focus{border-bottom:1px solid #d0cdc6}
.modal-section{font-size:11px;font-weight:500;color:#aaa;letter-spacing:.05em;text-transform:uppercase;margin:14px 0 8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.ff label{font-size:11px;color:#888;display:block;margin-bottom:2px}
.ff input,.ff select,.ff textarea{font-family:inherit;font-size:12px;width:100%;padding:0 8px;height:32px;border:0.5px solid #d0cdc6;border-radius:7px;background:#fff;color:#1a1a1a;outline:none}
.ff input:focus,.ff select:focus{border-color:#8a2b2b;box-shadow:0 0 0 2px rgba(138,43,43,.08)}
.ff textarea{height:60px;padding:6px 8px;resize:vertical}
.feat-checks{display:flex;flex-wrap:wrap;gap:10px 16px}
.feat-checks label{font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;color:#444}
input[type=checkbox]{accent-color:#8a2b2b;cursor:pointer;width:14px;height:14px}
.modal-footer{display:flex;gap:8px;margin-top:16px;align-items:center;padding-top:12px;border-top:0.5px solid #eeece8}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:#1a1a1a;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:300;display:none;animation:slideup .2s ease}
@keyframes slideup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── LOGIN GATE ── */
#loginGate{position:fixed;inset:0;background:#f5f4f0;z-index:500;display:flex;align-items:center;justify-content:center}
.lg-box{background:#fff;border:0.5px solid #e2dfd9;border-radius:14px;padding:2rem;width:100%;max-width:340px}
.lg-title{font-size:16px;font-weight:600;margin-bottom:4px}
.lg-sub{font-size:12px;color:#999;margin-bottom:18px}
.lg-box .ff{margin-bottom:10px}
.lg-err{font-size:12px;color:#a32d2d;margin-top:6px;display:none}
</style>
</head>
<body>

<div id="loginGate">
  <div class="lg-box">
    <div class="lg-title">Sesame <em style="color:#8a2b2b;font-style:normal">CRM</em></div>
    <div class="lg-sub">Réservé aux comptes Sesame Technology.</div>
    <div class="ff"><label>Email</label><input type="email" id="lg-email" placeholder="vous@sesame.technology"></div>
    <div class="ff"><label>Mot de passe</label><input type="password" id="lg-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')crmLogin()"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="crmLogin()">Se connecter</button>
    <div class="lg-err" id="lg-err"></div>
  </div>
</div>

<div class="topbar" style="display:none" id="topbar">
  <div class="logo">Sesame <em>CRM</em></div>
  <span class="tb-sep">/</span>
  <div class="breadcrumb" id="bc"></div>
  <div class="tb-right" id="tb-actions"></div>
</div>

<div class="layout" style="display:none" id="layout">
  <div class="sidebar">
    <div class="nav-lbl">Navigation</div>
    <div class="nav-item" id="n-list" onclick="showList()"><div class="nav-ico">≡</div> Vue liste</div>
    <div class="nav-item" id="n-fiche" onclick="goFiche()"><div class="nav-ico">◉</div> Fiche client</div>
    <div class="nav-item" id="n-activite" onclick="showActivites()"><div class="nav-ico">◈</div> Activités</div>
    <div class="nav-item" id="n-contrats" onclick="showContrats()"><div class="nav-ico">◻</div> Contrats</div>
    <hr class="s-hr">
    <div class="nav-lbl">Filtres rapides</div>
    <div class="nav-item" onclick="qf('danger','Élevé !!')"><div class="nav-ico">!</div> Risque élevé <span class="nb nb-r" id="b-eleve">0</span></div>
    <div class="nav-item" onclick="qf('appel','todo')"><div class="nav-ico">☏</div> À appeler</div>
    <div class="nav-item" onclick="qf('contrat','non')"><div class="nav-ico">○</div> Sans contrat <span class="nb nb-a" id="b-contrat">0</span></div>
    <div class="nav-item" onclick="qf('upsell','1')"><div class="nav-ico">↑</div> Upsell détecté</div>
    <hr class="s-hr">
    <div class="nav-lbl">Vue</div>
    <div class="view-toggle">
      <button class="vt active" id="vt-tbl" onclick="setVMode('table')">≡ Liste</button>
      <button class="vt" id="vt-grd" onclick="setVMode('grid')">⊞ Grille</button>
    </div>
    <hr class="s-hr">
    <div class="nav-item" onclick="window.location.href='admin.html'"><div class="nav-ico">←</div> Retour au back-office</div>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="modal-ct"></div>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════
// AUTH — réutilise la même session que admin.html (compte "sesame" requis)
// ════════════════════════════════════════
var API_BASE = '';
var ADMIN_TOKEN = sessionStorage.getItem('SESAME_ADMIN_TOKEN') || null;
var ADMIN_ROLE  = sessionStorage.getItem('SESAME_ADMIN_ROLE') || null;

function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, {Authorization:'Bearer '+ADMIN_TOKEN});
  return fetch(API_BASE+url, opts);
}

async function crmLogin(){
  var email = (document.getElementById('lg-email').value||'').trim();
  var password = document.getElementById('lg-password').value||'';
  var errEl = document.getElementById('lg-err');
  errEl.style.display='none';
  if(!email||!password){ errEl.textContent='Email et mot de passe requis'; errEl.style.display='block'; return; }
  try{
    var r = await fetch(API_BASE+'/wa/login/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email,password:password})});
    var data = await r.json();
    if(!r.ok){ errEl.textContent = data.error || 'Identifiants incorrects'; errEl.style.display='block'; return; }
    if(data.admin.role !== 'sesame'){ errEl.textContent = 'Ce module est réservé aux comptes Sesame Technology.'; errEl.style.display='block'; return; }
    ADMIN_TOKEN = data.token; ADMIN_ROLE = data.admin.role;
    sessionStorage.setItem('SESAME_ADMIN_TOKEN', ADMIN_TOKEN);
    sessionStorage.setItem('SESAME_ADMIN_ROLE', ADMIN_ROLE);
    enterApp();
  }catch(e){ errEl.textContent = 'Erreur de connexion au serveur'; errEl.style.display='block'; }
}

function enterApp(){
  document.getElementById('loginGate').style.display='none';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('layout').style.display='flex';
  init();
}

document.addEventListener('DOMContentLoaded', function(){
  if(ADMIN_TOKEN && ADMIN_ROLE==='sesame') enterApp();
  // sinon : le login gate reste affiché
});

// ════════════════════════════════════════
// DATA
// ════════════════════════════════════════
const DANGERS = ['Bon client','Modéré','Élevé !!'];
const SECTEURS = ['Hôtellerie','Location appartement','Appart Hotel','Location AirBnB','Bureaux','Sport','Garde meuble','Love hôtel','Location bureau','Agence gestion patrimoine'];
const ACT_TYPES = ['Appel','Email','Visite','Proposition','Relance','Note interne','Autre'];
const DOT_MAP = {Appel:'g',Email:'b',Visite:'g',Proposition:'b',Relance:'a','Note interne':'b',Autre:'b'};

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let clients=[], view='list', vmode='table', curId=null, sortC='nom', sortD=1;
let srch='', fDanger='', fSecteur='', fContrat='', editingId=null, toastT=null;

async function loadData(){
  var r = await apiFetch('/wa/crmProspect/list');
  if(!r.ok) throw new Error('http '+r.status);
  return await r.json();
}
async function init(){
  try{ clients = await loadData(); }
  catch(e){ flash('Erreur de chargement — rechargez la page'); clients = []; }
  updateBadges();showList();
}
function ini(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?';}
function today(){const d=new Date();return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}

// ── NAV ──
function setNav(id){['n-list','n-fiche','n-activite','n-contrats'].forEach(n=>document.getElementById(n).classList.remove('active'));document.getElementById(id).classList.add('active');}
function setVMode(m){vmode=m;document.getElementById('vt-tbl').classList.toggle('active',m==='table');document.getElementById('vt-grd').classList.toggle('active',m==='grid');if(view==='list')renderList();}
function goFiche(){if(curId)showFiche(curId);}
function bc(parts){document.getElementById('bc').innerHTML=parts.map((p,i)=>i<parts.length-1?`<span class="bc-link" onclick="${p.fn}">${p.label}</span><span class="bc-sep"> / </span>`:`<span class="bc-cur">${p.label}</span>`).join('');}
function tba(html){document.getElementById('tb-actions').innerHTML=html;}

// ── QUICK FILTER ──
function qf(f,v){srch='';fDanger='';fSecteur='';fContrat='';if(f==='danger')fDanger=v;else if(f==='contrat')fContrat=v;showList();}

// ════════════════════════════════════════
// LIST VIEW
// ════════════════════════════════════════
function showList(){view='list';editingId=null;setNav('n-list');bc([{label:'Clients'}]);tba(`<button class="btn btn-green" onclick="exportCSV()">↓ CSV</button><button class="btn btn-primary" onclick="openNewModal()">+ Nouveau client</button>`);renderList();}

function filtered(){
  return clients.filter(c=>{
    if(srch){const s=srch.toLowerCase();if(![c.nom,c.ville||'',c.groupe||'',c.referent||''].some(x=>x.toLowerCase().includes(s)))return false;}
    if(fDanger&&c.danger!==fDanger)return false;
    if(fSecteur&&c.secteur!==fSecteur)return false;
    if(fContrat&&c.contrat!==fContrat)return false;
    return true;
  }).sort((a,b)=>{let av=a[sortC]||'',bv=b[sortC]||'';if(typeof av==='string')av=av.toLowerCase();if(typeof bv==='string')bv=bv.toLowerCase();return av<bv?-sortD:av>bv?sortD:0;});
}

function dBadge(d){if(d==='Élevé !!')return'<span class="badge bd">⚠ Élevé</span>';if(d==='Bon client')return'<span class="badge bg">✓ Bon client</span>';if(d==='Modéré')return'<span class="badge bw">Modéré</span>';return'<span class="badge bn">—</span>';}
function pBadge(p){const c=['bn','bi','bw','bg'];return p?`<span class="badge ${c[p]||'bn'}">${p}/3</span>`:'<span class="badge bn">—</span>';}
function cPill(v){const m={oui:'bg',non:'bd','en cours':'bw'};return`<span class="tpill ${m[v]||'bn'}">${v||'—'}</span>`;}
function chk(v){return v?'<span class="tpill bg">oui</span>':'<span class="tpill" style="background:#f1efe8;color:#bbb">—</span>';}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}

function renderList(){
  const data=filtered();
  const sectAll=[...new Set([...SECTEURS,...clients.map(c=>c.secteur)].filter(Boolean))].sort();
  const stats=`<div class="stats-row">
    <div class="stat-card"><div class="stat-lbl">Clients</div><div class="stat-val">${clients.length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Risque élevé</div><div class="stat-val" style="color:#a32d2d">${clients.filter(c=>c.danger==='Élevé !!').length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Sans contrat</div><div class="stat-val" style="color:#854f0b">${clients.filter(c=>c.contrat==='non').length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Activités totales</div><div class="stat-val" style="color:#3c3489">${clients.reduce((s,c)=>(s+(c.journal||[]).length),0)}</div></div>
  </div>`;
  const toolbar=`<div class="list-toolbar">
    <div class="srch-wrap"><span class="srch-ico">⌕</span><input type="text" placeholder="Client, ville, groupe…" value="${esc(srch)}" oninput="srch=this.value;renderList()"></div>
    <select class="lsel" onchange="fDanger=this.value;renderList()"><option value="">Tous risques</option>${DANGERS.map(d=>`<option value="${d}" ${fDanger===d?'selected':''}>${d}</option>`).join('')}</select>
    <select class="lsel" onchange="fSecteur=this.value;renderList()"><option value="">Tous secteurs</option>${sectAll.map(s=>`<option value="${s}" ${fSecteur===s?'selected':''}>${s}</option>`).join('')}</select>
    <select class="lsel" onchange="fContrat=this.value;renderList()"><option value="">Tous contrats</option><option value="oui" ${fContrat==='oui'?'selected':''}>oui</option><option value="non" ${fContrat==='non'?'selected':''}>non</option><option value="en cours" ${fContrat==='en cours'?'selected':''}>en cours</option></select>
    <span class="count-lbl">${data.length} résultat${data.length>1?'s':''}</span>
  </div>`;

  let content='';
  if(vmode==='grid'){
    content=`<div class="grid-view">${data.map(c=>{
      const dc=c.danger==='Élevé !!'?'bd':c.danger==='Bon client'?'bg':'bw';
      const feats=[c.webApp&&'WebApp',c.mobileV2&&'V2',c.checkin&&'Check-in',c.livret&&'Livret',c.gestionDemande&&'Gestion'].filter(Boolean);
      const lastAct=(c.journal||[]).slice(-1)[0];
      return`<div class="gc" onclick="showFiche('${c.id}')">
        <div class="gc-head">
          <div class="avatar" style="width:36px;height:36px;font-size:12px">${ini(c.nom)}</div>
          <div class="gc-info"><div class="gc-name">${c.nom}</div><div class="gc-sub">${c.groupe||c.secteur||'—'}</div></div>
        </div>
        <div class="gc-tags"><span class="badge ${dc}" style="font-size:10px">${c.danger||'—'}</span>${c.ville?`<span class="tag t-blue" style="font-size:10px">${c.ville}</span>`:''}</div>
        <hr class="gc-divider">
        <div class="gc-fields">
          <div class="gc-row"><span class="gc-rl">Contrat</span>${cPill(c.contrat)}</div>
          <div class="gc-row"><span class="gc-rl">Modules</span><span class="gc-rv">${c.modules||'—'}</span></div>
          <div class="gc-row"><span class="gc-rl">PMS</span><span class="gc-rv">${c.pms||'—'}</span></div>
          ${lastAct?`<div class="gc-row" style="margin-top:2px"><span class="gc-rl">Dernière activité</span><span class="gc-rv" style="color:#aaa;font-size:10px;font-weight:400">${lastAct.type}</span></div>`:''}
        </div>
        ${feats.length?`<hr class="gc-divider"><div class="gc-feats">${feats.map(f=>`<span class="tpill bg" style="font-size:10px">${f}</span>`).join('')}</div>`:''}
      </div>`;
    }).join('')}</div>`;
  } else {
    const th=(col,lbl,w)=>`<th style="width:${w}" onclick="srt('${col}')">${lbl}<span class="sarr">${sortC===col?(sortD===1?'↑':'↓'):'·'}</span></th>`;
    const rows=data.map(c=>{
      if(editingId===c.id)return`<tr class="erow">
        <td><div class="avatar" style="width:26px;height:26px;font-size:10px">${ini(c.nom)}</div></td>
        <td><div class="nom-cell">${c.nom}</div><div class="sub-cell">${c.groupe||'—'}</div></td>
        <td><select class="esel" onchange="ef('${c.id}','secteur',this.value)">${SECTEURS.map(s=>`<option value="${s}" ${c.secteur===s?'selected':''}>${s}</option>`).join('')}</select></td>
        <td><input class="ei" value="${esc(c.ville)}" onchange="ef('${c.id}','ville',this.value)"></td>
        <td><select class="esel" onchange="ef('${c.id}','danger',this.value)">${DANGERS.map(d=>`<option value="${d}" ${c.danger===d?'selected':''}>${d}</option>`).join('')}</select></td>
        <td><select class="esel" onchange="ef('${c.id}','potentiel',+this.value)"><option value="0">—</option><option value="1" ${c.potentiel===1?'selected':''}>1</option><option value="2" ${c.potentiel===2?'selected':''}>2</option><option value="3" ${c.potentiel===3?'selected':''}>3</option></select></td>
        <td><input class="ei" value="${esc(c.appel)}" onchange="ef('${c.id}','appel',this.value)" style="width:82px"></td>
        <td><select class="esel" onchange="ef('${c.id}','contrat',this.value)"><option value="non" ${c.contrat==='non'?'selected':''}>non</option><option value="oui" ${c.contrat==='oui'?'selected':''}>oui</option><option value="en cours" ${c.contrat==='en cours'?'selected':''}>en cours</option></select></td>
        <td><input type="checkbox" ${c.webApp?'checked':''} onchange="ef('${c.id}','webApp',this.checked)"></td>
        <td><input type="checkbox" ${c.checkin?'checked':''} onchange="ef('${c.id}','checkin',this.checked)"></td>
        <td style="white-space:nowrap"><button class="ta-btn ta-save" onclick="saveRow('${c.id}')">✓</button></td>
      </tr>`;
      return`<tr>
        <td><div class="avatar" style="width:26px;height:26px;font-size:10px;cursor:pointer" onclick="showFiche('${c.id}')">${ini(c.nom)}</div></td>
        <td><div class="nom-cell" onclick="showFiche('${c.id}')">${c.nom}</div><div class="sub-cell">${c.groupe||'—'}</div></td>
        <td style="font-size:12px;color:#666">${c.secteur||'—'}</td>
        <td style="font-size:12px">${c.ville||'—'}</td>
        <td>${dBadge(c.danger)}</td>
        <td>${pBadge(c.potentiel)}</td>
        <td style="font-size:11px;color:#aaa">${c.appel||'—'}</td>
        <td>${cPill(c.contrat)}</td>
        <td>${chk(c.webApp)}</td>
        <td>${chk(c.checkin)}</td>
        <td style="white-space:nowrap">
          <button class="ta-btn" onclick="editingId='${c.id}';renderList()" title="Édition rapide">✎</button>
          <button class="ta-btn" onclick="showFiche('${c.id}')" title="Fiche complète" style="margin-left:3px">◉</button>
        </td>
      </tr>`;
    }).join('');
    content=`<div class="tbl-wrap"><table>
      <thead><tr>
        <th style="width:34px"></th>
        ${th('nom','Client','160px')}${th('secteur','Secteur','135px')}${th('ville','Ville','85px')}
        ${th('danger','Risque','100px')}${th('potentiel','Potentiel','72px')}${th('appel','Appel','88px')}
        ${th('contrat','Contrat','75px')}<th style="width:62px">WebApp</th><th style="width:65px">Check-in</th><th style="width:68px">Actions</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }
  document.getElementById('main').innerHTML=stats+toolbar+content;
}

function srt(c){if(sortC===c)sortD*=-1;else{sortC=c;sortD=1;}renderList();}
function ef(id,f,v){const c=clients.find(c=>c.id===id);if(c)c[f]=v;}
async function saveRow(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify(c)});
    if(!r.ok) throw new Error('http '+r.status);
    var updated = await r.json();
    Object.assign(c, updated);
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  editingId=null;updateBadges();flash('Modifications enregistrées');renderList();
}

// ════════════════════════════════════════
// FICHE VIEW
// ════════════════════════════════════════
function showFiche(id){
  const c=clients.find(c=>c.id===id);if(!c)return;
  curId=id;view='fiche';setNav('n-fiche');
  bc([{label:'Clients',fn:'showList()'},{label:c.nom}]);
  tba(`<button class="btn btn-ghost" onclick="openModal('${id}')">✎ Modifier</button><button class="btn btn-primary" onclick="addActForm('${id}')">+ Activité</button>`);
  renderFiche(c);
}

function riskScore(c){let s=0;if(c.danger==='Élevé !!')s+=5;else if(c.danger==='Modéré')s+=3;if(c.contrat==='non')s+=2;if(!c.webApp&&!c.mobileV2)s+=1;if(!c.nfc&&!c.qr&&!c.mobile)s+=1;return Math.min(s,10);}
function scoreColor(s){return s<=3?'#27500a':s<=6?'#854f0b':'#a32d2d';}
function scoreLbl(s){return s<=3?'Faible':s<=6?'Modéré':'Élevé';}

function renderFiche(c){
  const sc=riskScore(c);
  const featDef=[['WebApp',c.webApp],['Mobile V2',c.mobileV2],['Offline',c.offline],['Livret digital',c.livret],['Check-in mobile',c.checkin],['Gestion demande',c.gestionDemande]];
  const upsells=[
    {show:!c.checkin,ico:'◉',bg:'#eeedfe',name:'Check-in mobile',price:'+90€/mois',pcl:'t-purple'},
    {show:!c.gestionDemande,ico:'◈',bg:'#eaf3de',name:'Gestion demande',price:'',pcl:'t-green'},
    {show:true,ico:'◻',bg:'#faeeda',name:'Boutique en ligne',price:'+90€/mois',pcl:'t-amber'},
    {show:true,ico:'◉',bg:'#fce8f3',name:'WhatsApp',price:'+90€/mois',pcl:'t-red'},
  ].filter(u=>u.show);

  const journal=c.journal||[];
  const journalHtml=journal.length===0
    ?'<div class="log-empty">Aucune activité enregistrée. Cliquez sur "+ Activité" pour commencer.</div>'
    :journal.slice().reverse().map(j=>`
      <div class="log-item" id="li-${j.id}">
        <div class="log-dot ld-${DOT_MAP[j.type]||'b'}"></div>
        <div class="log-body">
          <div style="display:flex;align-items:flex-start;gap:6px">
            <span class="tag t-gray" style="font-size:10px;padding:1px 7px;flex-shrink:0">${j.type||'Note'}</span>
            <span class="log-text">${j.text}</span>
          </div>
          <div class="log-meta">${new Date(j.activityDate||j.createdAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}${j.authorName?' — '+j.authorName:''}</div>
          <div class="log-acts">
            ${!j.done?`<button class="btn btn-sm btn-ghost" onclick="markDone('${c.id}','${j.id}')">✓ Marquer fait</button>`:''}
            <button class="btn btn-sm btn-ghost" onclick="deleteAct('${c.id}','${j.id}')" style="color:#a32d2d">Supprimer</button>
          </div>
        </div>
      </div>`).join('');

  document.getElementById('main').innerHTML=`
  <div class="card">
    <div class="hero-row">
      <div class="avatar" style="width:48px;height:48px">${ini(c.nom)}</div>
      <div style="flex:1">
        <div class="hero-name">${c.nom}</div>
        <div class="tags-row">
          <span class="tag t-gray">◻ ${c.secteur||'—'}${c.etoiles?' '+c.etoiles:''}</span>
          ${c.ville?`<span class="tag t-blue">◉ ${c.ville}</span>`:''}
          ${c.danger==='Bon client'?'<span class="tag t-green">Bon client</span>':c.danger==='Élevé !!'?'<span class="tag t-red">Élevé !!</span>':'<span class="tag t-amber">Modéré</span>'}
        </div>
      </div>
      <div class="score-box">
        <div class="score-lbl">Score de risque</div>
        <div class="score-num" style="color:${scoreColor(sc)}">${sc} / 10</div>
        <div class="score-sub">${scoreLbl(sc)}</div>
      </div>
    </div>
    <hr class="divl">
    <div class="fgrid">
      <div class="field"><div class="fl"><span class="fl-ico">R</span> Référent</div><div class="fv">${c.referent||'—'}</div></div>
      <div class="field"><div class="fl"><span class="fl-ico">@</span> Email</div><div class="fv">${c.email?`<a href="mailto:${c.email}">${c.email}</a>`:'—'}</div></div>
      <div class="field"><div class="fl"><span class="fl-ico">T</span> Téléphone</div><div class="fv">${c.tel||'—'}</div></div>
      <div class="field"><div class="fl"><span class="fl-ico">W</span> Site web</div><div class="fv">${c.site?`<a href="https://${c.site}" target="_blank">${c.site}</a>`:'—'}</div></div>
      <div class="field"><div class="fl"><span class="fl-ico">E</span> Établissement Sesame</div><div class="fv">${c.entityCode||'—'}</div></div>
      <div class="field"><div class="fl"><span class="fl-ico">M</span> Modules</div><div class="fv">${c.modules?c.modules+' × Sesame':'—'}</div></div>
      <div class="field"><div class="fl"><span class="fl-ico">P</span> PMS intégré</div><div class="fv">${c.pms||'—'}</div></div>
      <div class="field"><div class="fl"><span class="fl-ico">✉</span> Messagerie</div><div class="fv">${c.messagerie==='Client'?'<span class="tag t-green" style="font-size:11px">Client</span>':'<span class="tag t-gray" style="font-size:11px">Noreply</span>'}</div></div>
    </div>
    <hr class="divl">
    <div class="alert-row">
      ${c.contrat==='non'?'<span class="apill">◻ Contrat non localisé</span>':''}
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="openModal('${c.id}')">✎ Modifier la fiche</button>
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="card-head"><div class="ch-ico">◉</div><span class="ch-title">Usage des accès</span></div>
      ${c.nfc||c.qr||c.mobile
        ?`<div class="bar-row"><span class="bar-lbl">NFC</span><div class="bar-track"><div class="bar-fill" style="width:${c.nfc}%;background:#185fa5"></div></div><span class="bar-pct">${c.nfc}%</span></div>
           <div class="bar-row"><span class="bar-lbl">QR Code</span><div class="bar-track"><div class="bar-fill" style="width:${c.qr}%;background:#1d9e75"></div></div><span class="bar-pct">${c.qr}%</span></div>
           <div class="bar-row"><span class="bar-lbl">Mobile</span><div class="bar-track"><div class="bar-fill" style="width:${c.mobile}%;background:#d4537e"></div></div><span class="bar-pct">${c.mobile}%</span></div>`
        :`<div style="font-size:12px;color:#bbb;padding:4px 0;font-style:italic">Données non renseignées</div>`}
      <div class="feat-lbl">Features actives</div>
      <div class="feat-pills">
        ${featDef.map(([n,v])=>`<span class="fp ${v?'fp-on':'fp-off'}"><span class="fp-ico">${v?'✓':'✕'}</span>${n}</span>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="ch-ico">↑</div><span class="ch-title">Opportunités upsell</span></div>
      ${upsells.map(u=>`<div class="upsell-row">
        <div class="ups-ico" style="background:${u.bg}">${u.ico}</div>
        <div class="ups-info"><div class="ups-name">${u.name}</div>${u.price?`<span class="ups-price ${u.pcl}">${u.price}</span>`:''}</div>
        <button class="btn btn-ghost btn-sm">Proposer</button>
      </div>`).join('')}
    </div>
  </div>

  <div class="card" id="journal-card">
    <div class="card-head">
      <div class="ch-ico">◈</div>
      <span class="ch-title">Journal d'activité</span>
      ${c.priorite?`<span class="tag t-purple" style="font-size:11px">Priorité ${c.priorite}</span>`:''}
      <span style="font-size:12px;color:#aaa;margin-left:8px">${journal.length} entrée${journal.length>1?'s':''}</span>
      <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="addActForm('${c.id}')">+ Ajouter</button>
    </div>
    <div id="act-form-slot"></div>
    <div id="journal-items">${journalHtml}</div>
  </div>`;
}

// ════════════════════════════════════════
// ACTIVITY FORM
// ════════════════════════════════════════
function addActForm(id){
  const slot=document.getElementById('act-form-slot');
  if(!slot)return;
  const todayStr=new Date().toISOString().split('T')[0];
  slot.innerHTML=`<div class="act-form">
    <textarea id="act-txt" placeholder="Décrivez l'activité — appel, email, visite, relance…" rows="3"></textarea>
    <div class="act-form-row">
      <select class="act-type-sel" id="act-type">
        ${ACT_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
      </select>
      <input type="date" class="act-date-inp" id="act-date" value="${todayStr}">
      <input class="ei" id="act-author" placeholder="Auteur (optionnel)" style="width:140px;height:30px">
      <button class="btn btn-primary btn-sm" onclick="saveActivity('${id}')">Enregistrer</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelActForm()">Annuler</button>
    </div>
  </div>`;
  document.getElementById('act-txt').focus();
}

function cancelActForm(){const s=document.getElementById('act-form-slot');if(s)s.innerHTML='';}

async function saveActivity(id){
  const txt=(document.getElementById('act-txt')||{}).value||'';
  if(!txt.trim()){flash('Veuillez saisir une description');return;}
  const type=(document.getElementById('act-type')||{}).value||'Note interne';
  const dateV=(document.getElementById('act-date')||{}).value||'';
  const author=(document.getElementById('act-author')||{}).value||'';
  const c=clients.find(c=>c.id===id);
  if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/create', {method:'POST', body:JSON.stringify({
      prospectId:id, type:type, text:txt.trim(), authorName:author, activityDate: dateV || undefined
    })});
    if(!r.ok) throw new Error('http '+r.status);
    var entry = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(!c.journal)c.journal=[];
  c.journal.push(entry);
  flash('Activité enregistrée');
  showFiche(id);
}

async function markDone(id,jid){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/markDone', {method:'POST', body:JSON.stringify({id:jid})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur'); return; }
  const j=c.journal.find(j=>j.id===jid);if(j)j.done=true;
  flash('Marqué comme fait');
  showFiche(id);
}

async function deleteAct(id,jid){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/activity/delete', {method:'POST', body:JSON.stringify({id:jid})});
    if(!r.ok) throw new Error('http '+r.status);
  }catch(e){ flash('Erreur'); return; }
  c.journal=c.journal.filter(j=>j.id!==jid);
  flash('Activité supprimée');
  showFiche(id);
}

// ════════════════════════════════════════
// ACTIVITÉS GLOBALES
// ════════════════════════════════════════
function showActivites(){
  view='activites';setNav('n-activite');
  bc([{label:'Activités'}]);
  tba('');
  const all=[];
  clients.forEach(c=>(c.journal||[]).forEach(j=>all.push({...j,clientNom:c.nom,clientId:c.id})));
  all.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  const html=all.length===0
    ?'<div class="card"><div class="log-empty">Aucune activité enregistrée.</div></div>'
    :`<div class="card">
      <div class="card-head"><div class="ch-ico">◈</div><span class="ch-title">Toutes les activités</span><span style="font-size:12px;color:#aaa;margin-left:8px">${all.length} entrées</span></div>
      ${all.map(j=>`<div class="log-item">
        <div class="log-dot ld-${DOT_MAP[j.type]||'b'}"></div>
        <div class="log-body">
          <div style="display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap">
            <span class="tag t-gray" style="font-size:10px;padding:1px 7px;flex-shrink:0">${j.type||'Note'}</span>
            <span class="log-text">${j.text}</span>
          </div>
          <div class="log-meta">${new Date(j.activityDate||j.createdAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})} · <span class="bc-link" onclick="showFiche('${j.clientId}')" style="font-size:11px">${j.clientNom}</span></div>
        </div>
      </div>`).join('')}
    </div>`;
  document.getElementById('main').innerHTML=html;
}

// ════════════════════════════════════════
// CONTRATS
// ════════════════════════════════════════
function showContrats(){
  view='contrats';setNav('n-contrats');
  bc([{label:'Contrats'}]);tba('');
  const sans=clients.filter(c=>c.contrat==='non');
  const avec=clients.filter(c=>c.contrat==='oui');
  const encours=clients.filter(c=>c.contrat==='en cours');
  document.getElementById('main').innerHTML=`
    <div class="stats-row">
      <div class="stat-card"><div class="stat-lbl">Sans contrat</div><div class="stat-val" style="color:#a32d2d">${sans.length}</div></div>
      <div class="stat-card"><div class="stat-lbl">En cours</div><div class="stat-val" style="color:#854f0b">${encours.length}</div></div>
      <div class="stat-card"><div class="stat-lbl">Signés</div><div class="stat-val" style="color:#27500a">${avec.length}</div></div>
      <div class="stat-card"><div class="stat-lbl">Total</div><div class="stat-val">${clients.length}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="ch-ico">○</div><span class="ch-title">Clients sans contrat localisé</span><span style="font-size:12px;color:#aaa;margin-left:8px">${sans.length} clients</span></div>
      ${sans.map(c=>`<div class="log-item" style="cursor:pointer" onclick="showFiche('${c.id}')">
        <div class="log-dot ld-r"></div>
        <div class="log-body">
          <div class="log-text">${c.nom} ${c.groupe?'<span style="color:#aaa;font-size:11px">'+c.groupe+'</span>':''}</div>
          <div class="log-meta">${c.secteur||'—'} · ${c.ville||'—'} · Risque : ${c.danger||'—'}</div>
        </div>
        <button class="btn btn-amber btn-sm" onclick="event.stopPropagation();setContrat('${c.id}','en cours')">Marquer en cours</button>
      </div>`).join('')}

}

async function setContrat(id,val){
  const c=clients.find(c=>c.id===id);if(!c)return;
  try{
    var r = await apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify({id:id, contrat:val})});
    if(!r.ok) throw new Error('http '+r.status);
    var updated = await r.json();
    Object.assign(c, updated);
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  updateBadges();flash('Contrat mis à jour');showContrats();
}

function updateBadges(){document.getElementById('b-eleve').textContent=clients.filter(c=>c.danger==='Élevé !!').length;document.getElementById('b-contrat').textContent=clients.filter(c=>c.contrat==='non').length;}

// ════════════════════════════════════════
// MODAL EDIT CLIENT
// ════════════════════════════════════════
function openModal(id){const c=clients.find(c=>c.id===id);if(c)renderModal({...c});}
function openNewModal(){renderModal({id:null,nom:'',groupe:'',secteur:'Hôtellerie',ville:'',etoiles:'',danger:'Modéré',potentiel:2,contrat:'non',modules:0,pms:'',priorite:1,appel:'',referent:'',email:'',tel:'',site:'',nfc:0,qr:0,mobile:0,webApp:false,mobileV2:false,checkin:false,livret:false,gestionDemande:false,offline:false,messagerie:'Noreply',note:'',journal:[],_new:true});}
function closeModal(){document.getElementById('modal-ct').innerHTML='';}

        <div class="avatar" style="width:36px;height:36px;font-size:12px">${ini(mc.nom||'?')}</div>

      </div>

      <div class="modal-section">Installation &amp; commercial</div>
      <div class="form-grid">
        <div class="ff"><label>PMS</label><input id="m-pms" value="${esc(mc.pms)}" placeholder="Mews, Medialog…"></div>
        <div class="ff"><label>Messagerie</label><select id="m-msg"><option value="Noreply" ${mc.messagerie!=='Client'?'selected':''}>Noreply</option><option value="Client" ${mc.messagerie==='Client'?'selected':''}>Client</option></select></div>
        <div class="ff"><label>Risque churn</label><select id="m-danger">${DANGERS.map(d=>`<option value="${d}" ${mc.danger===d?'selected':''}>${d}</option>`).join('')}</select></div>

        <div class="ff"><label>Nb modules</label><input type="number" id="m-mod" value="${mc.modules||0}" min="0"></div>
        <div class="ff"><label>Contrat</label><select id="m-contrat"><option value="non" ${mc.contrat==='non'?'selected':''}>non</option><option value="oui" ${mc.contrat==='oui'?'selected':''}>oui</option><option value="en cours" ${mc.contrat==='en cours'?'selected':''}>en cours</option></select></div>

async function saveModal(id,isNew){
  const g=i=>(document.getElementById(i)||{value:''});
  const ch={
    nom:g('m-nom').value.trim(),groupe:g('m-groupe').value,secteur:g('m-secteur').value,
    ville:g('m-ville').value,etoiles:g('m-etoiles').value,referent:g('m-referent').value,
    email:g('m-email').value,tel:g('m-tel').value,site:g('m-site').value,
    pms:g('m-pms').value,messagerie:g('m-msg').value,danger:g('m-danger').value,
    potentiel:+g('m-pot').value,modules:+g('m-mod').value,contrat:g('m-contrat').value,
    priorite:+g('m-prio').value,appel:g('m-appel').value,
    nfc:+g('m-nfc').value,qr:+g('m-qr').value,mobile:+g('m-mob').value,
    webApp:g('m-webapp').checked,mobileV2:g('m-v2').checked,offline:g('m-offline').checked,
    checkin:g('m-checkin').checked,livret:g('m-livret').checked,gestionDemande:g('m-gd').checked,
    note:g('m-note').value
  };
  if(!ch.nom){flash('Le nom est obligatoire');return;}
  try{
    var r;
    if(isNew){
      r = await apiFetch('/wa/crmProspect/create', {method:'POST', body:JSON.stringify(ch)});
    } else {
      r = await apiFetch('/wa/crmProspect/update', {method:'POST', body:JSON.stringify({id:id, ...ch})});
    }
    if(!r.ok) throw new Error('http '+r.status);
    var saved = await r.json();
  }catch(e){ flash('Erreur d\'enregistrement'); return; }
  if(isNew){ clients.push(saved); }
  else{ const ex=clients.find(c=>c.id===id); if(ex) Object.assign(ex, saved); }
  closeModal();updateBadges();flash('Fiche enregistrée');
  if(view==='fiche'&&curId===id)showFiche(id);else renderList();
}

// CSV EXPORT
// ════════════════════════════════════════
function exportCSV(){
  const h=['ID','Nom','Groupe','Secteur','Ville','Étoiles','Risque','Potentiel','Contrat','Modules','PMS','Priorité','Appel','Référent','Email','Tél','Site','NFC%','QR%','Mobile%','WebApp','MobileV2','Offline','Check-in','Livret','Gestion','Messagerie','Note','Nb activités'];
  const rows=clients.map(c=>[c.id,c.nom,c.groupe,c.secteur,c.ville,c.etoiles,c.danger,c.potentiel,c.contrat,c.modules,c.pms,c.priorite,c.appel,c.referent,c.email,c.tel,c.site,c.nfc,c.qr,c.mobile,c.webApp?'oui':'non',c.mobileV2?'oui':'non',c.offline?'oui':'non',c.checkin?'oui':'non',c.livret?'oui':'non',c.gestionDemande?'oui':'non',c.messagerie,c.note,(c.journal||[]).length].map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`));
  const csv='﻿'+[h,...rows].map(r=>r.join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='sesame_crm_export.csv';a.click();
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
function flash(msg='Sauvegardé'){
  const t=document.getElementById('toast');t.textContent='✓ '+msg;t.style.display='block';
  clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';},2400);
}
